name: docker-build-box-object-backup

# Publishes the Box object backup's image to GHCR and scans the digest it pushed.
# Pull requests build and scan it in pr-checks.yml's box-object-backup-image job.
# Tags: sha-<short> on every run, `staging` on push. The job's compose file pins a
# digest, so publishing changes nothing that runs until the pin is bumped.

on:
  push:
    branches: [staging]
    paths: [scheduled-jobs/box-object-backup/**]
  workflow_dispatch:

permissions:
  contents: read

# Only the latest push's `staging` tag matters.
concurrency:
  group: docker-build-box-object-backup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build, push and scan GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/salk-harnessing-plants-initiative/box-object-backup
          tags: |
            type=raw,value=sha-${{ steps.sha.outputs.short }}
            type=raw,value=staging,enable=${{ github.event_name == 'push' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./scheduled-jobs/box-object-backup
          file: scheduled-jobs/box-object-backup/Dockerfile
          push: true
          # One manifest, so the pinned digest is the image itself
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan the pushed image for critical CVEs
        uses: aquasecurity/trivy-action@v0.35.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/salk-harnessing-plants-initiative/box-object-backup@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          exit-code: '1'
          trivyignores: '.trivyignore'
