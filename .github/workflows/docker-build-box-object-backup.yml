name: docker-build-box-object-backup

# Publishes the Box object backup's image to GHCR and scans the digest it pushed.
# Pull requests build and scan it in pr-checks.yml's box-object-backup-image job.
# Tags: sha-<short> on every run, `staging` on push. The job's compose file pins a
# digest, so publishing changes nothing that runs until the pin is bumped.

on:
  push:
    branches: [staging]
    paths: [scheduled-jobs/box-object-backup/**]
  workflow_dispatch:

permissions:
  contents: read

# Only the latest push's `staging` tag matters.
concurrency:
  group: docker-build-box-object-backup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build, push and scan GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/salk-harnessing-plants-initiative/box-object-backup
          tags: |
            type=raw,value=sha-${{ steps.sha.outputs.short }}
            type=raw,value=staging,enable=${{ github.event_name == 'push' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./scheduled-jobs/box-object-backup
          file: scheduled-jobs/box-object-backup/Dockerfile
          push: true
          # One manifest, so the pinned digest is the image itself
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan the pushed image for critical CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/salk-harnessing-plants-initiative/box-object-backup@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          exit-code: '1'
          trivyignores: '.trivyignore'
