name: release-bloomcli

# Builds and publishes the bloomctl package to PyPI.
#
# Trigger: a *published* GitHub Release (the developer-gated entry point, with a
# home for release notes and a pre-release flag) or a manual workflow_dispatch.
#
# A dispatch run validates + builds + smoke-tests but NEVER publishes — use it
# as a dry run. There is intentionally no push/tag publish trigger.
#
# The validate-release job gates build-and-publish (`needs:`), so an immutable
# PyPI upload can only happen after tag/version/changelog/lint/test checks pass
# and the freshly built wheel has been imported and run (`bloomctl --version`).
#
# Auth is PyPI trusted publishing (OIDC) — no API token is stored. The publisher
# is bound to this repo + this workflow filename + the `pypi` environment; that
# pending publisher must be registered on PyPI before the first release.
#
# Pre-releases (aN/bN/rcN) publish to real PyPI and are marked "pre-release" on
# the GitHub Release; `uvx bloomctl` ignores them unless `--prerelease=allow`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-bloomcli
  cancel-in-progress: false

defaults:
  run:
    working-directory: bloomcli

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    # Skip cleanly (not a failing run) when a Release belongs to a different
    # monorepo package (e.g. bloommcp-vX.Y.Z). workflow_dispatch has no release
    # tag, so it always passes this guard. See release-bloommcp.yml's
    # reciprocal guard.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'bloomctl-')
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(uv version | awk '{print $NF}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bloomctl version: $VERSION"

      # Release tag must equal the package version. Accepts `bloomctl-vX`, `vX`,
      # or a bare `X` tag by stripping the known prefixes.
      # Untrusted inputs (the release tag) go through env, never interpolated
      # into the script text, so a crafted tag can't break out of the command.
      - name: Validate tag matches version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG_VERSION="${TAG#bloomctl-v}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::Release tag ($TAG -> $TAG_VERSION) does not match bloomcli/pyproject.toml version ($VERSION)"
            exit 1
          fi
          echo "Tag $TAG matches version $VERSION"

      - name: Validate changelog entry exists
        if: github.event_name == 'release'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::No changelog entry '## [$VERSION]' found in bloomcli/CHANGELOG.md"
            exit 1
          fi
          echo "Changelog entry found for $VERSION"

      # Lint via uvx (pinned to the repo's .pre-commit-config.yaml ruff version)
      # so ruff is not a project dependency.
      - name: Lint (ruff)
        run: uvx ruff@0.9.9 check .

      - name: Run tests
        # Exclude the env-gated integration test (needs live staging creds).
        run: uv run --extra test pytest -m "not integration" -q

  # Builds the artifact and proves it, WITHOUT the publishing credential.
  #
  # Every step here executes third-party code: `twine check`, and two smoke runs that
  # deliberately import the whole dependency chain — the second with --prerelease=allow,
  # which resolves every transitive dependency to its newest alpha or dev build. Slipping
  # an unnoticed malicious pre-release onto PyPI is a far lower bar than a stable release,
  # and #629 is proof that broken pre-releases of these exact packages do reach it.
  #
  # So this job carries no `id-token: write` and no `pypi` environment. Run inside the
  # publishing job, that code would execute alongside ACTIONS_ID_TOKEN_REQUEST_TOKEN and
  # with write access to the dist/ uploaded seconds later; `--isolated` isolates the
  # virtualenv, not the process.
  build-and-verify:
    name: Build and verify
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      # Point the published page at this exact release: repo links to the tag's commit
      # rather than a moving branch, and the install commands at the version being
      # published, so the README on each PyPI page installs the release it belongs to.
      # Rewrites the build checkout only — committed files stay on `main`.
      # No-op if nothing matches; skipped on workflow_dispatch dry runs.
      # Untrusted release tag goes through env, never inlined into script text.
      - name: Pin repo links and install commands to the release
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, re, pathlib
          tag = os.environ["TAG"]
          version = tag.removeprefix("bloomctl-v").removeprefix("v")
          subs = [
              (r'/tree/[^/]+/bloomcli', f'/tree/{tag}/bloomcli'),
              (r'/blob/[^/]+/bloomcli/CHANGELOG\.md', f'/blob/{tag}/bloomcli/CHANGELOG.md'),
              (r'bloomctl==[^"\s]+', f'bloomctl=={version}'),
              (r'bloomctl@[^\s]+', f'bloomctl@{version}'),
          ]
          for name in ("pyproject.toml", "README.pypi.md"):
              p = pathlib.Path(name)
              s = p.read_text()
              for pat, repl in subs:
                  s = re.sub(pat, repl, s)
              p.write_text(s)
              print(f"--- {name} ---")
              print(s)
          PY

      - name: Build sdist + wheel
        run: uv build

      # Recorded before anything third-party runs. Every step below deliberately executes
      # dependency code — that is how they prove the wheel works — and they run with write
      # access to dist/. Removing the credential from the publishing job stops an attacker
      # minting a token; it does not stop them swapping the parcel a trusted job then
      # uploads. The checksum is what makes that swap fail instead of ship.
      - name: Record the built artifact's checksum
        run: sha256sum dist/* | tee dist.sha256

      # Validate packaging metadata (e.g. long-description rendering) so a
      # malformed README/metadata fails here, before the immutable PyPI upload.
      - name: Check package metadata
        run: uvx twine check dist/*

      # Prove the wheel works before the upload, which can't be undone.
      #
      # Commands import supabase lazily, so `import bloomctl` alone stays green while
      # every real command dies — this imports the whole chain instead. It runs twice
      # because --pre applies to every dependency, not just bloomctl; a failure on the
      # second pass means a dependency needs an upper bound — or, if it is someone else's
      # broken beta, that the release waits rather than being capped against it (#629).
      - name: Verify wheel imports
        run: |
          cat > /tmp/import_smoke.py <<'PY'
          import importlib
          import pkgutil

          import bloomctl

          for module in pkgutil.walk_packages(bloomctl.__path__, "bloomctl."):
              importlib.import_module(module.name)

          from postgrest import APIError  # noqa: F401
          from supabase import create_client  # noqa: F401

          print("import smoke OK", bloomctl.__version__)
          PY
          echo "== default resolution =="
          uv run --isolated --no-project --with dist/*.whl python /tmp/import_smoke.py
          echo "== pre-release resolution =="
          uv run --isolated --no-project --prerelease=allow --with dist/*.whl python /tmp/import_smoke.py

      # Not `bloomctl --version`: that prints the same string whether the console script
      # points at the handler or straight at the bare CLI, so it cannot tell a correctly
      # wired entry point from one that has quietly lost the last-resort handler (#629).
      # This runs the installed script on a command that raises, and demands a message.
      # Not `bloomctl --version`, and not a ClickException either: click handles those
      # itself and exits, so they read identically whether the console script points at
      # the handler or at the bare CLI. Only an *unhandled* exception tells the two apart.
      - name: Verify CLI entry point
        run: |
          uv run --isolated --no-project --with dist/*.whl bloomctl --version
          cat > /tmp/entrypoint_check.py <<'PY'
          import subprocess, sys, tempfile, os
          from importlib.metadata import entry_points

          # Read from the *installed* wheel, so this is about the artifact being published
          # rather than about the pyproject.toml in the checkout.
          script = next(e for e in entry_points(group="console_scripts") if e.name == "bloomctl")
          assert script.value == "bloomctl.errors:main", f"console script is {script.value}"

          env = {**os.environ, "HOME": tempfile.mkdtemp()}
          # `-c` a command that raises something click does not handle, through the
          # installed console script's own module path.
          done = subprocess.run(
              [sys.executable, "-c",
               "import click, bloomctl.cli as c\n"
               "@click.command()\n"
               "def boom(): raise RuntimeError('nobody planned for this')\n"
               "c.cli = boom\n"
               "from bloomctl import errors\n"
               "raise SystemExit(errors.main(args=[]))\n"],
              capture_output=True, text=True, env=env,
          )
          print(done.stdout, done.stderr)
          assert done.returncode == 1, f"expected exit 1, got {done.returncode}"
          assert "Error: nobody planned for this" in done.stderr, "no one-line message"
          assert "Traceback" not in done.stderr, "a stack trace reached the user"
          assert "Details written to" in done.stderr, "the traceback was not recorded"
          print("entry point wired: unhandled failure became a message plus a log")
          PY
          uv run --isolated --no-project --with dist/*.whl python /tmp/entrypoint_check.py

      - name: Verify the artifact is the one that was built
        run: sha256sum -c dist.sha256

      - name: Upload the verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloomctl-dist
          path: |
            bloomcli/dist/
            bloomcli/dist.sha256
          if-no-files-found: error

  # Holds the credential and does nothing else. It runs no third-party code: the artifact
  # was built and proved in build-and-verify, and `uv publish` only uploads the files.
  build-and-publish:
    name: Publish
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Download the verified artifact
        uses: actions/download-artifact@v4
        with:
          name: bloomctl-dist
          path: bloomcli/

      # The last point at which a swap could still be caught, and the only check standing
      # between the build job's filesystem and an upload that cannot be undone.
      - name: Verify the artifact matches what was built
        run: sha256sum -c dist.sha256

      # Publishes only on a real Release; a workflow_dispatch dry run stops here.
      - name: Publish to PyPI (trusted publishing)
        if: github.event_name == 'release'
        run: uv publish --trusted-publishing always
