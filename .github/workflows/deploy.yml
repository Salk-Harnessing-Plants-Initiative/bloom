name: Deploy

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      runner:
        description: 'Runner (ubuntu-latest ONLY for un-wedging CI; real deploys need self-hosted)'
        required: false
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted
          - ubuntu-latest

env:
  # Supabase CLI version — MUST match the value pinned in pr-checks.yml and
  # the version installed on the Salk deploy server. Before deploy each
  # migration step asserts `supabase --version` equals this.
  SUPABASE_VERSION: "2.92.1"

jobs:
  deploy-production:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
    # Escape hatch: workflow_dispatch can switch to ubuntu-latest to un-wedge
    # CI when the self-hosted runner is offline/hung. The deploy will still
    # fail (GitHub-hosted runners have no route to the Salk server), but
    # it fails fast instead of queuing for 24h.
    runs-on: ${{ github.event.inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "salk-network"]') }}
    timeout-minutes: 30
    environment: production
    concurrency:
      # Shared group for both prod and staging — only one deploy runs at a
      # time across the whole repo (single Salk server, single docker daemon).
      group: deploy-bloom
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # The runner is co-located with the deploy target (same host, running as
      # bloom-deploy). Env-file assembly uses direct local filesystem commands
      # rather than SSH/scp loopback — simpler, atomic, no network hop.

      - name: Snapshot existing .env.prod for rollback
        run: |
          cd ${{ secrets.PROD_DEPLOY_PATH }}
          if [ -f .env.prod ]; then
            cp -p .env.prod .env.prod.previous
            echo "Saved .env.prod as .env.prod.previous"
          else
            echo "No existing .env.prod — first deploy, skipping snapshot"
          fi

      - name: Install env defaults on server
        run: |
          # Write to .env.prod.next (not .env.prod). The real .env.prod
          # stays the last-good file until the atomic rename in the next
          # step. rm -f clears any stale .next from a previously-crashed
          # deploy so install doesn't refuse on an existing file.
          rm -f "${{ secrets.PROD_DEPLOY_PATH }}/.env.prod.next"
          install -m 600 "${{ github.workspace }}/.env.prod.defaults" \
            "${{ secrets.PROD_DEPLOY_PATH }}/.env.prod.next"

      - name: Append secrets, validate, and promote to .env.prod
        run: |
          set -euo pipefail
          umask 077
          f_next="${{ secrets.PROD_DEPLOY_PATH }}/.env.prod.next"
          f_final="${{ secrets.PROD_DEPLOY_PATH }}/.env.prod"

          # If anything fails before the atomic rename, remove the partial
          # .env.prod.next. The real .env.prod is untouched — this deploy
          # exits cleanly with the previous good env intact, so the next
          # deploy's snapshot step can't copy a poisoned file into
          # .env.prod.previous.
          _cleanup_on_interrupt() {
            echo "::warning::Interrupt during env assembly — removing partial .env.prod.next (last-good .env.prod preserved)" >&2
            rm -f "$f_next"
            exit 1
          }
          trap _cleanup_on_interrupt INT TERM HUP ERR

          # The `# _EOF_MARKER_` sentinel is the last line of the heredoc.
          # The validator rejects any env file whose last line isn't the
          # marker — guarantees truncated files never reach the rename.
          cat >> "$f_next" << 'SECRETS'
          POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}
          JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
          JWT_KEYS=${{ secrets.PROD_JWT_KEYS }}
          JWT_JWKS=${{ secrets.PROD_JWT_JWKS }}
          ANON_KEY=${{ secrets.PROD_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.PROD_ANON_KEY }}
          SERVICE_ROLE_KEY=${{ secrets.PROD_SERVICE_ROLE_KEY }}
          DB_ENC_KEY=${{ secrets.PROD_DB_ENC_KEY }}
          VAULT_ENC_KEY=${{ secrets.PROD_VAULT_ENC_KEY }}
          SUPAVISOR_ENC_KEY=${{ secrets.PROD_SUPAVISOR_ENC_KEY }}
          SECRET_KEY_BASE=${{ secrets.PROD_SECRET_KEY_BASE }}
          MINIO_ROOT_USER=${{ secrets.PROD_MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD=${{ secrets.PROD_MINIO_PASSWORD }}
          WORKFLOWS_SUPABASE_EMAIL=${{ secrets.PROD_WORKFLOWS_SUPABASE_EMAIL }}
          WORKFLOWS_SUPABASE_PASSWORD=${{ secrets.PROD_WORKFLOWS_SUPABASE_PASSWORD }}
          WORKFLOWS_K8S_TOKEN=${{ secrets.PROD_WORKFLOWS_K8S_TOKEN }}
          WORKFLOWS_K8S_CA_CERT=${{ secrets.PROD_WORKFLOWS_K8S_CA_CERT }}
          WORKFLOWS_K8S_API_URL=${{ secrets.PROD_WORKFLOWS_K8S_API_URL }}
          DASHBOARD_USERNAME=${{ secrets.PROD_DASHBOARD_USERNAME }}
          DASHBOARD_PASSWORD=${{ secrets.PROD_DASHBOARD_PASSWORD }}
          BLOOMMCP_API_KEY=${{ secrets.PROD_BLOOMMCP_API_KEY }}
          OPENAI_API_KEY=${{ secrets.PROD_OPENAI_API_KEY }}
          LANGCHAIN_API_KEY=${{ secrets.PROD_LANGCHAIN_API_KEY }}
          MINIO_DATA_PATH=${{ secrets.PROD_MINIO_DATA_PATH }}
          BLOOM_AGENT_KEY=${{ secrets.PROD_BLOOM_AGENT_KEY }}
          CLOUDFLARE_API_TOKEN=${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          # _EOF_MARKER_
          SECRETS

          # Validate under the trap so a bad file triggers cleanup.
          bash "${{ github.workspace }}/scripts/validate_env.sh" \
            "$f_next" \
            "${{ github.workspace }}/docker-compose.prod.yml"

          # Atomic rename: single syscall on the same filesystem. Either
          # .env.prod is fully replaced by the new file, or it stays the
          # old file — never a half-written state. Compose and future
          # snapshot steps only ever see a fully-assembled .env.prod.
          mv "$f_next" "$f_final"

          trap - INT TERM HUP ERR

      # Catches the case where the runner user (who writes .env.prod at mode 600)
      # and DEPLOY_USER (who reads it when docker compose runs) diverge. Without
      # this check, docker compose would silently read an empty env and every
      # service would start with blank credentials.
      - name: Verify DEPLOY_USER can read .env.prod
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "test -r ${{ secrets.PROD_DEPLOY_PATH }}/.env.prod" \
            || { echo "::error::DEPLOY_USER cannot read .env.prod — runner-user and DEPLOY_USER must match, or group-readable perms needed"; exit 1; }

      - name: Save previous SHA for rollback
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            mkdir -p '${{ secrets.PROD_DEPLOY_PATH }}.state'
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            git rev-parse HEAD > '${{ secrets.PROD_DEPLOY_PATH }}.state/previous_sha'
            echo \"Saved previous SHA: \$(cat '${{ secrets.PROD_DEPLOY_PATH }}.state/previous_sha')\"
          "

      - name: Pull latest code
        id: pull_prod
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo '::error::Working tree is dirty on production server — deploy aborted'
              echo 'Uncommitted changes detected:'
              git status --short
              echo ''
              echo 'Someone made local changes on the server. Resolve before deploying:'
              echo '  1. SSH to the server and commit + push the changes, or'
              echo '  2. Discard them: git checkout -- .'
              echo 'Previous deployment remains running.'
              exit 1
            fi
            BEFORE=\$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            AFTER=\$(git rev-parse HEAD)
            git diff --quiet \"\$BEFORE\" \"\$AFTER\" -- caddy/Caddyfile \
              && echo 'CADDYFILE_CHANGED=false' || echo 'CADDYFILE_CHANGED=true'
            git diff --quiet \"\$BEFORE\" \"\$AFTER\" -- volumes/api/kong.yml \
              && echo 'KONGFILE_CHANGED=false' || echo 'KONGFILE_CHANGED=true'
          " | tee /tmp/pull_prod.out
          changed=$(grep '^CADDYFILE_CHANGED=' /tmp/pull_prod.out | tail -1 | cut -d= -f2)
          echo "caddyfile_changed=${changed:-true}" >> "$GITHUB_OUTPUT"
          kong_changed=$(grep '^KONGFILE_CHANGED=' /tmp/pull_prod.out | tail -1 | cut -d= -f2)
          echo "kongfile_changed=${kong_changed:-true}" >> "$GITHUB_OUTPUT"

      - name: Verify Docker Compose version (>= 2.17 required for --wait-timeout)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            # set -euo pipefail: without this, an unparseable MAJOR/MINOR (e.g.
            # 'docker compose version --short' returning something unexpected)
            # would make the numeric -lt comparison below error out WITHOUT
            # failing the script — then the 'ok' line would print and the
            # deploy would proceed with a possibly-too-old Compose. Copilot
            # round-1 finding; we want the preflight to abort loudly on any
            # parse failure.
            set -euo pipefail
            COMPOSE_VER=\$(docker compose version --short 2>/dev/null | head -1)
            if [ -z \"\$COMPOSE_VER\" ]; then
              echo '::error::docker compose not found on server'
              exit 1
            fi
            # Strip leading 'v' — some installs report 'v2.21.0', which would
            # break the numeric comparison below (MAJOR=v2 is not -lt 2).
            COMPOSE_VER=\${COMPOSE_VER#v}
            MAJOR=\$(echo \"\$COMPOSE_VER\" | cut -d. -f1)
            MINOR=\$(echo \"\$COMPOSE_VER\" | cut -d. -f2)
            # Validate MAJOR and MINOR are integers. If 'docker compose version
            # --short' returns something we don't expect (e.g., 'dev' or empty
            # after the strip), the -lt comparison would error. Fail loudly.
            if ! [[ \"\$MAJOR\" =~ ^[0-9]+\$ && \"\$MINOR\" =~ ^[0-9]+\$ ]]; then
              echo \"::error::Could not parse Docker Compose version from '\$COMPOSE_VER' (MAJOR='\$MAJOR' MINOR='\$MINOR')\"
              exit 1
            fi
            # --wait arrived in Compose v2.1.1 (Oct 2021); --wait-timeout in
            # v2.17.0 (Mar 2023). Without --wait-timeout, --wait defaults to
            # waiting indefinitely — we want the 600s ceiling, so 2.17 is the
            # real minimum here.
            if [ \"\$MAJOR\" -lt 2 ] || { [ \"\$MAJOR\" -eq 2 ] && [ \"\$MINOR\" -lt 17 ]; }; then
              echo \"::error::Docker Compose \$COMPOSE_VER found — need >= 2.17 for --wait-timeout\"
              exit 1
            fi
            echo \"Docker Compose \$COMPOSE_VER ok\"
          "

      # Layer 1 — Cloudflare API token preflight. Catches revoked / wrong-
      # scope / accidentally-empty tokens before Caddy boots and burns
      # Let's Encrypt rate-limit budget on a Cloudflare flow that cannot
      # succeed. /user/tokens/verify needs no permission and works for any
      # valid token. Failure here = wrong token; fix the GH secret.
      - name: Cloudflare API token preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?PROD_CLOUDFLARE_API_TOKEN secret is empty or missing}"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          status=$(curl -sS -o /tmp/cf-verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          if [ "$status" != "200" ]; then
            echo "::error::Cloudflare /user/tokens/verify returned HTTP $status. Token rejected; refusing to deploy."
            exit 1
          fi
          if ! grep -q '"status":"active"' /tmp/cf-verify.json; then
            echo "::error::Cloudflare token verified but reports non-active status:"
            cat /tmp/cf-verify.json
            exit 1
          fi
          echo "Cloudflare API token is active."

      # bloommcp/data/ is gitignored, so `git reset --hard` above never renames
      # it. Without this step, docker-compose.prod.yml's TRAITS_DIR bind mount
      # would be backed by a fresh empty directory on `compose up`, silently
      # orphaning a populated legacy SLEAP_OUT_CSV directory from a prior
      # deploy — breaking bloommcp's qc_clean immediately, since it always
      # re-derives from raw input rather than only on first run. Idempotent:
      # no-ops on a fresh host or one already migrated. Must run BEFORE the
      # data-dir preflight below, so a genuinely fresh host still gets
      # TRAITS_DIR auto-created there rather than this step failing on a
      # missing source. (#477)
      - name: Migrate legacy bloommcp data directory name (production)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            sh scripts/migrate_bloommcp_legacy_traits_dir.sh
          "

      # Docker auto-creates a missing bind-mount source directory owned by the
      # daemon's user (root on this host), which the non-root bloommcp container
      # user then can't write into — the same class of bug fixed for `make
      # dev-up` by issue #472/PR #473, now closed for staging/production by
      # issue #474. Reuses the same script unmodified; see openspec/changes/
      # add-bloommcp-prod-staging-data-dir-preflight/design.md for why chmod 777
      # (not UID/GID matching) is used here too, and openspec/project.md's
      # "bloommcp data directories" constraint for the documented exception.
      - name: Provision bloommcp data directories (production)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            sh scripts/ensure_bloommcp_data_dirs.sh
          "

      - name: Deploy production stack
        run: |
          : "${PROD_DEPLOY_PATH:?PROD_DEPLOY_PATH secret must be set (empty → would cd to \$HOME)}"
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml --env-file .env.prod \
              up -d --build --remove-orphans --wait --wait-timeout 600
            echo 'Production deployed successfully!'
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps
          "
        env:
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}

      # Reload Caddy so bind-mounted Caddyfile changes take effect — `up -d` won't
      # recreate caddy when its image is unchanged, so config edits are otherwise ignored.
      - name: Reload Caddy config (production)
        if: steps.pull_prod.outputs.caddyfile_changed == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T caddy \
              caddy reload --config /etc/caddy/Caddyfile
          "

      # Layer 3 — Crash-loop detection. Caddyfile parse errors and missing
      # modules send caddy into a restart loop; each restart is another
      # ACME attempt against LE's rate-limit budget. Quick check, fail
      # fast, stop the container so it cannot keep retrying.
      - name: Caddy crash-loop check
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            cid=\$(docker compose -f docker-compose.prod.yml --env-file .env.prod ps -q caddy)
            if [ -z \"\$cid\" ]; then
              echo \"::error::caddy container is not running after deploy\"
              exit 1
            fi
            restarts=\$(docker inspect --format='{{.RestartCount}}' \"\$cid\")
            if [ \"\$restarts\" -gt 2 ]; then
              echo \"::error::Caddy restarted \$restarts times since deploy — likely Caddyfile parse error or missing plugin. Stopping caddy to halt further ACME attempts.\"
              echo '::group::caddy logs'
              docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail=100 caddy || true
              echo '::endgroup::'
              docker compose -f docker-compose.prod.yml --env-file .env.prod stop caddy || true
              exit 1
            fi
            echo \"caddy restart count: \$restarts\"
          "

      # Restart Kong so bind-mounted kong.yml changes take effect — `up -d`
      # won't recreate kong when its image/env is unchanged, so route/plugin
      # edits are otherwise ignored. Unlike Caddy, a full restart (not
      # `kong reload`) is required: Kong's declarative config is only
      # regenerated from the bind-mounted temp.yml by this container's
      # custom entrypoint at container START, and DB-less `kong reload` has
      # a documented history of not reliably applying config changes anyway.
      # See openspec/changes/archive/2026-08-09-fix-kong-reload-on-deploy/design.md Decision 1.
      - name: Restart Kong config (production)
        id: restart_kong_prod
        if: steps.pull_prod.outputs.kongfile_changed == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            cid=\$(docker compose -f docker-compose.prod.yml --env-file .env.prod ps -q kong)
            if [ -z \"\$cid\" ]; then
              echo \"::error::kong container is not running before restart\"
              exit 1
            fi
            before=\$(docker inspect --format='{{.RestartCount}}' \"\$cid\")
            echo \"BEFORE_RESTART_COUNT=\$before\"
            # Wrap in an external timeout — --timeout 10 only bounds Docker's
            # own graceful-stop grace period, not the whole command's wall
            # time if the Docker daemon itself is unresponsive.
            timeout 60 docker compose -f docker-compose.prod.yml --env-file .env.prod restart kong --timeout 10
            # Poll for healthy instead of a flat sleep — Kong's healthcheck
            # start_period/interval/retries mean a merely-slow (not crashed)
            # boot can legitimately still be starting well past a short
            # fixed sleep. A timeout here doesn't fail the step; the
            # crash-loop check that follows decides pass/fail via
            # RestartCount. See design.md Decision 5. Extracted into a
            # script (Decision 3) so this loop has real execution-level test
            # coverage instead of only ever running for the first time on a
            # live deploy.
            status=\$(bash scripts/wait_for_kong_healthy.sh \"\$cid\" 120) || true
            echo \"kong health status after restart: \$status\"
          " | tee /tmp/restart_kong_prod.out
          before=$(grep '^BEFORE_RESTART_COUNT=' /tmp/restart_kong_prod.out | tail -1 | cut -d= -f2)
          # Deliberately no ':-0' fallback here, unlike caddyfile_changed's
          # fail-toward-action default: defaulting a missing/malformed count
          # to 0 would inflate the crash-loop check's delta and could stop a
          # perfectly healthy kong. An empty value instead fails the next
          # step's own usage-error validation (exit 2) — the deploy still
          # correctly fails, but without a false-positive "stop kong" action.
          echo "before_restart_count=${before}" >> "$GITHUB_OUTPUT"

      # Delta-based crash-loop check: unlike Caddy's absolute threshold, the
      # restart step above deliberately restarts Kong via `docker compose
      # restart` as its normal, successful-path action. That kind of restart
      # does not itself move RestartCount (it only moves when Docker's
      # `restart: unless-stopped` policy retries the container after an
      # unexpected exit), so the happy-path delta is 0. Only unplanned
      # restarts beyond that indicate a bad config. See design.md Decision 2.
      - name: Kong crash-loop check (production)
        if: steps.pull_prod.outputs.kongfile_changed == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            ANON_KEY=\$(grep '^ANON_KEY=' .env.prod | cut -d= -f2-)
            SERVICE_ROLE_KEY=\$(grep '^SERVICE_ROLE_KEY=' .env.prod | cut -d= -f2-)
            BLOOM_AGENT_KEY=\$(grep '^BLOOM_AGENT_KEY=' .env.prod | cut -d= -f2-)
            DASHBOARD_USERNAME=\$(grep '^DASHBOARD_USERNAME=' .env.prod | cut -d= -f2-)
            DASHBOARD_PASSWORD=\$(grep '^DASHBOARD_PASSWORD=' .env.prod | cut -d= -f2-)
            : \"\${ANON_KEY:?missing ANON_KEY in .env.prod}\"
            : \"\${SERVICE_ROLE_KEY:?missing SERVICE_ROLE_KEY in .env.prod}\"
            : \"\${BLOOM_AGENT_KEY:?missing BLOOM_AGENT_KEY in .env.prod}\"
            : \"\${DASHBOARD_USERNAME:?missing DASHBOARD_USERNAME in .env.prod}\"
            : \"\${DASHBOARD_PASSWORD:?missing DASHBOARD_PASSWORD in .env.prod}\"
            echo \"::add-mask::\$ANON_KEY\"
            echo \"::add-mask::\$SERVICE_ROLE_KEY\"
            echo \"::add-mask::\$BLOOM_AGENT_KEY\"
            echo \"::add-mask::\$DASHBOARD_USERNAME\"
            echo \"::add-mask::\$DASHBOARD_PASSWORD\"
            bash scripts/check_kong_restart_delta.sh \
              \"${{ steps.restart_kong_prod.outputs.before_restart_count }}\" 2 -- \
              docker compose -f docker-compose.prod.yml --env-file .env.prod
          "

      # Layer 2 — Verify Caddy obtained a real Let's Encrypt cert. First
      # deploy: ACME takes 30-90s per SAN, polled up to 180s total. Phase 1
      # of the bloom.salk.edu migration uses a 4-SAN cert (new apex +
      # wildcard, plus legacy apex + wildcard); each SAN requires its own
      # sequential DNS-01 challenge through the dns_challenge_override_domain,
      # so the timeout was raised from 120s to 180s to accommodate. Subsequent
      # redeploys: cached cert served instantly, first check passes. Failure
      # here = Cloudflare flow is broken (token, CNAME, or plugin) and Caddy
      # will keep retrying — stop the container to protect the LE budget.
      - name: Verify Caddy obtained a Let's Encrypt cert
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            DOMAIN_MAIN=\$(grep '^DOMAIN_MAIN=' .env.prod | cut -d= -f2-)
            PORT=\$(grep '^CADDY_HTTPS_LISTEN_PORT=' .env.prod | cut -d= -f2-)
            : \"\${DOMAIN_MAIN:?missing DOMAIN_MAIN in .env.prod}\"
            : \"\${PORT:?missing CADDY_HTTPS_LISTEN_PORT in .env.prod}\"

            issuer=
            for _ in \$(seq 1 24); do
              issuer=\$(echo | openssl s_client -connect 127.0.0.1:\$PORT -servername \"\$DOMAIN_MAIN\" 2>/dev/null | openssl x509 -noout -issuer 2>/dev/null || true)
              if echo \"\$issuer\" | grep -qi encrypt; then
                echo \"Real Let's Encrypt cert active: \$issuer\"
                exit 0
              fi
              sleep 5
            done
            echo \"::error::Caddy did not obtain a real Let's Encrypt cert within 180s. Stopping caddy to protect LE rate limits.\"
            echo \"Last observed issuer: \$issuer\"
            docker compose -f docker-compose.prod.yml --env-file .env.prod stop caddy || true
            exit 1
          "

      - name: Deploy diagnostics on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            echo '::group::docker compose ps'
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps || true
            echo '::endgroup::'
            echo '::group::docker compose logs --tail=200'
            docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail=200 || true
            echo '::endgroup::'
          "

      - name: Smoke test
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            # Connectivity smoke test — hits 5 endpoints through Caddy and
            # asserts each returns a 2xx/3xx:
            #   1. <main>/                bloom-web frontend
            #   2. <studio>/              Studio UI
            #   3. <minio>/               MinIO console
            #   4. <main>/api/rest/v1/    Kong key-auth -> ACL -> REST -> DB
            #                             (sends apikey header)
            #   5. <main>/api/client-info bloom-web public config (issue #347 —
            #                             must NOT 401 via Kong's basic-auth)
            #
            # Probes HTTPS directly via --resolve (forces domain -> 127.0.0.1)
            # so the test works regardless of whether CADDY_HTTPS_LISTEN_PORT
            # is 443 (prod) or 8443 (staging). Avoids the HTTP -> HTTPS redirect
            # dance that fails when the redirect target port isn't published.
            DOMAIN_MAIN=\$(grep '^DOMAIN_MAIN=' .env.prod | cut -d= -f2-)
            DOMAIN_STUDIO=\$(grep '^DOMAIN_STUDIO=' .env.prod | cut -d= -f2-)
            # Studio sits behind Kong's basic-auth, so an unauthenticated probe
            # correctly returns 401. Send the credentials so this still checks
            # that Studio is actually served, not just that something answered.
            DASHBOARD_USERNAME=\$(grep '^DASHBOARD_USERNAME=' .env.prod | cut -d= -f2-)
            DASHBOARD_PASSWORD=\$(grep '^DASHBOARD_PASSWORD=' .env.prod | cut -d= -f2-)
            echo \"::add-mask::\$DASHBOARD_PASSWORD\"
            STUDIO_AUTH=\"Authorization: Basic \$(printf '%s:%s' \"\$DASHBOARD_USERNAME\" \"\$DASHBOARD_PASSWORD\" | base64 | tr -d '\n')\"
            DOMAIN_MINIO=\$(grep '^DOMAIN_MINIO=' .env.prod | cut -d= -f2-)
            PORT=\$(grep '^CADDY_HTTPS_LISTEN_PORT=' .env.prod | cut -d= -f2-)
            ANON_KEY=\$(grep '^ANON_KEY=' .env.prod | cut -d= -f2-)
            : \"\${DOMAIN_MAIN:?missing DOMAIN_MAIN in .env.prod}\"
            : \"\${DOMAIN_STUDIO:?missing DOMAIN_STUDIO in .env.prod}\"
            : \"\${DOMAIN_MINIO:?missing DOMAIN_MINIO in .env.prod}\"
            : \"\${PORT:?missing CADDY_HTTPS_LISTEN_PORT in .env.prod}\"
            : \"\${ANON_KEY:?missing ANON_KEY in .env.prod}\"
            echo \"::add-mask::\$ANON_KEY\"

            failed=0
            _probe() {
              local host=\"\$1\" path=\"\$2\" extra=\"\${3:-}\" expected=\"\${4:-}\"
              # Retry up to 3 times on connection failure (status 000). Normal
              # path: Caddy serves a cached Let's Encrypt cert verified by the
              # earlier Layer 2 step — should respond instantly. Break-glass
              # path (manual \`tls internal\` in the Caddyfile): certs generate
              # lazily on the first handshake; the first probe can race the
              # cert generation, hence the retry loop.
              local status=000
              for _ in 1 2 3; do
                if [ -n \"\$extra\" ]; then
                  status=\$(curl -sk -o /dev/null -w '%{http_code}' --resolve \"\$host:\$PORT:127.0.0.1\" -H \"\$extra\" --max-time 10 \"https://\$host:\$PORT\$path\" || echo 000)
                else
                  status=\$(curl -sk -o /dev/null -w '%{http_code}' --resolve \"\$host:\$PORT:127.0.0.1\" --max-time 10 \"https://\$host:\$PORT\$path\" || echo 000)
                fi
                [ \"\$status\" != \"000\" ] && break
                sleep 2
              done
              if [ -n \"\$expected\" ]; then
                # Exact-status probe: the specific code IS the assertion. An
                # unauthenticated 401 proves the Kong basic-auth gate sits in front of
                # Studio. The range check below would pass on the 200 Studio returns when
                # Caddy proxies it directly -- i.e. exactly when the gate is missing.
                if [ \"\$status\" != \"\$expected\" ]; then
                  echo \"::error::Smoke test failed on \$host\$path (HTTP \$status, expected \$expected)\"
                  failed=1
                else
                  echo \"  \$host\$path -> \$status (expected \$expected)\"
                fi
              elif [ \"\$status\" -lt 200 ] || [ \"\$status\" -ge 400 ]; then
                echo \"::error::Smoke test failed on \$host\$path (HTTP \$status)\"
                failed=1
              else
                echo \"  \$host\$path -> \$status\"
              fi
            }

            _probe \"\$DOMAIN_MAIN\"   \"/\"
            # Unauthenticated first: this is the probe that proves the gate exists.
            # Without it, a deploy where the Caddy reload never applied serves Studio
            # directly, answers 200 to the credentialed probe below, and passes.
            _probe \"\$DOMAIN_STUDIO\" \"/\" \"\" 401
            # A second unauthenticated probe on a path that is NOT the root. Every
            # bypass found in review lives off /: a sibling host matcher outside the
            # audited Caddy block, a `to` upstream inside a reverse_proxy option
            # block, an imported snippet. Config-shape unit tests cannot see those
            # (and do not run on this workflow at all -- pr-checks.yml is
            # pull_request-only), so this request is the gate's real regression test.
            # /api/platform/pg-meta/query is Studio's arbitrary-SQL endpoint, which
            # makes it the path that matters most if the gate is ever missing.
            _probe \"\$DOMAIN_STUDIO\" \"/api/platform/pg-meta/query\" \"\" 401
            _probe \"\$DOMAIN_STUDIO\" \"/\" \"\$STUDIO_AUTH\"
            _probe \"\$DOMAIN_MINIO\"  \"/\"
            _probe \"\$DOMAIN_MAIN\"   \"/api/rest/v1/\" \"apikey: \$ANON_KEY\"
            _probe \"\$DOMAIN_MAIN\"   \"/api/client-info\"

            exit \$failed
          "

      # Duplicate of the diagnostics step above. GH Actions evaluates `if:
      # failure()` based on whether any PRIOR step in the job failed — so a
      # diagnostics step placed BEFORE the smoke test only fires on deploy-step
      # failures. For routing/app failures caught by the smoke test, we need
      # another diagnostics step AFTER it. Copilot round-1 finding.
      - name: Smoke-test diagnostics on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            echo '::group::docker compose ps'
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps || true
            echo '::endgroup::'
            echo '::group::docker compose logs --tail=200'
            docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail=200 || true
            echo '::endgroup::'
          "

      # storage-api creates `storage.buckets` asynchronously on startup. The
      # container-level healthcheck signals "Fastify listening" — NOT "schema
      # ready". Poll for the table so migrations that reference it don't race
      # storage-api's internal init. (Preserves the polling intent from #138
      # item 1, positioned post-health-check to fit PR #142's structure.)
      - name: Wait for storage schema (production)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            PG_PASSWORD=\$(grep '^POSTGRES_PASSWORD=' .env.prod | cut -d= -f2-)
            for i in \$(seq 1 60); do
              if docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T \
                   -e PGPASSWORD=\"\$PG_PASSWORD\" db-prod \
                   psql -U supabase_admin -d postgres -tAc \
                   \"SELECT 1 FROM information_schema.tables WHERE table_schema='storage' AND table_name='buckets'\" 2>/dev/null \
                   | grep -q '^1\$'; then
                echo 'storage.buckets ready (attempt '\$i')'
                exit 0
              fi
              sleep 2
            done
            echo '::error::storage.buckets did not appear within 120s — storage-api schema init failed'
            exit 1
          "

      # Gate: only invoke `supabase db push` when pending > 0. Parses
      # `supabase migration list` output — rows with a LOCAL timestamp but
      # no REMOTE timestamp are pending migrations. `--debug` is required to
      # dodge supabase/cli#4839 (TLS handshake against non-TLS Postgres).
      # Fail-open: any SSH/CLI error, empty stdout, or header-only output
      # produces `pending=unknown`, which the Apply step's `!= '0'` check
      # treats as "run the push" — never silently skip on ambiguous signal.
      - name: Check for pending migrations (production)
        id: check_migrations_prod
        run: |
          echo "::add-mask::${{ secrets.PROD_POSTGRES_PASSWORD }}"
          PENDING=$(ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            bash scripts/deploy_run_supabase.sh prod 'migration list --debug' 2>/dev/null \
              | awk -F'|' 'NR>2 && \$1 ~ /[0-9]{14}/ && \$2 !~ /[0-9]/ {c++} END { if (NR < 3) { print \"unknown\"; exit 2 } print c+0 }'
          ") || PENDING="unknown"
          case "$PENDING" in ''|*[!0-9]*) PENDING="unknown" ;; esac
          if [ "$PENDING" = "unknown" ]; then
            echo "pending=unknown" >> "$GITHUB_OUTPUT"
            echo "::warning title=Migrations::Could not determine pending migration count — forcing db push (fail-open)"
            echo "⚠️ Migration gate (prod): unable to parse \`supabase migration list\` output — forcing \`db push\` (fail-open)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PENDING" -eq 0 ]; then
            echo "pending=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=Migrations::No pending migrations — skipping db push"
            echo "ℹ️ Migration gate (prod): 0 pending — \`supabase db push\` skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
            echo "::notice title=Migrations::$PENDING pending migration(s) — running db push"
            echo "✅ Migration gate (prod): $PENDING pending — running \`supabase db push\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Apply migrations via Supabase CLI (installed on the Salk server per #135).
      # Extract only Postgres connection vars — avoids leaking JWT_SECRET / keys
      # into the subprocess environment. The `: "${VAR:?msg}"` guards fail the
      # remote script with a clear error if any key is missing from .env.prod,
      # rather than letting `supabase db push` fail later with a cryptic URL
      # parse / auth error.
      - name: Apply database migrations (production)
        id: migrate_prod
        if: steps.check_migrations_prod.outputs.pending != '0'
        env:
          EXPECTED_CLI_VERSION: ${{ env.SUPABASE_VERSION }}
        run: |
          echo "::add-mask::${{ secrets.PROD_POSTGRES_PASSWORD }}"
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            command -v supabase >/dev/null || { echo '::error::supabase CLI not found on deploy host'; exit 1; }
            ACTUAL_CLI_VERSION=\$(supabase --version | tr -d '[:space:]')
            if [ \"\$ACTUAL_CLI_VERSION\" != \"$EXPECTED_CLI_VERSION\" ]; then
              echo \"::error::Supabase CLI version mismatch on server: expected $EXPECTED_CLI_VERSION, got \$ACTUAL_CLI_VERSION\"
              exit 1
            fi
            bash scripts/deploy_run_supabase.sh prod 'db push --debug --yes'
          " || {
            echo '::error title=Migration failed (production)::See the Migration summary at top of run and the Show-migration-status step for applied vs pending state.'
            exit 1
          }

      # Apply bloom_* schema-USAGE grants (supabase/grants/schema_grants.sql) as
      # supabase_admin — schema grants no-op under `supabase db push`. Mirrors CI/make.
      - name: Apply schema-USAGE grants (production)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            PG_PASSWORD=\$(grep '^POSTGRES_PASSWORD=' .env.prod | cut -d= -f2-)
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T \
              -e PGPASSWORD=\"\$PG_PASSWORD\" db-prod \
              psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
              < supabase/grants/schema_grants.sql
          " || {
            echo '::error title=Schema grants failed (production)::supabase/grants/schema_grants.sql could not be applied — see this step log for the psql error.'
            exit 1
          }

      # Layer B: diagnostic on any failure upstream. Lists applied vs pending
      # so on-call can see which migration broke without scrolling logs.
      - name: Show migration status on failure (production)
        if: failure() && steps.migrate_prod.outcome == 'failure'
        run: |
          echo "::add-mask::${{ secrets.PROD_POSTGRES_PASSWORD }}"
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            bash scripts/deploy_run_supabase.sh prod 'migration list --debug'
          " || echo '::warning::Could not fetch migration status'

      # Layer C: migration state as a fenced code block in the run summary.
      # Uses CLI's native text output (the `-o json` flag does NOT exist on
      # `migration list` in the pinned CLI version — see env.SUPABASE_VERSION).
      - name: Migration summary (production)
        if: always()
        run: |
          echo "::add-mask::${{ secrets.PROD_POSTGRES_PASSWORD }}"
          {
            echo "## Database migration state (production)"
            echo ""
            echo '```'
            ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
              cd ${{ secrets.PROD_DEPLOY_PATH }}
              bash scripts/deploy_run_supabase.sh prod 'migration list --debug'
            " 2>/dev/null || echo '(migration state fetch failed)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rollback on failure
        if: failure()
        run: |
          # DB state is NOT rolled back by this step. If `Apply database
          # migrations` succeeded before the failing step, the database is now
          # on a newer schema than the code being restored. Follow-up tracked
          # in issue #177.
          echo '::warning title=Database schema NOT reverted::Rollback reverts code only. If migrations were applied before failure, manual DB intervention may be required. See https://github.com/Salk-Harnessing-Plants-Initiative/bloom/issues/177.'
          # Same class of gap as the DB-schema warning above: if this job's
          # legacy-directory migration (issue #477) already renamed
          # bloommcp/data/SLEAP_OUT_CSV -> TRAITS_DIR before a LATER step
          # failed, this rollback's `git reset --hard` restores the pre-#477
          # code (and its unrenamed compose file) but does NOT reverse the
          # directory rename on disk. The reverted bloommcp then looks for
          # SLEAP_OUT_CSV, finds nothing, and Docker auto-creates an empty one
          # — the real trait data sits orphaned, invisible, at TRAITS_DIR.
          echo '::warning title=bloommcp data directory rename NOT reverted::If the bloommcp/data/SLEAP_OUT_CSV -> TRAITS_DIR migration (issue #477) ran earlier in this job, rollback does not reverse it. The restored pre-#477 code expects SLEAP_OUT_CSV and will get a fresh empty one from Docker while the real data sits at bloommcp/data/TRAITS_DIR. If this rollback follows a completed migration, manually rename bloommcp/data/TRAITS_DIR back to bloommcp/data/SLEAP_OUT_CSV on the deploy host.'
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -e
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            if [ -f '${{ secrets.PROD_DEPLOY_PATH }}.state/previous_sha' ]; then
              PREV=\$(cat '${{ secrets.PROD_DEPLOY_PATH }}.state/previous_sha')
              echo \"Rolling back to \$PREV\"
              if [ -f .env.prod.previous ]; then
                cp -p .env.prod.previous .env.prod
                echo 'Restored previous .env.prod (mode preserved)'
              else
                echo 'WARNING: no .env.prod.previous — rolling back with current .env.prod'
              fi
              git reset --hard \$PREV || { echo \"::error::Rollback failed: could not reset to \$PREV — SHA may be unreachable\"; exit 1; }
              # Rollback matches the forward deploy's strictness: use --wait so
              # we don't silently 'succeed' while the rolled-back stack is also
              # broken. Shorter 300s timeout (vs 600s forward) because rollback
              # reuses already-built images — cold-build is not in the critical
              # path.
              docker compose -f docker-compose.prod.yml --env-file .env.prod \
                up -d --build --remove-orphans --wait --wait-timeout 300 \
                || { echo \"::error::Rollback reset to \$PREV succeeded but docker compose --wait failed — previous-version stack is also unhealthy, manual inspection required\"; exit 1; }
              # Same root cause as the reason this whole feature exists: up -d
              # cannot detect that kong.yml's bind-mounted CONTENT changed back
              # (only file-list/env/image changes trigger a recreate). If this
              # job's forward path already restarted Kong onto the now-reverted
              # kong.yml before a later step failed, Kong is still serving that
              # config after the reset above — explicitly restart it too so
              # rollback doesn't reintroduce the exact bug #634 fixed.
              kong_rollback_ok=true
              if [ \"${{ steps.pull_prod.outputs.kongfile_changed }}\" = \"true\" ]; then
                echo 'kong.yml changed during this deploy — restarting kong so the reverted config takes effect'
                kong_cid=\$(docker compose -f docker-compose.prod.yml --env-file .env.prod ps -q kong)
                if [ -z \"\$kong_cid\" ]; then
                  echo '::warning::kong container not found during rollback restart — skipping'
                  kong_rollback_ok=false
                elif ! timeout 60 docker compose -f docker-compose.prod.yml --env-file .env.prod restart kong --timeout 10; then
                  # A hiccup here is best-effort-recovery failing, not the
                  # rollback itself — the critical code/env revert above
                  # already succeeded. Warn instead of exit 1 so this
                  # secondary problem cannot mask that success under set -e.
                  echo '::warning::kong restart during rollback failed — kong may still be serving the prior unreverted config, verify manually on the deploy host'
                  kong_rollback_ok=false
                else
                  kong_status=\$(bash scripts/wait_for_kong_healthy.sh \"\$kong_cid\" 120) || true
                  echo \"kong health status after rollback restart: \$kong_status\"
                  if [ \"\$kong_status\" != \"healthy\" ]; then
                    # A rollback that got this far already succeeded at the
                    # critical revert, but reporting an unqualified 'healthy'
                    # here would be false — Kong may still be down or stuck
                    # starting on the reverted config. Flag it instead of
                    # letting the unconditional success message below paper
                    # over it.
                    echo \"::warning::kong did not report healthy within 120s after rollback restart (status: \$kong_status) — the API gateway may still be down or serving the wrong config; verify manually on the deploy host\"
                    kong_rollback_ok=false
                  fi
                fi
              fi
              if [ \"\$kong_rollback_ok\" = \"true\" ]; then
                echo 'Rollback complete — previous version restored and healthy'
              else
                echo '::warning::Rollback complete — previous version code/env restored, but kong health could not be confirmed (see warning above) — verify manually on the deploy host'
                # Fail this step, not just warn — the critical code/env revert
                # above already succeeded, so this doesn't retroactively mark
                # that work as failed, but on-call scanning step colors in the
                # Actions UI (rather than reading annotations) would otherwise
                # miss that Kong may still be down after a 'successful' rollback.
                exit 1
              fi
            else
              echo '::error::No previous SHA saved — manual recovery required'
              exit 1
            fi
          "

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/staging' || github.event.inputs.environment == 'staging'
    # Escape hatch: see deploy-production for rationale.
    runs-on: ${{ github.event.inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "salk-network"]') }}
    timeout-minutes: 30
    environment: staging
    concurrency:
      # Shared group for both prod and staging — only one deploy runs at a
      # time across the whole repo (single Salk server, single docker daemon).
      group: deploy-bloom
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # The runner is co-located with the deploy target (same host, running as
      # bloom-deploy). Env-file assembly uses direct local filesystem commands
      # rather than SSH/scp loopback — simpler, atomic, no network hop.

      - name: Snapshot existing .env.staging for rollback
        run: |
          cd ${{ secrets.STAGING_DEPLOY_PATH }}
          if [ -f .env.staging ]; then
            cp -p .env.staging .env.staging.previous
            echo "Saved .env.staging as .env.staging.previous"
          else
            echo "No existing .env.staging — first deploy, skipping snapshot"
          fi

      - name: Install env defaults on server
        run: |
          # Write to .env.staging.next (atomic-rename pattern) — see prod step.
          rm -f "${{ secrets.STAGING_DEPLOY_PATH }}/.env.staging.next"
          install -m 600 "${{ github.workspace }}/.env.staging.defaults" \
            "${{ secrets.STAGING_DEPLOY_PATH }}/.env.staging.next"

      - name: Append secrets, validate, and promote to .env.staging
        # Atomic-rename pattern mirrors prod; see prod step for full rationale.
        run: |
          set -euo pipefail
          umask 077
          f_next="${{ secrets.STAGING_DEPLOY_PATH }}/.env.staging.next"
          f_final="${{ secrets.STAGING_DEPLOY_PATH }}/.env.staging"

          _cleanup_on_interrupt() {
            echo "::warning::Interrupt during env assembly — removing partial .env.staging.next (last-good .env.staging preserved)" >&2
            rm -f "$f_next"
            exit 1
          }
          trap _cleanup_on_interrupt INT TERM HUP ERR

          cat >> "$f_next" << 'SECRETS'
          POSTGRES_PASSWORD=${{ secrets.STAGING_POSTGRES_PASSWORD }}
          JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
          JWT_KEYS=${{ secrets.STAGING_JWT_KEYS }}
          JWT_JWKS=${{ secrets.STAGING_JWT_JWKS }}
          ANON_KEY=${{ secrets.STAGING_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.STAGING_ANON_KEY }}
          SERVICE_ROLE_KEY=${{ secrets.STAGING_SERVICE_ROLE_KEY }}
          DB_ENC_KEY=${{ secrets.STAGING_DB_ENC_KEY }}
          VAULT_ENC_KEY=${{ secrets.STAGING_VAULT_ENC_KEY }}
          SUPAVISOR_ENC_KEY=${{ secrets.STAGING_SUPAVISOR_ENC_KEY }}
          SECRET_KEY_BASE=${{ secrets.STAGING_SECRET_KEY_BASE }}
          MINIO_ROOT_USER=${{ secrets.STAGING_MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD=${{ secrets.STAGING_MINIO_PASSWORD }}
          WORKFLOWS_SUPABASE_EMAIL=${{ secrets.STAGING_WORKFLOWS_SUPABASE_EMAIL }}
          WORKFLOWS_SUPABASE_PASSWORD=${{ secrets.STAGING_WORKFLOWS_SUPABASE_PASSWORD }}
          WORKFLOWS_K8S_TOKEN=${{ secrets.STAGING_WORKFLOWS_K8S_TOKEN }}
          WORKFLOWS_K8S_CA_CERT=${{ secrets.STAGING_WORKFLOWS_K8S_CA_CERT }}
          WORKFLOWS_K8S_API_URL=${{ secrets.STAGING_WORKFLOWS_K8S_API_URL }}
          DASHBOARD_USERNAME=${{ secrets.STAGING_DASHBOARD_USERNAME }}
          DASHBOARD_PASSWORD=${{ secrets.STAGING_DASHBOARD_PASSWORD }}
          BLOOMMCP_API_KEY=${{ secrets.STAGING_BLOOMMCP_API_KEY }}
          OPENAI_API_KEY=${{ secrets.STAGING_OPENAI_API_KEY }}
          LANGCHAIN_API_KEY=${{ secrets.STAGING_LANGCHAIN_API_KEY }}
          MINIO_DATA_PATH=${{ secrets.STAGING_MINIO_DATA_PATH }}
          BLOOM_AGENT_KEY=${{ secrets.STAGING_BLOOM_AGENT_KEY }}
          CLOUDFLARE_API_TOKEN=${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          # _EOF_MARKER_
          SECRETS

          bash "${{ github.workspace }}/scripts/validate_env.sh" \
            "$f_next" \
            "${{ github.workspace }}/docker-compose.prod.yml"

          mv "$f_next" "$f_final"

          trap - INT TERM HUP ERR

      # See deploy-production's equivalent step for rationale.
      - name: Verify DEPLOY_USER can read .env.staging
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "test -r ${{ secrets.STAGING_DEPLOY_PATH }}/.env.staging" \
            || { echo "::error::DEPLOY_USER cannot read .env.staging — runner-user and DEPLOY_USER must match, or group-readable perms needed"; exit 1; }

      - name: Save previous SHA for rollback
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            mkdir -p '${{ secrets.STAGING_DEPLOY_PATH }}.state'
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            git rev-parse HEAD > '${{ secrets.STAGING_DEPLOY_PATH }}.state/previous_sha'
            echo \"Saved previous SHA: \$(cat '${{ secrets.STAGING_DEPLOY_PATH }}.state/previous_sha')\"
          "

      - name: Pull latest code
        id: pull_staging
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo '::error::Working tree is dirty on staging server — deploy aborted'
              echo 'Uncommitted changes detected:'
              git status --short
              echo ''
              echo 'Someone made local changes on the server. Resolve before deploying:'
              echo '  1. SSH to the server and commit + push the changes, or'
              echo '  2. Discard them: git checkout -- .'
              echo 'Previous deployment remains running.'
              exit 1
            fi
            BEFORE=\$(git rev-parse HEAD)
            git fetch origin staging
            git reset --hard origin/staging
            AFTER=\$(git rev-parse HEAD)
            git diff --quiet \"\$BEFORE\" \"\$AFTER\" -- caddy/Caddyfile \
              && echo 'CADDYFILE_CHANGED=false' || echo 'CADDYFILE_CHANGED=true'
            git diff --quiet \"\$BEFORE\" \"\$AFTER\" -- volumes/api/kong.yml \
              && echo 'KONGFILE_CHANGED=false' || echo 'KONGFILE_CHANGED=true'
          " | tee /tmp/pull_staging.out
          changed=$(grep '^CADDYFILE_CHANGED=' /tmp/pull_staging.out | tail -1 | cut -d= -f2)
          echo "caddyfile_changed=${changed:-true}" >> "$GITHUB_OUTPUT"
          kong_changed=$(grep '^KONGFILE_CHANGED=' /tmp/pull_staging.out | tail -1 | cut -d= -f2)
          echo "kongfile_changed=${kong_changed:-true}" >> "$GITHUB_OUTPUT"

      - name: Verify Docker Compose version (>= 2.17 required for --wait-timeout)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            # See prod version of this step for why set -euo pipefail is load-
            # bearing here (unparseable MAJOR/MINOR would otherwise silently
            # allow the deploy to proceed with a too-old Compose).
            set -euo pipefail
            COMPOSE_VER=\$(docker compose version --short 2>/dev/null | head -1)
            if [ -z \"\$COMPOSE_VER\" ]; then
              echo '::error::docker compose not found on server'
              exit 1
            fi
            # Strip leading 'v' — some installs report 'v2.21.0'.
            COMPOSE_VER=\${COMPOSE_VER#v}
            MAJOR=\$(echo \"\$COMPOSE_VER\" | cut -d. -f1)
            MINOR=\$(echo \"\$COMPOSE_VER\" | cut -d. -f2)
            if ! [[ \"\$MAJOR\" =~ ^[0-9]+\$ && \"\$MINOR\" =~ ^[0-9]+\$ ]]; then
              echo \"::error::Could not parse Docker Compose version from '\$COMPOSE_VER' (MAJOR='\$MAJOR' MINOR='\$MINOR')\"
              exit 1
            fi
            # --wait arrived in v2.1.1; --wait-timeout in v2.17. We need the
            # latter so the ceiling applies.
            if [ \"\$MAJOR\" -lt 2 ] || { [ \"\$MAJOR\" -eq 2 ] && [ \"\$MINOR\" -lt 17 ]; }; then
              echo \"::error::Docker Compose \$COMPOSE_VER found — need >= 2.17 for --wait-timeout\"
              exit 1
            fi
            echo \"Docker Compose \$COMPOSE_VER ok\"
          "

      # Check for Cloudflare API token for Lets Encrypt
      - name: Cloudflare API token preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?STAGING_CLOUDFLARE_API_TOKEN secret is empty or missing}"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          status=$(curl -sS -o /tmp/cf-verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          if [ "$status" != "200" ]; then
            echo "::error::Cloudflare /user/tokens/verify returned HTTP $status. Token rejected; refusing to deploy."
            exit 1
          fi
          if ! grep -q '"status":"active"' /tmp/cf-verify.json; then
            echo "::error::Cloudflare token verified but reports non-active status:"
            cat /tmp/cf-verify.json
            exit 1
          fi
          echo "Cloudflare API token is active."

      # See deploy-production's equivalent step for rationale. Must run BEFORE
      # the data-dir preflight below. (#477)
      - name: Migrate legacy bloommcp data directory name (staging)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            sh scripts/migrate_bloommcp_legacy_traits_dir.sh
          "

      # Docker auto-creates a missing bind-mount source directory owned by the
      # daemon's user (root on this host), which the non-root bloommcp container
      # user then can't write into — the same class of bug fixed for `make
      # dev-up` by issue #472/PR #473, now closed for staging/production by
      # issue #474. Reuses the same script unmodified; see openspec/changes/
      # add-bloommcp-prod-staging-data-dir-preflight/design.md for why chmod 777
      # (not UID/GID matching) is used here too, and openspec/project.md's
      # "bloommcp data directories" constraint for the documented exception.
      - name: Provision bloommcp data directories (staging)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            sh scripts/ensure_bloommcp_data_dirs.sh
          "

      - name: Deploy staging stack
        run: |
          : "${STAGING_DEPLOY_PATH:?STAGING_DEPLOY_PATH secret must be set (empty → would cd to \$HOME)}"
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            docker compose -p bloom_v2_staging -f docker-compose.prod.yml --env-file .env.staging \
              up -d --build --remove-orphans --wait --wait-timeout 600
            echo 'Staging deployed successfully!'
            docker compose -p bloom_v2_staging -f docker-compose.prod.yml --env-file .env.staging ps
          "
        env:
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}

      # Reload Caddy so bind-mounted Caddyfile changes take effect — `up -d` won't
      # recreate caddy when its image is unchanged, so config edits are otherwise ignored.
      - name: Reload Caddy config (staging)
        if: steps.pull_staging.outputs.caddyfile_changed == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            docker compose -p bloom_v2_staging -f docker-compose.prod.yml --env-file .env.staging exec -T caddy \
              caddy reload --config /etc/caddy/Caddyfile
          "

      # Layer 3 — Crash-loop detection. See deploy-production's equivalent
      # step for rationale.
      - name: Caddy crash-loop check
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            cid=\$(docker compose -p bloom_v2_staging -f docker-compose.prod.yml --env-file .env.staging ps -q caddy)
            if [ -z \"\$cid\" ]; then
              echo \"::error::caddy container is not running after deploy\"
              exit 1
            fi
            restarts=\$(docker inspect --format='{{.RestartCount}}' \"\$cid\")
            if [ \"\$restarts\" -gt 2 ]; then
              echo \"::error::Caddy restarted \$restarts times since deploy — likely Caddyfile parse error or missing plugin. Stopping caddy to halt further ACME attempts.\"
              echo '::group::caddy logs'
              docker compose -p bloom_v2_staging -f docker-compose.prod.yml --env-file .env.staging logs --tail=100 caddy || true
              echo '::endgroup::'
              docker compose -p bloom_v2_staging -f docker-compose.prod.yml --env-file .env.staging stop caddy || true
              exit 1
            fi
            echo \"caddy restart count: \$restarts\"
          "

      # Restart Kong so bind-mounted kong.yml changes take effect. See
      # deploy-production's equivalent step for rationale.
      - name: Restart Kong config (staging)
        id: restart_kong_staging
        if: steps.pull_staging.outputs.kongfile_changed == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            cid=\$(docker compose -p bloom_v2_staging -f docker-compose.prod.yml --env-file .env.staging ps -q kong)
            if [ -z \"\$cid\" ]; then
              echo \"::error::kong container is not running before restart\"
              exit 1
            fi
            before=\$(docker inspect --format='{{.RestartCount}}' \"\$cid\")
            echo \"BEFORE_RESTART_COUNT=\$before\"
            timeout 60 docker compose -p bloom_v2_staging -f docker-compose.prod.yml --env-file .env.staging restart kong --timeout 10
            status=\$(bash scripts/wait_for_kong_healthy.sh \"\$cid\" 120) || true
            echo \"kong health status after restart: \$status\"
          " | tee /tmp/restart_kong_staging.out
          before=$(grep '^BEFORE_RESTART_COUNT=' /tmp/restart_kong_staging.out | tail -1 | cut -d= -f2)
          # Deliberately no ':-0' fallback here, unlike caddyfile_changed's
          # fail-toward-action default: defaulting a missing/malformed count
          # to 0 would inflate the crash-loop check's delta and could stop a
          # perfectly healthy kong. An empty value instead fails the next
          # step's own usage-error validation (exit 2) — the deploy still
          # correctly fails, but without a false-positive "stop kong" action.
          echo "before_restart_count=${before}" >> "$GITHUB_OUTPUT"

      # See deploy-production's equivalent step for rationale.
      - name: Kong crash-loop check (staging)
        if: steps.pull_staging.outputs.kongfile_changed == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            ANON_KEY=\$(grep '^ANON_KEY=' .env.staging | cut -d= -f2-)
            SERVICE_ROLE_KEY=\$(grep '^SERVICE_ROLE_KEY=' .env.staging | cut -d= -f2-)
            BLOOM_AGENT_KEY=\$(grep '^BLOOM_AGENT_KEY=' .env.staging | cut -d= -f2-)
            DASHBOARD_USERNAME=\$(grep '^DASHBOARD_USERNAME=' .env.staging | cut -d= -f2-)
            DASHBOARD_PASSWORD=\$(grep '^DASHBOARD_PASSWORD=' .env.staging | cut -d= -f2-)
            : \"\${ANON_KEY:?missing ANON_KEY in .env.staging}\"
            : \"\${SERVICE_ROLE_KEY:?missing SERVICE_ROLE_KEY in .env.staging}\"
            : \"\${BLOOM_AGENT_KEY:?missing BLOOM_AGENT_KEY in .env.staging}\"
            : \"\${DASHBOARD_USERNAME:?missing DASHBOARD_USERNAME in .env.staging}\"
            : \"\${DASHBOARD_PASSWORD:?missing DASHBOARD_PASSWORD in .env.staging}\"
            echo \"::add-mask::\$ANON_KEY\"
            echo \"::add-mask::\$SERVICE_ROLE_KEY\"
            echo \"::add-mask::\$BLOOM_AGENT_KEY\"
            echo \"::add-mask::\$DASHBOARD_USERNAME\"
            echo \"::add-mask::\$DASHBOARD_PASSWORD\"
            bash scripts/check_kong_restart_delta.sh \
              \"${{ steps.restart_kong_staging.outputs.before_restart_count }}\" 2 -- \
              docker compose -p bloom_v2_staging -f docker-compose.prod.yml --env-file .env.staging
          "

      # Layer 2 — Verify Caddy obtained a real Let's Encrypt cert. See
      # deploy-production's equivalent step for rationale.
      - name: Verify Caddy obtained a Let's Encrypt cert
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            DOMAIN_MAIN=\$(grep '^DOMAIN_MAIN=' .env.staging | cut -d= -f2-)
            PORT=\$(grep '^CADDY_HTTPS_LISTEN_PORT=' .env.staging | cut -d= -f2-)
            : \"\${DOMAIN_MAIN:?missing DOMAIN_MAIN in .env.staging}\"
            : \"\${PORT:?missing CADDY_HTTPS_LISTEN_PORT in .env.staging}\"

            issuer=
            for _ in \$(seq 1 24); do
              issuer=\$(echo | openssl s_client -connect 127.0.0.1:\$PORT -servername \"\$DOMAIN_MAIN\" 2>/dev/null | openssl x509 -noout -issuer 2>/dev/null || true)
              if echo \"\$issuer\" | grep -qi encrypt; then
                echo \"Real Let's Encrypt cert active: \$issuer\"
                exit 0
              fi
              sleep 5
            done
            echo \"::error::Caddy did not obtain a real Let's Encrypt cert within 180s. Stopping caddy to protect LE rate limits.\"
            echo \"Last observed issuer: \$issuer\"
            docker compose -p bloom_v2_staging -f docker-compose.prod.yml --env-file .env.staging stop caddy || true
            exit 1
          "

      - name: Deploy diagnostics on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            echo '::group::docker compose ps'
            docker compose -p bloom_v2_staging -f docker-compose.prod.yml --env-file .env.staging ps || true
            echo '::endgroup::'
            echo '::group::docker compose logs --tail=200'
            docker compose -p bloom_v2_staging -f docker-compose.prod.yml --env-file .env.staging logs --tail=200 || true
            echo '::endgroup::'
          "

      - name: Smoke test
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            # Connectivity smoke test — hits 5 endpoints through Caddy and
            # asserts each returns a 2xx/3xx:
            #   1. <main>/                bloom-web frontend
            #   2. <studio>/              Studio UI
            #   3. <minio>/               MinIO console
            #   4. <main>/api/rest/v1/    Kong key-auth -> ACL -> REST -> DB
            #                             (sends apikey header)
            #   5. <main>/api/client-info bloom-web public config (issue #347 —
            #                             must NOT 401 via Kong's basic-auth)
            #
            # Probes HTTPS directly via --resolve (forces domain -> 127.0.0.1)
            # so the test works regardless of whether CADDY_HTTPS_LISTEN_PORT
            # is 443 (prod) or 8443 (staging). Avoids the HTTP -> HTTPS redirect
            # dance that fails when the redirect target port isn't published.
            DOMAIN_MAIN=\$(grep '^DOMAIN_MAIN=' .env.staging | cut -d= -f2-)
            DOMAIN_STUDIO=\$(grep '^DOMAIN_STUDIO=' .env.staging | cut -d= -f2-)
            # Studio sits behind Kong's basic-auth, so an unauthenticated probe
            # correctly returns 401. Send the credentials so this still checks
            # that Studio is actually served, not just that something answered.
            DASHBOARD_USERNAME=\$(grep '^DASHBOARD_USERNAME=' .env.staging | cut -d= -f2-)
            DASHBOARD_PASSWORD=\$(grep '^DASHBOARD_PASSWORD=' .env.staging | cut -d= -f2-)
            echo \"::add-mask::\$DASHBOARD_PASSWORD\"
            STUDIO_AUTH=\"Authorization: Basic \$(printf '%s:%s' \"\$DASHBOARD_USERNAME\" \"\$DASHBOARD_PASSWORD\" | base64 | tr -d '\n')\"
            DOMAIN_MINIO=\$(grep '^DOMAIN_MINIO=' .env.staging | cut -d= -f2-)
            PORT=\$(grep '^CADDY_HTTPS_LISTEN_PORT=' .env.staging | cut -d= -f2-)
            ANON_KEY=\$(grep '^ANON_KEY=' .env.staging | cut -d= -f2-)
            : \"\${DOMAIN_MAIN:?missing DOMAIN_MAIN in .env.staging}\"
            : \"\${DOMAIN_STUDIO:?missing DOMAIN_STUDIO in .env.staging}\"
            : \"\${DOMAIN_MINIO:?missing DOMAIN_MINIO in .env.staging}\"
            : \"\${PORT:?missing CADDY_HTTPS_LISTEN_PORT in .env.staging}\"
            : \"\${ANON_KEY:?missing ANON_KEY in .env.staging}\"
            echo \"::add-mask::\$ANON_KEY\"

            failed=0
            _probe() {
              local host=\"\$1\" path=\"\$2\" extra=\"\${3:-}\" expected=\"\${4:-}\"
              # Retry up to 3 times on connection failure (status 000). Normal
              # path: Caddy serves a cached Let's Encrypt cert verified by the
              # earlier Layer 2 step — should respond instantly. Break-glass
              # path (manual \`tls internal\` in the Caddyfile): certs generate
              # lazily on the first handshake; the first probe can race the
              # cert generation, hence the retry loop.
              local status=000
              for _ in 1 2 3; do
                if [ -n \"\$extra\" ]; then
                  status=\$(curl -sk -o /dev/null -w '%{http_code}' --resolve \"\$host:\$PORT:127.0.0.1\" -H \"\$extra\" --max-time 10 \"https://\$host:\$PORT\$path\" || echo 000)
                else
                  status=\$(curl -sk -o /dev/null -w '%{http_code}' --resolve \"\$host:\$PORT:127.0.0.1\" --max-time 10 \"https://\$host:\$PORT\$path\" || echo 000)
                fi
                [ \"\$status\" != \"000\" ] && break
                sleep 2
              done
              if [ -n \"\$expected\" ]; then
                # Exact-status probe: the specific code IS the assertion. An
                # unauthenticated 401 proves the Kong basic-auth gate sits in front of
                # Studio. The range check below would pass on the 200 Studio returns when
                # Caddy proxies it directly -- i.e. exactly when the gate is missing.
                if [ \"\$status\" != \"\$expected\" ]; then
                  echo \"::error::Smoke test failed on \$host\$path (HTTP \$status, expected \$expected)\"
                  failed=1
                else
                  echo \"  \$host\$path -> \$status (expected \$expected)\"
                fi
              elif [ \"\$status\" -lt 200 ] || [ \"\$status\" -ge 400 ]; then
                echo \"::error::Smoke test failed on \$host\$path (HTTP \$status)\"
                failed=1
              else
                echo \"  \$host\$path -> \$status\"
              fi
            }

            _probe \"\$DOMAIN_MAIN\"   \"/\"
            # Unauthenticated first: this is the probe that proves the gate exists.
            # Without it, a deploy where the Caddy reload never applied serves Studio
            # directly, answers 200 to the credentialed probe below, and passes.
            _probe \"\$DOMAIN_STUDIO\" \"/\" \"\" 401
            # A second unauthenticated probe on a path that is NOT the root. Every
            # bypass found in review lives off /: a sibling host matcher outside the
            # audited Caddy block, a `to` upstream inside a reverse_proxy option
            # block, an imported snippet. Config-shape unit tests cannot see those
            # (and do not run on this workflow at all -- pr-checks.yml is
            # pull_request-only), so this request is the gate's real regression test.
            # /api/platform/pg-meta/query is Studio's arbitrary-SQL endpoint, which
            # makes it the path that matters most if the gate is ever missing.
            _probe \"\$DOMAIN_STUDIO\" \"/api/platform/pg-meta/query\" \"\" 401
            _probe \"\$DOMAIN_STUDIO\" \"/\" \"\$STUDIO_AUTH\"
            _probe \"\$DOMAIN_MINIO\"  \"/\"
            _probe \"\$DOMAIN_MAIN\"   \"/api/rest/v1/\" \"apikey: \$ANON_KEY\"
            _probe \"\$DOMAIN_MAIN\"   \"/api/client-info\"

            exit \$failed
          "

      # Second diagnostics step — see prod version for rationale (smoke test
      # failures don't fire the earlier diagnostics step which is gated by
      # deploy-step failure, not any-step failure). Copilot round-1 finding.
      - name: Smoke-test diagnostics on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            echo '::group::docker compose ps'
            docker compose -p bloom_v2_staging -f docker-compose.prod.yml --env-file .env.staging ps || true
            echo '::endgroup::'
            echo '::group::docker compose logs --tail=200'
            docker compose -p bloom_v2_staging -f docker-compose.prod.yml --env-file .env.staging logs --tail=200 || true
            echo '::endgroup::'
          "

      # See production "Wait for storage schema" step for the reasoning.
      - name: Wait for storage schema (staging)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            PG_PASSWORD=\$(grep '^POSTGRES_PASSWORD=' .env.staging | cut -d= -f2-)
            for i in \$(seq 1 60); do
              if docker compose -p bloom_v2_staging -f docker-compose.prod.yml --env-file .env.staging exec -T \
                   -e PGPASSWORD=\"\$PG_PASSWORD\" db-prod \
                   psql -U supabase_admin -d postgres -tAc \
                   \"SELECT 1 FROM information_schema.tables WHERE table_schema='storage' AND table_name='buckets'\" 2>/dev/null \
                   | grep -q '^1\$'; then
                echo 'storage.buckets ready (attempt '\$i')'
                exit 0
              fi
              sleep 2
            done
            echo '::error::storage.buckets did not appear within 120s — storage-api schema init failed'
            exit 1
          "

      # See the production gate (above) for the full rationale — staging
      # uses the identical pattern so the two envs can't silently diverge.
      - name: Check for pending migrations (staging)
        id: check_migrations_staging
        run: |
          echo "::add-mask::${{ secrets.STAGING_POSTGRES_PASSWORD }}"
          PENDING=$(ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            bash scripts/deploy_run_supabase.sh staging 'migration list --debug' 2>/dev/null \
              | awk -F'|' 'NR>2 && \$1 ~ /[0-9]{14}/ && \$2 !~ /[0-9]/ {c++} END { if (NR < 3) { print \"unknown\"; exit 2 } print c+0 }'
          ") || PENDING="unknown"
          case "$PENDING" in ''|*[!0-9]*) PENDING="unknown" ;; esac
          if [ "$PENDING" = "unknown" ]; then
            echo "pending=unknown" >> "$GITHUB_OUTPUT"
            echo "::warning title=Migrations::Could not determine pending migration count — forcing db push (fail-open)"
            echo "⚠️ Migration gate (staging): unable to parse \`supabase migration list\` output — forcing \`db push\` (fail-open)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PENDING" -eq 0 ]; then
            echo "pending=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=Migrations::No pending migrations — skipping db push"
            echo "ℹ️ Migration gate (staging): 0 pending — \`supabase db push\` skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
            echo "::notice title=Migrations::$PENDING pending migration(s) — running db push"
            echo "✅ Migration gate (staging): $PENDING pending — running \`supabase db push\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Apply database migrations (staging)
        id: migrate_staging
        if: steps.check_migrations_staging.outputs.pending != '0'
        env:
          EXPECTED_CLI_VERSION: ${{ env.SUPABASE_VERSION }}
        run: |
          echo "::add-mask::${{ secrets.STAGING_POSTGRES_PASSWORD }}"
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            command -v supabase >/dev/null || { echo '::error::supabase CLI not found on deploy host'; exit 1; }
            ACTUAL_CLI_VERSION=\$(supabase --version | tr -d '[:space:]')
            if [ \"\$ACTUAL_CLI_VERSION\" != \"$EXPECTED_CLI_VERSION\" ]; then
              echo \"::error::Supabase CLI version mismatch on server: expected $EXPECTED_CLI_VERSION, got \$ACTUAL_CLI_VERSION\"
              exit 1
            fi
            bash scripts/deploy_run_supabase.sh staging 'db push --debug --yes'
          " || {
            echo '::error title=Migration failed (staging)::See the Migration summary at top of run and the Show-migration-status step for applied vs pending state.'
            exit 1
          }

      # Apply bloom_* schema-USAGE grants (supabase/grants/schema_grants.sql) as
      # supabase_admin — schema grants no-op under `supabase db push`. Mirrors CI/make.
      - name: Apply schema-USAGE grants (staging)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -euo pipefail
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            PG_PASSWORD=\$(grep '^POSTGRES_PASSWORD=' .env.staging | cut -d= -f2-)
            docker compose -p bloom_v2_staging -f docker-compose.prod.yml --env-file .env.staging exec -T \
              -e PGPASSWORD=\"\$PG_PASSWORD\" db-prod \
              psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
              < supabase/grants/schema_grants.sql
          " || {
            echo '::error title=Schema grants failed (staging)::supabase/grants/schema_grants.sql could not be applied — see this step log for the psql error.'
            exit 1
          }

      - name: Show migration status on failure (staging)
        if: failure() && steps.migrate_staging.outcome == 'failure'
        run: |
          echo "::add-mask::${{ secrets.STAGING_POSTGRES_PASSWORD }}"
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            bash scripts/deploy_run_supabase.sh staging 'migration list --debug'
          " || echo '::warning::Could not fetch migration status'

      - name: Migration summary (staging)
        if: always()
        run: |
          echo "::add-mask::${{ secrets.STAGING_POSTGRES_PASSWORD }}"
          {
            echo "## Database migration state (staging)"
            echo ""
            echo '```'
            ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
              cd ${{ secrets.STAGING_DEPLOY_PATH }}
              bash scripts/deploy_run_supabase.sh staging 'migration list --debug'
            " 2>/dev/null || echo '(migration state fetch failed)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rollback on failure
        if: failure()
        run: |
          # DB state is NOT rolled back by this step. See the matching comment
          # on the production rollback step above and issue #177.
          echo '::warning title=Database schema NOT reverted::Rollback reverts code only. If migrations were applied before failure, manual DB intervention may be required. See https://github.com/Salk-Harnessing-Plants-Initiative/bloom/issues/177.'
          # See the matching comment on the production rollback step above (#477).
          echo '::warning title=bloommcp data directory rename NOT reverted::If the bloommcp/data/SLEAP_OUT_CSV -> TRAITS_DIR migration (issue #477) ran earlier in this job, rollback does not reverse it. The restored pre-#477 code expects SLEAP_OUT_CSV and will get a fresh empty one from Docker while the real data sits at bloommcp/data/TRAITS_DIR. If this rollback follows a completed migration, manually rename bloommcp/data/TRAITS_DIR back to bloommcp/data/SLEAP_OUT_CSV on the deploy host.'
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -e
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            if [ -f '${{ secrets.STAGING_DEPLOY_PATH }}.state/previous_sha' ]; then
              PREV=\$(cat '${{ secrets.STAGING_DEPLOY_PATH }}.state/previous_sha')
              echo \"Rolling back to \$PREV\"
              if [ -f .env.staging.previous ]; then
                cp -p .env.staging.previous .env.staging
                echo 'Restored previous .env.staging (mode preserved)'
              else
                echo 'WARNING: no .env.staging.previous — rolling back with current .env.staging'
              fi
              git reset --hard \$PREV || { echo \"::error::Rollback failed: could not reset to \$PREV — SHA may be unreachable\"; exit 1; }
              # Symmetric --wait with forward deploy — see prod rollback for
              # rationale. Shorter 300s timeout since rollback reuses built
              # images.
              docker compose -p bloom_v2_staging -f docker-compose.prod.yml --env-file .env.staging \
                up -d --build --remove-orphans --wait --wait-timeout 300 \
                || { echo \"::error::Rollback reset to \$PREV succeeded but docker compose --wait failed — previous-version stack is also unhealthy, manual inspection required\"; exit 1; }
              # See the matching comment on the production rollback step above.
              kong_rollback_ok=true
              if [ \"${{ steps.pull_staging.outputs.kongfile_changed }}\" = \"true\" ]; then
                echo 'kong.yml changed during this deploy — restarting kong so the reverted config takes effect'
                kong_cid=\$(docker compose -p bloom_v2_staging -f docker-compose.prod.yml --env-file .env.staging ps -q kong)
                if [ -z \"\$kong_cid\" ]; then
                  echo '::warning::kong container not found during rollback restart — skipping'
                  kong_rollback_ok=false
                elif ! timeout 60 docker compose -p bloom_v2_staging -f docker-compose.prod.yml --env-file .env.staging restart kong --timeout 10; then
                  echo '::warning::kong restart during rollback failed — kong may still be serving the prior unreverted config, verify manually on the deploy host'
                  kong_rollback_ok=false
                else
                  kong_status=\$(bash scripts/wait_for_kong_healthy.sh \"\$kong_cid\" 120) || true
                  echo \"kong health status after rollback restart: \$kong_status\"
                  if [ \"\$kong_status\" != \"healthy\" ]; then
                    echo \"::warning::kong did not report healthy within 120s after rollback restart (status: \$kong_status) — the API gateway may still be down or serving the wrong config; verify manually on the deploy host\"
                    kong_rollback_ok=false
                  fi
                fi
              fi
              if [ \"\$kong_rollback_ok\" = \"true\" ]; then
                echo 'Rollback complete — previous version restored and healthy'
              else
                echo '::warning::Rollback complete — previous version code/env restored, but kong health could not be confirmed (see warning above) — verify manually on the deploy host'
                # Fail this step, not just warn — the critical code/env revert
                # above already succeeded, so this doesn't retroactively mark
                # that work as failed, but on-call scanning step colors in the
                # Actions UI (rather than reading annotations) would otherwise
                # miss that Kong may still be down after a 'successful' rollback.
                exit 1
              fi
            else
              echo '::error::No previous SHA saved — manual recovery required'
              exit 1
            fi
          "

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
