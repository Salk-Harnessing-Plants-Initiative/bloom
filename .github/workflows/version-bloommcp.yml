name: version-bloommcp

# Manually bump the bloommcp version and open a PR with the change.
#
# Modeled on version-bloomcli.yml: run it from the Actions tab, pick a bump type
# (or a custom version), and merge the PR it opens. Then update
# bloommcp/CHANGELOG.md and cut a GitHub Release to publish.
#
# This workflow regenerates bloommcp/uv.lock as part of the bump, same as
# version-bloomcli.yml does for bloomcli/uv.lock: bloommcp is one of the
# services scripts/check-uv-locks.py checks, so a version-only bump would leave
# the lockfile's recorded package version out of sync and fail CI on the bump
# PR itself.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - alpha
          - beta
          - rc
          - stable
      custom_version:
        description: "Custom version (optional, overrides bump_type)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

# peter-evans/create-pull-request force-pushes a fixed-name branch
# (bloommcp-version-bump-<version>) with no built-in protection against
# concurrent dispatches — two same-bump_type runs before either merges could
# otherwise clobber each other.
concurrency:
  group: version-bloommcp
  cancel-in-progress: false

defaults:
  run:
    working-directory: bloommcp

jobs:
  bump-version:
    name: Bump bloommcp version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Read current version
        id: current
        run: echo "version=$(uv version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      # Free-text inputs go through env, never interpolated into the script text,
      # so a crafted custom_version can't break out of the command.
      - name: Bump version
        id: bump
        env:
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          if [ -n "$CUSTOM_VERSION" ]; then
            uv version "$CUSTOM_VERSION"
          else
            uv version --bump "$BUMP_TYPE"
          fi
          echo "new_version=$(uv version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Sync uv.lock
        run: uv lock

      - name: Open version-bump PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            bloommcp/pyproject.toml
            bloommcp/uv.lock
          commit-message: "chore(bloommcp): bump version to ${{ steps.bump.outputs.new_version }}"
          title: "chore(bloommcp): bump version to ${{ steps.bump.outputs.new_version }}"
          body: |
            Automated `bloommcp` version bump.

            - Previous: `${{ steps.current.outputs.version }}`
            - New: `${{ steps.bump.outputs.new_version }}`

            Before releasing: add a `## [${{ steps.bump.outputs.new_version }}]`
            entry to `bloommcp/CHANGELOG.md`, then publish a GitHub Release tagged
            `bloommcp-v${{ steps.bump.outputs.new_version }}` to trigger
            `release-bloommcp.yml`.
          branch: bloommcp-version-bump-${{ steps.bump.outputs.new_version }}
          delete-branch: true
          labels: version
