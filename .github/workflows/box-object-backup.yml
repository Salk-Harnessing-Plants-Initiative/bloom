name: Nightly Box object mirror

# Mirrors Supabase Storage objects (the image bytes in MinIO) to Box, nightly.
#
# Companion to weekly-backup.yml, which dumps Postgres. Neither is a restore on
# its own: the dump carries the `storage.objects` rows, this carries the bytes.
# Nightly rather than weekly so that at most a day's scans exist only in
# MinIO, rather than up to a week's. It also runs ahead of the Sunday dump on
# the night before, so every row in that dump has bytes already on Box.
#
# The work happens on the deploy host: this workflow SSHes in and runs
# scheduled-jobs/box-object-backup/backup_objects.py there, the same way
# deploy.yml reaches the server. The job talks to Postgres and MinIO over the
# deploy's own Docker network — neither port is published — so nothing is
# copied onto the runner.
#
# The job UPLOADS ONLY. It never deletes anything on Box.
#
# Three things carried over from refresh-cyl-experiment-trait-counts.yml and
# weekly-backup.yml, all of which were learned the hard way:
#
#   0. The FIRST scheduled run with an empty ledger has no watermark to work
#      from, so it enumerates everything — all 8M objects — inside a job with a
#      240 minute timeout. Seed by hand BEFORE promoting this to `main`; once a
#      seed is under way the lock makes this job stand down, but it cannot help
#      if no seed has started.
#   1. BOTH `schedule:` and `workflow_dispatch` require this file to be present
#      on the repo's DEFAULT branch (`main`) before either can fire -- dispatch
#      is gated on it exactly as schedule is. Nothing runs until the normal
#      staging -> main promotion carries this file there.
#   2. A `schedule` event carries no `github.event.inputs`, so the target is
#      resolved off `github.event_name` below rather than the dispatch input.
#   3. The scheduled run uses a SEPARATE, ungated GitHub Environment
#      (`production-scheduled-backup`) rather than `production` itself. Routing
#      an unattended 02:00 run through production's required-reviewer gate
#      would leave it stuck "Waiting" for an approval nobody is awake to give.
#
# THE SEED DOES NOT RUN HERE. The first full pass moves millions of objects
# over days; the self-hosted runner is shared with deploys and must not be held
# that long. The seed is started by hand, detached, on the host (see the wiki
# page). While it runs it holds a lock, and this workflow stands down against
# that lock -- reporting "skipped", not "succeeded", so a stood-down week is
# never mistaken for a completed one.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to mirror"
        required: true
        type: choice
        options:
          - staging
          - production
      dry_run:
        description: "Plan and report, but copy nothing"
        required: false
        type: boolean
        default: false
      verify:
        description: "Objects to stat on Box afterwards and size-check"
        required: false
        type: string
        default: "50"
  schedule:
    # Every night at 02:17 UTC. Off the hour deliberately — GitHub's own docs
    # flag the top of the hour as a period of elevated scheduler load and delay.
    #
    # The delta query is `updated_at > <last clean run>` and storage.objects has
    # no index on updated_at, so each run is a sequential scan of ~8M rows.
    # Seven of those a week instead of one is a few minutes of extra scanning on
    # an otherwise idle database at 02:00; an index would remove even that and is
    # worth doing separately.
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  # Its own group, NOT deploy-bloom and NOT weekly-backup: a queued deploy must
  # not cancel a mirror, and the mirror must not hold up either.
  group: box-object-backup-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror ${{ github.event.inputs.environment || 'production' }} objects to Box
    runs-on: [self-hosted, linux, salk-network]
    # A night's delta is small — new and changed images only. A run that takes
    # hours means something is wrong, or a seed is still in progress, and in the
    # latter case this job stands down in seconds.
    timeout-minutes: 240
    # Deliberately a DIFFERENT literal than the target resolution below: this
    # is the approval-gate name, and the scheduled path must not be gated.
    environment: ${{ github.event_name == 'schedule' && 'production-scheduled-backup' || github.event.inputs.environment }}
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # `prod` is what the env file and the script call it; the GitHub
      # Environment is called `production`. Resolve both here so the rest of
      # the job has one name for each.
      - name: Resolve target
        id: target
        env:
          ENVIRONMENT: ${{ github.event_name == 'schedule' && 'production' || github.event.inputs.environment }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          if [ "$ENVIRONMENT" = "production" ]; then
            ENV_NAME=prod
            DEPLOY_PATH="$PROD_DEPLOY_PATH"
          else
            ENV_NAME=staging
            DEPLOY_PATH="$STAGING_DEPLOY_PATH"
          fi
          # An empty deploy path would make the remote `cd` land in $HOME and
          # the job run against whatever happens to be there.
          : "${DEPLOY_PATH:?deploy path secret is empty for $ENVIRONMENT}"
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "deploy_path=$DEPLOY_PATH" >> "$GITHUB_OUTPUT"
          echo "Mirroring $ENVIRONMENT ($ENV_NAME) from $DEPLOY_PATH"

      - name: Run the mirror on the deploy host
        id: run
        env:
          ENV_NAME: ${{ steps.target.outputs.env_name }}
          DEPLOY_PATH: ${{ steps.target.outputs.deploy_path }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          VERIFY: ${{ github.event.inputs.verify || '50' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail

          # Re-asserted here, not only in Resolve target: this is the step that
          # uses it, and an empty value makes the remote `cd` succeed into
          # $HOME and run against whatever is there.
          : "${DEPLOY_PATH:?deploy path is empty}"

          # The remote script is a QUOTED heredoc and the values go to it as
          # positional arguments. Nothing is interpolated into a command
          # string, so a dispatch input cannot close a quote and have the
          # remote shell run the rest — `verify` is free-text and GitHub
          # validates it no further than "is a string".
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$DEPLOY_PATH" "$ENV_NAME" "$VERIFY" "$DRY_RUN" \
            <<'REMOTE' 2>&1 | tee "${RUNNER_TEMP}/mirror-output.txt"
          set -euo pipefail
          deploy_path="$1"; env_name="$2"; verify="$3"; dry_run="${4:-}"

          case "$verify" in
            ''|*[!0-9]*) echo "verify must be a whole number, got: $verify" >&2; exit 2 ;;
          esac

          cd "$deploy_path"

          # The job takes ALL its configuration from the environment, and an
          # `ssh host cmd` shell reads no profile and no .env file. The systemd
          # unit this replaced carried EnvironmentFile=, which is what used to
          # supply these; without an equivalent the run dies at the first
          # config lookup having already scanned every row of storage.objects.
          #
          # Filtered rather than taking the whole file: the job needs the backup
          # settings, the Postgres role and MinIO's credentials, and has no use
          # for the JWT keys or service-role secrets sitting beside them.
          #
          # Assigned, NOT sourced. A .env file is not a shell script — a
          # password containing a quote, a backtick or a $ makes `. file` either
          # die parsing or execute part of the value. `export "$k=$v"` takes the
          # value literally from the variable, so no character in it is special.
          env_file="$deploy_path/.env.$env_name"
          [ -r "$env_file" ] || { echo "cannot read $env_file" >&2; exit 2; }
          while IFS='=' read -r key value; do
            [ -n "$key" ] && export "$key=$value"
          done < <(grep -E '^(BACKUP_[A-Z_]+|POSTGRES_(USER|DB)|MINIO_ROOT_[A-Z_]+)=' \
                     "$env_file")

          # --verify on every scheduled run: an unverified mirror cannot tell a
          # copied object from a lost one.
          python3 scheduled-jobs/box-object-backup/backup_objects.py \
            --env "$env_name" --verify "$verify" $dry_run
          REMOTE

      # Cancelling this job kills the ssh client on the runner, not the python
      # process on the host — the remote gets SIGHUP when the connection drops.
      # That used to be a hard kill: the cleanup in `finally` never ran and the
      # rclone container was left holding the RC port, so the NEXT run refused
      # to start until someone removed it by hand.
      #
      # The job now handles SIGHUP, so the drop alone is survivable. This step
      # is belt and braces for the case where the connection outlives the
      # cancellation: it asks the run to stop by name, using the pid the lock
      # file records, and gives it a moment to put itself away.
      - name: Ask the host to stop the run, if this job was cancelled
        if: cancelled()
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        timeout-minutes: 3
        run: |
          set -uo pipefail
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE' || true
          set -uo pipefail
          lock=/var/lib/bloom-box-object-backup/backup.lock
          [ -r "$lock" ] || { echo "no lock file — nothing was running"; exit 0; }

          # runlock.py writes {"pid": ..., "started_at": ..., "argv": ...}
          pid="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("pid",""))' "$lock" 2>/dev/null || true)"
          case "$pid" in
            ''|*[!0-9]*) echo "no pid in the lock file — nothing to stop"; exit 0 ;;
          esac
          kill -0 "$pid" 2>/dev/null || { echo "pid $pid is gone already"; exit 0; }

          echo "asking pid $pid to stop"
          kill -TERM "$pid"
          for _ in $(seq 1 30); do
            kill -0 "$pid" 2>/dev/null || { echo "stopped cleanly"; exit 0; }
            sleep 2
          done
          # Deliberately not escalating to SIGKILL: that is the hard kill this
          # exists to avoid, and it would leave the container behind again. A
          # run still going after a minute is worth a human looking.
          echo "::warning::pid $pid has not stopped yet; leaving it alone"
          REMOTE

      # A run that stood down against the seed's lock exits 0, exactly as a
      # successful run does. Reading the marker is the only way to tell them
      # apart, and calling a stood-down week "succeeded" is how a months-long
      # gap in the mirror goes unnoticed.
      - name: Write the run summary
        if: always()
        env:
          ENV_NAME: ${{ steps.target.outputs.env_name }}
        run: |
          set -uo pipefail

          # Pulled out of the line the run already prints, so nothing is
          # recomputed and nothing extra happens on the deploy host:
          #   done — copied 4211, failed 0, already current 0, skipped 0
          #   verify: 50 checked, 3 mismatched
          #
          # It goes in the headline rather than only the block below because a
          # bare "succeeded" cannot be told from a week that copied nothing
          # because the mirror had vanished. "nothing new to copy, 8,013,796
          # already on Box" says the mirror is intact; "0 copied, 0 already
          # current" would not.
          done_line="$(grep -oE 'done — copied [0-9]+, failed [0-9]+, already current [0-9]+, skipped [0-9]+' \
            "${RUNNER_TEMP}/mirror-output.txt" 2>/dev/null | tail -1)"
          verify_line="$(grep -oE 'verify: [0-9]+ checked, [0-9]+ mismatched' \
            "${RUNNER_TEMP}/mirror-output.txt" 2>/dev/null | tail -1)"
          copied="$(printf '%s' "$done_line" | grep -oE 'copied [0-9]+' | grep -oE '[0-9]+' || true)"
          current="$(printf '%s' "$done_line" | grep -oE 'already current [0-9]+' | grep -oE '[0-9]+' || true)"
          checked="$(printf '%s' "$verify_line" | grep -oE '[0-9]+ checked' | grep -oE '[0-9]+' || true)"

          # Thousands separators, so eight million reads as eight million.
          # Not printf "%'d" (needs a numeric locale the runner may not have,
          # and silently prints ungrouped without one) and not sed (the label
          # syntax differs between GNU and BSD, so it would work only here).
          group() {
            local n="$1" out=""
            while [ "${#n}" -gt 3 ]; do
              out=",${n: -3}${out}"
              n="${n:0:${#n}-3}"
            done
            printf '%s%s' "$n" "$out"
          }

          if [ -n "${copied:-}" ] && [ "$copied" -gt 0 ]; then
            counts="$(group "$copied") images copied"
          elif [ -n "${copied:-}" ]; then
            counts="nothing new to copy ($(group "${current:-0}") already on Box)"
          else
            counts=""
          fi
          if [ -n "${checked:-}" ] && [ "$checked" -gt 0 ]; then
            counts="${counts}, $(group "$checked") verified"
          fi

          {
            echo "## Nightly Box object mirror — ${ENV_NAME}"
            echo
            if grep -q 'box-object-backup: SKIPPED' "${RUNNER_TEMP}/mirror-output.txt" 2>/dev/null; then
              echo "Result: **skipped** — another run holds the lock, almost"
              echo "certainly the initial seed. Nothing was mirrored this week;"
              echo "the seed is doing that work. This is expected until it ends."
            elif grep -q 'were missing or the wrong size on Box' "${RUNNER_TEMP}/mirror-output.txt" 2>/dev/null; then
              echo "Result: **VERIFICATION FAILED** — objects the copy reported"
              echo "as successful are not on Box. They are **not** retried"
              echo "automatically: the ledger already records them as copied, so"
              echo "later runs skip them. Clear their ledger rows by hand (the"
              echo "job log prints the command) or this repeats every week."
            elif [ "${{ steps.run.outcome }}" = "success" ]; then
              if [ -n "$counts" ]; then
                echo "Result: **succeeded** — ${counts}"
              else
                echo "Result: **succeeded** (no counts in the log — check it)"
              fi
            else
              echo "Result: **FAILED** — see the job log. The mirror was not"
              echo "updated this run."
            fi
            echo
            echo '### This run'
            echo '```'
            # The level is the THIRD field, not the second: asctime is
            # "2026-08-31 12:08:16,440" and contains a space, so an anchor of
            # ^\S+ stops at the date and never reaches INFO. That pattern
            # matched nothing, on every run.
            #
            # `||` binds to the last command in a pipeline, and `tail` exits 0
            # on empty input, so the fallback could never fire either — the
            # block rendered as an empty fence. Capture first, then test.
            summary="$(grep -E '^[0-9-]+ [0-9:,]+ (INFO|WARNING|ERROR) (done —|verify:|listed|preflight|batch:)' \
              "${RUNNER_TEMP}/mirror-output.txt" 2>/dev/null | tail -20)"
            if [ -n "$summary" ]; then
              echo "$summary"
            else
              echo "(no summary produced — the run did not reach the copy phase)"
            fi
            echo '```'
            echo
            echo "_This job only uploads. Nothing on Box is ever deleted by it._"
            echo "_Per-run reports, including verification counts, are written to"
            echo "\`<BACKUP_BOX_ROOT>/_runs/\` on Box._"
          } >> "$GITHUB_STEP_SUMMARY"
