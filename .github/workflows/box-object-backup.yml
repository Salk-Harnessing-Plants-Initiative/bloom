name: Nightly Box object mirror

# Mirrors Supabase Storage objects (the image bytes in MinIO) to Box, nightly.
#
# Companion to weekly-backup.yml, which dumps Postgres. Neither is a restore on
# its own: the dump carries the `storage.objects` rows, this carries the bytes.
# Nightly rather than weekly so that at most a day's scans exist only in
# MinIO, rather than up to a week's. It also runs ahead of the Sunday dump on
# the night before, so every row in that dump has bytes already on Box.
#
# The work happens on the deploy host: this workflow SSHes in and runs
# scheduled-jobs/box-object-backup/backup_objects.py there, the same way
# deploy.yml reaches the server. The job talks to Postgres and MinIO over the
# deploy's own Docker network — neither port is published — so nothing is
# copied onto the runner.
#
# The job UPLOADS ONLY. It never deletes anything on Box.
#
# Three things carried over from refresh-cyl-experiment-trait-counts.yml and
# weekly-backup.yml, all of which were learned the hard way:
#
#   0. The FIRST scheduled run with an empty ledger has no watermark to work
#      from, so it enumerates everything — all 8M objects — inside a job with a
#      240 minute timeout. Seed by hand BEFORE promoting this to `main`; once a
#      seed is under way the lock makes this job stand down, but it cannot help
#      if no seed has started.
#   1. BOTH `schedule:` and `workflow_dispatch` require this file to be present
#      on the repo's DEFAULT branch (`main`) before either can fire -- dispatch
#      is gated on it exactly as schedule is. Nothing runs until the normal
#      staging -> main promotion carries this file there.
#   2. A `schedule` event carries no `github.event.inputs`, so the target is
#      resolved off `github.event_name` below rather than the dispatch input.
#   3. The scheduled run uses a SEPARATE, ungated GitHub Environment
#      (`production-scheduled-backup`) rather than `production` itself. Routing
#      an unattended 02:00 run through production's required-reviewer gate
#      would leave it stuck "Waiting" for an approval nobody is awake to give.
#
# THE SEED DOES NOT RUN HERE. The first full pass moves millions of objects
# over days; the self-hosted runner is shared with deploys and must not be held
# that long. The seed is started by hand, detached, on the host (see the wiki
# page). While it runs it holds a lock, and this workflow stands down against
# that lock -- reporting "skipped", not "succeeded", so a stood-down night is
# never mistaken for a completed one.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan and report, but copy nothing"
        required: false
        type: boolean
        default: false
      verify:
        description: "Objects to stat on Box afterwards and size-check"
        required: false
        type: string
        default: "50"
  schedule:
    # Every night at 02:17 UTC. Off the hour deliberately — GitHub's own docs
    # flag the top of the hour as a period of elevated scheduler load and delay.
    #
    # The delta query is `updated_at > <last clean run>` and storage.objects has
    # no index on updated_at, so each run is a sequential scan of ~8M rows.
    # Seven of those a week instead of one is a few minutes of extra scanning on
    # an otherwise idle database at 02:00; an index would remove even that and is
    # worth doing separately.
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  # Its own group, NOT deploy-bloom and NOT weekly-backup: a queued deploy must
  # not cancel a mirror, and the mirror must not hold up either.
  group: box-object-backup-production
  cancel-in-progress: false

env:
  # The job's own default for BACKUP_STATE_DIR, in one place. Three separate
  # ssh sessions need it — the run stamps its marker there, the cancel step
  # finds the lock there, the summary falls back to the reports there — and
  # none of the last two reads the env file, so they cannot look it up. The
  # run step refuses to start if the job's value differs from this one.
  STATE_DIR: /var/lib/bloom-box-object-backup

jobs:
  mirror:
    name: Mirror production objects to Box
    runs-on: [self-hosted, linux, salk-network]
    # A night's delta is small — new and changed images only. A run that takes
    # hours means something is wrong, or a seed is still in progress, and in the
    # latter case this job stands down in seconds.
    timeout-minutes: 240
    # Deliberately a DIFFERENT literal than the target resolution below: this
    # is the approval-gate name, and the scheduled path must not be gated.
    environment: ${{ github.event_name == 'schedule' && 'production-scheduled-backup' || 'production' }}
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # `prod` is what the env file and the script call it; the GitHub
      # Environment is called `production`. Resolve both here so the rest of
      # the job has one name for each.
      - name: Resolve target
        id: target
        env:
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          # Production is the only thing this workflow mirrors, and staging is
          # deliberately not offered. Both environments live on this one host,
          # so they would share the ledger, the watermark, the run lock, the
          # rclone container name and the RC port. Two runs would then read and
          # advance each other's watermark, each skipping whatever the other's
          # timestamp already covered — silently, and in both directions. The
          # concurrency group above would not have stopped it either: it used
          # to be keyed on the environment, so the two ran in different groups.
          #
          # Nothing needs staging objects on Box. Mirroring staging as well
          # means scoping the ledger, the container name and the port per
          # environment; that is a change worth making only if the need appears.
          ENV_NAME=prod
          DEPLOY_PATH="$PROD_DEPLOY_PATH"
          # An empty deploy path would make the remote `cd` land in $HOME and
          # the job run against whatever happens to be there.
          : "${DEPLOY_PATH:?PROD_DEPLOY_PATH secret is empty}"
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "deploy_path=$DEPLOY_PATH" >> "$GITHUB_OUTPUT"
          echo "Mirroring production ($ENV_NAME) from $DEPLOY_PATH"

      - name: Run the mirror on the deploy host
        id: run
        env:
          ENV_NAME: ${{ steps.target.outputs.env_name }}
          DEPLOY_PATH: ${{ steps.target.outputs.deploy_path }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          VERIFY: ${{ github.event.inputs.verify || '50' }}
          RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
          STATE_DIR: ${{ env.STATE_DIR }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail

          # Re-asserted here, not only in Resolve target: this is the step that
          # uses it, and an empty value makes the remote `cd` succeed into
          # $HOME and run against whatever is there.
          : "${DEPLOY_PATH:?deploy path is empty}"

          # `verify` is free-text: GitHub validates a workflow_dispatch input no
          # further than "is a string". Checked HERE, on the runner, so a value
          # that is not a plain number never reaches a shell at all.
          case "$VERIFY" in
            ''|*[!0-9]*) echo "verify must be a whole number, got: $VERIFY" >&2; exit 1 ;;
          esac

          # ssh cannot carry argv boundaries. Whatever words follow the host are
          # joined with spaces into ONE string and handed to the remote login
          # shell, which parses it as shell syntax. So `ssh host bash -s -- "$V"`
          # is no safer than interpolating $V into the command: it only moves
          # which shell does the parsing, and the heredoc's own guard runs
          # inside `bash -s`, which is merely the first statement of that string.
          #
          # `printf %q` quotes each value so the remote shell reparses the
          # joined string back into the arguments meant, rather than finding
          # new commands inside them. The heredoc stays quoted for the separate
          # reason that the runner must substitute nothing into the script.
          remote_args="$(printf '%q ' \
            "$DEPLOY_PATH" "$ENV_NAME" "$VERIFY" "$RUN_TAG" "$STATE_DIR" "$DRY_RUN")"

          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- $remote_args" \
            <<'REMOTE' 2>&1 | tee "${RUNNER_TEMP}/mirror-output.txt"
          set -euo pipefail
          deploy_path="$1"; env_name="$2"; verify="$3"; run_tag="$4"
          state_dir="$5"; dry_run="${6:-}"

          case "$verify" in
            ''|*[!0-9]*) echo "verify must be a whole number, got: $verify" >&2; exit 2 ;;
          esac

          cd "$deploy_path"

          # The job takes ALL its configuration from the environment, and an
          # `ssh host cmd` shell reads no profile and no .env file. The systemd
          # unit this replaced carried EnvironmentFile=, which is what used to
          # supply these; without an equivalent the run dies at the first
          # config lookup having already scanned every row of storage.objects.
          #
          # Filtered rather than taking the whole file: the job needs the backup
          # settings, the Postgres role and MinIO's credentials, and has no use
          # for the JWT keys or service-role secrets sitting beside them.
          #
          # Assigned, NOT sourced. A .env file is not a shell script — a
          # password containing a quote, a backtick or a $ makes `. file` either
          # die parsing or execute part of the value. `export "$k=$v"` takes the
          # value literally from the variable, so no character in it is special.
          env_file="$deploy_path/.env.$env_name"
          [ -r "$env_file" ] || { echo "cannot read $env_file" >&2; exit 2; }
          while IFS='=' read -r key value; do
            [ -n "$key" ] && export "$key=$value"
          done < <(grep -E '^(BACKUP_[A-Z_]+|POSTGRES_(USER|DB)|MINIO_ROOT_[A-Z_]+)=' \
                     "$env_file")

          # The cancel step finds the run through "$state_dir/backup.lock" and
          # the summary falls back to "$state_dir/_runs"; both are separate ssh
          # sessions that read no env file. Pointed elsewhere, the job would
          # work while those two silently watched an empty directory — a cancel
          # that stops nothing and a verdict that is never recovered. Loud
          # here rather than silent there.
          if [ -n "${BACKUP_STATE_DIR:-}" ] && [ "$BACKUP_STATE_DIR" != "$state_dir" ]; then
            echo "BACKUP_STATE_DIR is $BACKUP_STATE_DIR but this workflow" >&2
            echo "watches $state_dir. Point them at the same directory." >&2
            exit 2
          fi

          # Stamped just before launching, so the cancel step can tell the run
          # THIS job starts from one that was already going. During the seed
          # that distinction matters: the seed holds the lock, a nightly finds
          # it held and stands down, and cancelling that stood-down job would
          # otherwise stop the seed by mistake — days of work, silently.
          #
          # Both halves are needed. The tag rules out a marker left by an
          # earlier job; the time rules out this job's own stand-down, where
          # the marker is this job's but the lock is still the seed's. Written
          # with the host's clock, the same one the lock file records, so the
          # two are comparable without the runner's clock coming into it.
          #
          # A failed write is not worth failing the backup for: the cancel step
          # then finds no marker and declines to signal anything.
          marker="$state_dir/actions-run.started"
          echo "$run_tag $(date +%s)" > "$marker" || echo "could not write $marker" >&2

          # --verify on every scheduled run: an unverified mirror cannot tell a
          # copied object from a lost one.
          python3 scheduled-jobs/box-object-backup/backup_objects.py \
            --env "$env_name" --verify "$verify" $dry_run
          REMOTE

      # Cancelling this job kills the ssh client on the runner, not the python
      # process on the host — the remote gets SIGHUP when the connection drops.
      # That used to be a hard kill: the cleanup in `finally` never ran and the
      # rclone container was left holding the RC port, so the NEXT run refused
      # to start until someone removed it by hand.
      #
      # The job now handles SIGHUP, so the drop alone is survivable. This step
      # is belt and braces for the case where the connection outlives the
      # cancellation: it asks the run to stop by name, using the pid the lock
      # file records, and gives it a moment to put itself away.
      - name: Ask the host to stop the run, if this job was cancelled
        if: cancelled()
        env:
          RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
          STATE_DIR: ${{ env.STATE_DIR }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        timeout-minutes: 3
        run: |
          set -uo pipefail
          # Quoted for the same reason as the run step: ssh joins its trailing
          # words into one string for the remote shell to parse. This tag is a
          # run id and cannot carry a payload, but the pattern gets copied.
          remote_args="$(printf '%q ' "$RUN_TAG" "$STATE_DIR")"
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s -- $remote_args" <<'REMOTE' || true
          set -uo pipefail
          run_tag="$1"; state_dir="$2"
          lock="$state_dir/backup.lock"
          [ -r "$lock" ] || { echo "no lock file — nothing was running"; exit 0; }

          # runlock.py writes {"pid": ..., "started_at": ..., "argv": ...}
          pid="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("pid",""))' "$lock" 2>/dev/null || true)"
          case "$pid" in
            ''|*[!0-9]*) echo "no pid in the lock file — nothing to stop"; exit 0 ;;
          esac

          # The lock names whoever holds it, which is not necessarily the run
          # this job started. During the seed that distinction matters: the
          # seed holds the lock for days, a nightly finds it held and stands
          # down without touching the file, and cancelling THAT job would stop
          # the seed by mistake. So the run step stamps a marker naming itself,
          # and this only signals when the marker still names this job.
          marker="$state_dir/actions-run.started"
          [ -r "$marker" ] || { echo "no marker — this job started no run"; exit 0; }
          read -r marked_tag stamped_at _ < "$marker" || true
          if [ "${marked_tag:-}" != "$run_tag" ]; then
            echo "the marker names another job — leaving pid $pid alone"
            exit 0
          fi
          # Every run rewrites started_at as it takes the lock, so a lock older
          # than the marker belongs to a run this job never started.
          started_at="$(python3 -c 'import json,sys; print(int(float(json.load(open(sys.argv[1]))["started_at"])))' "$lock" 2>/dev/null || true)"
          case "${started_at:-x}${stamped_at:-x}" in
            *[!0-9]*) echo "cannot compare the start times — leaving pid $pid alone"; exit 0 ;;
          esac
          if [ "$started_at" -lt "$stamped_at" ]; then
            echo "pid $pid was already running before this job — leaving it alone"
            exit 0
          fi

          kill -0 "$pid" 2>/dev/null || { echo "pid $pid is gone already"; exit 0; }

          echo "asking pid $pid to stop"
          kill -TERM "$pid"
          for _ in $(seq 1 30); do
            kill -0 "$pid" 2>/dev/null || { echo "stopped cleanly"; exit 0; }
            sleep 2
          done
          # Deliberately not escalating to SIGKILL: that is the hard kill this
          # exists to avoid, and it would leave the container behind again. A
          # run still going after a minute is worth a human looking.
          echo "::warning::pid $pid has not stopped yet; leaving it alone"
          REMOTE

      # A run that stood down against the seed's lock exits 0, exactly as a
      # successful run does. Reading the marker is the only way to tell them
      # apart, and calling a stood-down night "succeeded" is how a months-long
      # gap in the mirror goes unnoticed.
      - name: Write the run summary
        if: always()
        env:
          ENV_NAME: ${{ steps.target.outputs.env_name }}
          # Needed only for the fallback below: when the ssh pipe carrying the
          # run's output died before it printed a verdict, the summary fetches
          # that verdict from the report the run wrote on the host.
          RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
          STATE_DIR: ${{ env.STATE_DIR }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        # This step fires exactly when the host may be wedged, and it is the
        # only thing standing between a cancelled night and a summary that
        # says FAILED. Bounded like the cancel step beside it, so a host that
        # never answers costs five minutes rather than the runner.
        timeout-minutes: 5
        run: |
          set -uo pipefail

          # GitHub runs this as `bash -e {0}`, and every grep below is allowed
          # to match nothing: a stood-down night prints no `done —` line, a
          # quiet one prints no `verify:` line. Without `|| true` on each,
          # pipefail turns that into a non-zero status and errexit kills the
          # step — a red tick and an EMPTY summary on every night except one
          # that both copied and verified. That is every night of the seed.
          #
          # Pulled out of the line the run already prints, so nothing is
          # recomputed and nothing extra happens on the deploy host:
          #   done — copied 4211, failed 0, already current 0, skipped 0
          #   verify: 50 checked, 3 mismatched
          #
          # It goes in the headline rather than only the block below because a
          # bare "succeeded" cannot be told from a week that copied nothing
          # because the mirror had vanished. "nothing new to copy, 8,013,796
          # already on Box" says the mirror is intact; "0 copied, 0 already
          # current" would not.
          # Anchored for the same reason as the status line below: object
          # names reach this log, and a name is free text. One image called
          # `verify: 200 checked, 0 mismatched.png` — a colon guarantees it is
          # refused, hence logged — made a quiet night, when verification does
          # not run at all, report "200 verified". Anchoring to timestamp,
          # level, then the phrase means a name can never match: it only ever
          # appears once a message has already begun.
          dry_line="$(grep -oE '^[0-9-]+ [0-9:,]+ [A-Z]+ dry run — would copy [0-9]+, [0-9]+ already current, [0-9]+ skipped' \
            "${RUNNER_TEMP}/mirror-output.txt" 2>/dev/null | tail -1 || true)"
          done_line="$(grep -oE '^[0-9-]+ [0-9:,]+ [A-Z]+ done — copied [0-9]+, failed [0-9]+, already current [0-9]+, skipped [0-9]+' \
            "${RUNNER_TEMP}/mirror-output.txt" 2>/dev/null | tail -1 || true)"
          # The trailing ", N unverified" is optional because the job only
          # prints it when there is a shortfall — but when there is one it
          # belongs in the headline, or "50 verified" reads as a clean check
          # on a night where Box answered twice.
          verify_line="$(grep -oE '^[0-9-]+ [0-9:,]+ [A-Z]+ verify: [0-9]+ checked, [0-9]+ mismatched(, [0-9]+ unverified)?' \
            "${RUNNER_TEMP}/mirror-output.txt" 2>/dev/null | tail -1 || true)"
          copied="$(printf '%s' "$done_line" | grep -oE 'copied [0-9]+' | grep -oE '[0-9]+' || true)"
          current="$(printf '%s' "$done_line" | grep -oE 'already current [0-9]+' | grep -oE '[0-9]+' || true)"
          checked="$(printf '%s' "$verify_line" | grep -oE '[0-9]+ checked' | grep -oE '[0-9]+' || true)"
          unverified="$(printf '%s' "$verify_line" | grep -oE '[0-9]+ unverified' | grep -oE '[0-9]+' || true)"

          # The verdict, read from a line only the job can produce.
          #
          # This used to search the whole log for English phrases. Object names
          # are in that log and are partly chosen by whoever uploads the file,
          # so an image called "box-object-backup: SKIPPED.png" — the colon
          # guarantees it is refused, hence logged — made a night with
          # thousands of failed copies render as "skipped, this is expected".
          # Every branch forged the same way, and a colon in a filename is
          # ordinary enough to do it by accident.
          #
          # Anchored to the start of a line: timestamp, level, then the key. A
          # name can only appear once a message has begun, so no name can
          # produce a matching line. `tail -1` because a manual re-run appends.
          status="$(grep -oE '^[0-9-]+ [0-9:,]+ [A-Z]+ BOX_BACKUP_STATUS=[a-z_]+' \
            "${RUNNER_TEMP}/mirror-output.txt" 2>/dev/null | tail -1 || true)"
          status="${status##*=}"
          flags="$(grep -oE '^[0-9-]+ [0-9:,]+ [A-Z]+ BOX_BACKUP_FLAGS=[a-z_,]*' \
            "${RUNNER_TEMP}/mirror-output.txt" 2>/dev/null | tail -1 || true)"
          flags=",${flags##*=},"

          # No verdict in the log means the ssh pipe died before the run
          # printed it — which is what a cancel or the job timeout does, on
          # exactly the runs worth explaining: a deliberate stop that had
          # already copied and recorded thousands of objects, reported as
          # FAILED. The run writes the same verdict into its report on the
          # host BEFORE printing it, so fetch that instead.
          #
          # Scoped to the run THIS job started, not to a time window. The run
          # step stamps "$STATE_DIR/actions-run.started" with its own tag and
          # the host's clock just before launching, so a report newer than
          # that stamp, with the stamp still naming this job, is this job's
          # report and nothing else can be. `-mmin -240` alone accepted any
          # report from the last four hours — including the seed's, running
          # in tmux beside a nightly that stood down against its lock, whose
          # verdict then became this job's headline.
          #
          # Both halves are evaluated on the host, so no clock comparison
          # between the runner and the server comes into it.
          #
          # Guarded on both being set: the step runs under `set -u`, and an
          # empty host would make ssh try to reach "user@". A missing secret
          # must degrade to the step-outcome fallback, not kill the summary.
          if [ -z "$status" ] && [ -n "${DEPLOY_USER:-}" ] && [ -n "${DEPLOY_HOST:-}" ]; then
            # Read the marker, then look for a report newer than it. Two
            # plain commands rather than a script on stdin: the runner only
            # compares two strings, and every value it interpolates is either
            # quoted with %q or checked to be digits first.
            q_state="$(printf '%q' "$STATE_DIR")"
            marker="$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
              -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "cat -- $q_state/actions-run.started" 2>/dev/null || true)"
            marked_tag=""; stamped_at=""
            read -r marked_tag stamped_at _ <<< "$marker" || true
            # The stamp is the host's own clock, written just before the run
            # was launched, and the find below runs on the host too — so no
            # runner clock ever enters the comparison.
            case "${stamped_at:-x}" in ''|*[!0-9]*) stamped_at="" ;; esac
            report=""
            if [ "${marked_tag:-}" = "$RUN_TAG" ] && [ -n "$stamped_at" ]; then
              report="$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
                -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
                "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "find $q_state/_runs -name '*.json' -newermt @$stamped_at \
                   -printf '%T@ %p\\n' 2>/dev/null \
                 | sort -rn | head -1 | cut -d' ' -f2-" 2>/dev/null || true)"
            fi
            if [ -n "$report" ]; then
              # %q, not a single-quoted literal. The name is the job's own —
              # a timestamp and a run number — but this is the one place in
              # the workflow that was building a remote command without it.
              cat_args="$(printf '%q' "$report")"
              body="$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
                -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
                "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "cat -- $cat_args" 2>/dev/null || true)"
              status="$(printf '%s' "$body" \
                | grep -oE '\"status\"[[:space:]]*:[[:space:]]*\"[a-z_]+\"' \
                | head -1 | grep -oE '[a-z_]+\"$' | tr -d '\"' || true)"
              # The flags too, not only the headline. Recovering the verdict
              # and losing every notice meant a cancelled night — which during
              # the seed is every night — reported its result and dropped the
              # refused-filename notice, the one whose whole justification is
              # that you get exactly one.
              #
              # The two ledger flags are never in the report: the upload that
              # sets them runs after it is written. They reach a human by exit
              # code 6 instead, which notifies whatever the summary renders.
              flags="$(printf '%s' "$body" \
                | tr -d ' \n' \
                | grep -oE '\"flags\":\[[^]]*\]' \
                | grep -oE '[a-z_]+' | grep -v '^flags$' | paste -sd, - || true)"
              flags=",${flags},"
              [ -n "$status" ] && echo "verdict taken from the run report on the host: $status ($flags)"
            fi
          fi

          # Nothing in the log and nothing on the host — a run that died
          # before it wrote either. The step's own outcome is then the verdict.
          if [ -z "$status" ]; then
            if [ "${{ steps.run.outcome }}" = "success" ]; then status=ok; else status=failed; fi
          fi
          has_flag() { case "$flags" in *",$1,"*) return 0 ;; *) return 1 ;; esac; }

          # Thousands separators, so eight million reads as eight million.
          # Not printf "%'d" (needs a numeric locale the runner may not have,
          # and silently prints ungrouped without one) and not sed (the label
          # syntax differs between GNU and BSD, so it would work only here).
          group() {
            local n="$1" out=""
            while [ "${#n}" -gt 3 ]; do
              out=",${n: -3}${out}"
              n="${n:0:${#n}-3}"
            done
            printf '%s%s' "$n" "$out"
          }

          if [ -n "$dry_line" ]; then
            # A dry run copies nothing by design, so the copy counts never
            # applied to it — and without this it fell through to "no counts
            # in the log", the phrase that means the log is malformed. It is
            # step one of the pre-seed checklist.
            would="$(printf '%s' "$dry_line" | grep -oE 'would copy [0-9]+' | grep -oE '[0-9]+' || true)"
            counts="dry run — would copy $(group "${would:-0}"), nothing was copied"
          elif [ -n "${copied:-}" ] && [ "$copied" -gt 0 ]; then
            counts="$(group "$copied") images copied"
          elif [ -n "${copied:-}" ]; then
            counts="nothing new to copy ($(group "${current:-0}") already on Box)"
          else
            counts=""
          fi
          if [ -n "${checked:-}" ] && [ "$checked" -gt 0 ]; then
            counts="${counts}, $(group "$checked") verified"
          elif [ -n "${unverified:-}" ] && [ "$unverified" -gt 0 ]; then
            # Nothing was answered. Without this the shortfall attaches to the
            # copy count — "200,000 images copied (50 unanswered)" reads as 50
            # of the copies being unanswered, and the notice below then refers
            # to a "N verified" count that is not there.
            counts="${counts}, 0 verified"
          fi
          if [ -n "${unverified:-}" ] && [ "$unverified" -gt 0 ]; then
            # Qualifies the number beside it rather than sitting apart from
            # it: "2 verified" alone is a true statement that reads as a
            # checked night when the other 48 went unanswered.
            counts="${counts} ($(group "$unverified") unanswered)"
          fi

          {
            echo "## Nightly Box object mirror — ${ENV_NAME}"
            echo
            if [ "$status" = "skipped" ]; then
              echo "Result: **skipped** — another run holds the lock, almost"
              echo "certainly the initial seed. Nothing was mirrored tonight;"
              echo "the seed is doing that work. This is expected until it ends."
            elif [ "$status" = "stopped" ]; then
              # Its own branch, because this is the ONE outcome that means
              # "this is fine". The Actions job hitting its time limit during
              # the seed lands here every night, having copied and recorded
              # thousands of objects; it used to read FAILED, "the mirror was
              # not updated this run" — both halves false.
              echo "Result: **stopped, progress kept** — the run was asked to"
              echo "stop before it finished the table, almost certainly the"
              echo "job's own time limit. Everything it copied is recorded and"
              echo "on Box; the next run carries on from there. Nothing is"
              echo "lost and nothing needs doing."
              if [ -n "${copied:-}" ] && [ "$copied" -gt 0 ]; then
                echo "It got through ${counts}."
              else
                echo "It stopped before copying anything — most likely during"
                echo "the manifest read, which a stop cannot interrupt."
              fi
            elif [ "$status" = "failed" ] && has_flag verify_mismatch; then
              echo "Result: **FAILED, and verification found objects missing**"
              echo "— objects failed to copy tonight AND the check found"
              echo "others the copy had reported as successful are not on Box."
              echo "Both are in the job log; the missing ones are named in the"
              echo "run report under \`_runs/\`. Read the log first: a night"
              echo "that failed copies outright is the larger problem."
            elif has_flag verify_mismatch; then
              # Reached only when the run did NOT fail: the branch above takes
              # a failed night first. Any flag branch added below this point
              # must do the same, or it will headline a night that failed to
              # copy 3,000 objects as a verification problem.
              echo "Result: **VERIFICATION FAILED** — objects the copy reported"
              echo "as successful are not on Box. Every one is named in the run"
              echo "report under \`_runs/\`."
              echo
              echo "The run changed nothing to compensate: the ledger still"
              echo "records them as mirrored, so later runs skip them and this"
              echo "warning does **not** repeat. Putting them back needs a"
              echo "person — see 'What verification does, and does not, prove'"
              echo "in the wiki. The run is recorded **partial**, so the"
              echo "watermark is held in the meantime."
              if has_flag collisions; then
                echo
                echo "This night **also** refused a name collision — see the"
                echo "job log. Resolve that first: the two are entangled, and"
                echo "acting on one while the other stands can lose a backup."
              fi
            elif has_flag collisions; then
              echo "Result: **OBJECTS NOT BACKED UP** — two object names"
              echo "normalize onto one path on Box, so only one of each pair"
              echo "can be stored and the job refused to overwrite the other."
              echo "Rename the object named at the START of each"
              echo "\`skipping\` line in the job log — renaming its twin"
              echo "instead leaves this one refused for ever. The run is"
              echo "recorded **partial**, so they stay in view until it is"
              echo "done."
              if [ "$status" = "failed" ]; then
                echo
                echo "**Objects also failed to copy tonight.** See the job log"
                echo "— that is the larger problem and this line does not"
                echo "mean nothing else went wrong."
              fi
            elif [ "$status" = "ok" ] || [ "$status" = "partial" ]; then
              if [ -n "$counts" ]; then
                echo "Result: **succeeded** — ${counts}"
              else
                echo "Result: **succeeded** (no counts in the log — check it)"
              fi
            else
              echo "Result: **FAILED** — see the job log. Some or all of"
              echo "tonight's objects were not mirrored; anything that did"
              echo "copy is recorded and will not be copied again."
            fi
            # Deliberately its own `if`, not another elif: the ledger upload is
            # best-effort, so this can happen on a night that otherwise
            # succeeded AND on one that reported a collision. As a branch it
            # would be hidden by whichever result won.
            if has_flag ledger_stale; then
              echo
              echo "> **The ledger on Box was NOT updated.** Objects still"
              echo "> copied fine — this is about the record of WHICH objects"
              echo "> are already mirrored, which is what makes a re-seed"
              echo "> unnecessary. It now exists only on the deploy host, the"
              echo "> machine this job exists to survive losing. Every later"
              echo "> night can still report success while that copy falls"
              echo "> further behind, so fix it now: the job log says why the"
              echo "> upload failed, and 'If the deploy host itself is gone'"
              echo "> in the wiki says what losing it costs."
            fi
            # Additive for the same reason as the rest: an object refused for
            # its name can happen on a night that otherwise copied fine, and
            # it is the same permanent non-backup a collision is.
            if has_flag skipped_names; then
              echo
              echo "> **Some images were not backed up because of their"
              echo "> filenames.** Box cannot store a name containing certain"
              echo "> characters, so those images were refused rather than"
              echo "> copied wrong. Nothing on this side can fix it — only"
              echo "> renaming them in Supabase can. Each is named with its"
              echo "> reason in the run report under \`_runs/\` on Box."
              echo ">"
              if [ "$status" = "ok" ]; then
                # Only true on a clean night. A stopped or failed run is
                # recorded partial, so the watermark IS held and tomorrow
                # re-enumerates and says it again.
                echo "> **This is the only night that will say so.** The run is"
                echo "> still recorded clean on purpose: holding the mirror's"
                echo "> progress timestamp for a filename nothing can fix on"
                echo "> its own would make every later night re-read all eight"
                echo "> million rows."
              fi
              echo "> The report on Box is the durable record — they are"
              echo "> listed under \`name_skips\`, apart from the collisions."
            fi
            # The mirror image of the notice above, and it must never be
            # merged with it: there, the host has the good ledger and Box is
            # behind. Here Box has the good one. An operator told to "fix a
            # stale Box copy" would overwrite eight million rows with twenty.
            if has_flag ledger_ahead; then
              echo
              echo "> **The ledger on Box is newer than this host's — the"
              echo "> upload was refused on purpose.** Box holds the record of"
              echo "> what is already mirrored and this host holds a smaller"
              echo "> one, which means this is not the machine that built the"
              echo "> mirror: a rebuilt host, or a wiped state directory."
              echo "> **Restore the Box copy onto this host. Do NOT upload"
              echo "> over it** — that would replace the record of millions of"
              echo "> objects with this run's, and cost a full re-seed. See"
              echo "> 'If the deploy host itself is gone' in the wiki."
            fi
            # Also additive, and for the same reason: a check that covered
            # less than it was asked to happens on a night that copied fine.
            if has_flag verify_incomplete; then
              echo
              echo "> **Verification did not cover its whole sample.** Box did"
              echo "> not answer for some of the objects it was asked about,"
              echo "> so those were neither confirmed present nor found"
              echo "> missing — the \`N verified\` count above is what was"
              echo "> actually established, not what was checked for. The"
              echo "> copies were confirmed as they were made, so this is"
              echo "> not a reason to re-copy anything. But a night reporting"
              echo "> success on the strength of a check that mostly did not"
              echo "> run is what the check exists to prevent, so if it"
              echo "> repeats see 'What verification does, and does not,"
              echo "> prove' in the wiki. The job log has the exact counts."
            fi
            echo
            echo '### This run'
            echo '```'
            # The level is the THIRD field, not the second: asctime is
            # "2026-08-31 12:08:16,440" and contains a space, so an anchor of
            # ^\S+ stops at the date and never reaches INFO. That pattern
            # matched nothing, on every run.
            #
            # `||` binds to the last command in a pipeline, and `tail` exits 0
            # on empty input, so the fallback could never fire either — the
            # block rendered as an empty fence. Capture first, then test.
            #
            # `|| true` for the same reason as the greps above: a run that
            # died at preflight matches none of these prefixes, and under
            # `bash -e` that killed the step before the fallback below.
            summary="$(grep -E '^[0-9-]+ [0-9:,]+ (INFO|WARNING|ERROR) (done —|verify:|listed|preflight|batch:)' \
              "${RUNNER_TEMP}/mirror-output.txt" 2>/dev/null | tail -20 || true)"
            if [ -n "$summary" ]; then
              echo "$summary"
            else
              echo "(no summary produced — the run did not reach the copy phase)"
            fi
            echo '```'
            echo
            echo "_This job only uploads. Nothing on Box is ever deleted by it._"
            echo "_Per-run reports, including verification counts, are written to"
            echo "\`<BACKUP_BOX_ROOT>/_runs/\` on Box._"
          } >> "$GITHUB_STEP_SUMMARY"
