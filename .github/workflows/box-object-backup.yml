name: Nightly Box object mirror

# Mirrors Supabase Storage objects (the image bytes in MinIO) to Box, nightly.
#
# This is the BYTES half of a backup. A full restore also needs the
# `storage.objects` rows, which the weekly Postgres dump carries — see
# scheduled-jobs/weekly-backup/. Both halves exist; neither is a restore
# until one has been rehearsed.
#
# Nightly rather than weekly so that at most a day's scans exist only in
# MinIO, rather than up to a week's.
#
# The work happens on the deploy host: this workflow SSHes in, the same way
# deploy.yml reaches the server, and starts the job in a container of its own,
# defined in scheduled-jobs/box-object-backup/compose.yml. The container joins
# production's Docker network to reach Postgres and MinIO — neither port is
# published — and runs rclone inside itself, so nothing listens on the host
# and nothing is copied onto the runner.
#
# The job UPLOADS ONLY. It never deletes anything on Box.
#
# Three things carried over from an earlier scheduled workflow in this repo,
# all of which were learned the hard way:
#
#   0. The FIRST scheduled run with an empty ledger has no watermark to work
#      from, so it enumerates everything — all 8M objects — inside a job with a
#      240 minute timeout. Seed by hand BEFORE promoting this to `main`; once a
#      seed is under way the lock makes this job stand down, but it cannot help
#      if no seed has started.
#   1. BOTH `schedule:` and `workflow_dispatch` require this file to be present
#      on the repo's DEFAULT branch (`main`) before either can fire -- dispatch
#      is gated on it exactly as schedule is. Nothing runs until the normal
#      staging -> main promotion carries this file there.
#   2. A `schedule` event carries no `github.event.inputs`, so the target is
#      resolved off `github.event_name` below rather than the dispatch input.
#   3. The scheduled run uses a SEPARATE, ungated GitHub Environment
#      (`production-scheduled-backup`) rather than `production` itself. Routing
#      an unattended 02:00 run through production's required-reviewer gate
#      would leave it stuck "Waiting" for an approval nobody is awake to give.
#
# THE SEED DOES NOT RUN HERE. The first full pass moves millions of objects
# over days; the self-hosted runner is shared with deploys and must not be held
# that long. The seed is started by hand, detached, on the host (see the wiki
# page). While it runs it holds a lock, and this workflow stands down against
# that lock -- reporting "skipped", not "succeeded", so a stood-down night is
# never mistaken for a completed one.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan and report, but copy nothing"
        required: false
        type: boolean
        default: false
      verify:
        description: "Objects to stat on Box afterwards and size-check"
        required: false
        type: string
        default: "50"
  schedule:
    # Every night at 02:17 UTC. Off the hour deliberately — GitHub's own docs
    # flag the top of the hour as a period of elevated scheduler load and delay.
    #
    # The delta query is `updated_at > <last clean run>` and storage.objects has
    # no index on updated_at, so each run is a sequential scan of ~8M rows.
    # Seven of those a week instead of one is a few minutes of extra scanning on
    # an otherwise idle database at 02:00; an index would remove even that and is
    # worth doing separately.
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  # Its own group, and specifically NOT deploy-bloom: a queued deploy must not
  # cancel a mirror, and the mirror must not hold up a deploy either.
  group: box-object-backup-production
  cancel-in-progress: false

env:
  # The job's own default for OBJECT_BACKUP_STATE_DIR, in one place. The run
  # step passes it to the job, and the summary falls back to the reports there
  # over an ssh session that reads no env file. compose.yml mounts the same
  # path, and the run step refuses to start if the job's value differs.
  STATE_DIR: /data/bloom/box-object-backup
  # `prod` is what the env file and the script call it; the GitHub Environment
  # is called `production`. Production is the only thing this workflow mirrors,
  # and staging is deliberately not offered: both environments live on this one
  # host, so they would share the ledger, the watermark and the run lock, and
  # two runs would read and advance each other's watermark — silently, and in
  # both directions. Mirroring staging as well means scoping all of those per
  # environment, which is a change worth making only if the need appears.
  ENV_NAME: prod

jobs:
  mirror:
    name: Mirror production objects to Box
    runs-on: [self-hosted, linux, salk-network]
    # A night's delta is small — new and changed images only. A run that takes
    # hours means something is wrong, or a seed is still in progress, and in the
    # latter case this job stands down in seconds.
    timeout-minutes: 240
    # Deliberately a DIFFERENT literal than the `ENV_NAME` above: this
    # is the approval-gate name, and the scheduled path must not be gated.
    environment: ${{ github.event_name == 'schedule' && 'production-scheduled-backup' || 'production' }}
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts


      - name: Run the mirror on the deploy host
        id: run
        env:
          ENV_NAME: ${{ env.ENV_NAME }}
          DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          VERIFY: ${{ github.event.inputs.verify || '50' }}
          RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
          STATE_DIR: ${{ env.STATE_DIR }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail

          # An empty value makes the remote `cd` succeed into $HOME and run
          # the job against whatever happens to be there.
          : "${DEPLOY_PATH:?deploy path is empty}"

          # `verify` is free-text: GitHub validates a workflow_dispatch input no
          # further than "is a string". Checked HERE, on the runner, so a value
          # that is not a plain number never reaches a shell at all.
          case "$VERIFY" in
            ''|*[!0-9]*) echo "verify must be a whole number, got: $VERIFY" >&2; exit 1 ;;
          esac

          # ssh cannot carry argv boundaries. Whatever words follow the host are
          # joined with spaces into ONE string and handed to the remote login
          # shell, which parses it as shell syntax. So `ssh host bash -s -- "$V"`
          # is no safer than interpolating $V into the command: it only moves
          # which shell does the parsing, and the heredoc's own guard runs
          # inside `bash -s`, which is merely the first statement of that string.
          #
          # `printf %q` quotes each value so the remote shell reparses the
          # joined string back into the arguments meant, rather than finding
          # new commands inside them. The heredoc stays quoted for the separate
          # reason that the runner must substitute nothing into the script.
          remote_args="$(printf '%q ' \
            "$DEPLOY_PATH" "$ENV_NAME" "$VERIFY" "$RUN_TAG" "$STATE_DIR" "$DRY_RUN")"

          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- $remote_args" \
            <<'REMOTE' 2>&1 | tee "${RUNNER_TEMP}/mirror-output.txt"
          set -euo pipefail
          deploy_path="$1"; env_name="$2"; verify="$3"; run_tag="$4"
          state_dir="$5"; dry_run="${6:-}"

          case "$verify" in
            ''|*[!0-9]*) echo "verify must be a whole number, got: $verify" >&2; exit 2 ;;
          esac
          # The container is named from it, and the cancel step stops that name.
          [[ "$run_tag" =~ ^[0-9]+-[0-9]+$ ]] || { echo "unexpected run tag: $run_tag" >&2; exit 2; }

          cd "$deploy_path"

          # One container for this run, from the job's own compose file. The
          # credentials come from the deploy env file through compose; every
          # other setting comes from the committed defaults, mounted read-only.
          #
          # The run records which GitHub job started it, in the lock it takes
          # and in the report it writes. The cancel step stops this container by
          # the same name, and the summary finds this run's report by it. A seed
          # started by hand is named `box-object-backup-seed`, which no run tag
          # can produce, so neither can ever act on it by mistake.
          #
          # --verify on every scheduled run: an unverified mirror cannot tell a
          # copied object from a lost one.
          docker compose -f scheduled-jobs/box-object-backup/compose.yml \
            --env-file ".env.$env_name" \
            run --rm -T --name "box-object-backup-$run_tag" \
            --user "$(id -u):$(id -g)" \
            -e OBJECT_BACKUP_ACTIONS_RUN="$run_tag" \
            box-object-backup \
            --env "$env_name" --state-dir "$state_dir" \
            --verify "$verify" $dry_run
          REMOTE

      # Cancelling this job ends the ssh session, and with it the compose client
      # on the host; the container can keep running. This step stops it by name:
      # SIGTERM, then compose.yml's grace period, which the container carries as
      # its own stop timeout. The job then finishes the copies in flight, records
      # them, writes its report and exits, and Docker removes the container.
      - name: Ask the host to stop the run, if this job was cancelled
        if: cancelled()
        env:
          RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        # Longer than compose.yml's grace period, and short enough that the summary
        # still fits GitHub's 5-minute limit on a cancelled run.
        timeout-minutes: 3
        run: |
          set -uo pipefail
          # Quoted for the same reason as the run step: ssh joins its trailing
          # words into one string for the remote shell to parse. This tag is a
          # run id and cannot carry a payload, but the pattern gets copied.
          remote_args="$(printf '%q ' "$RUN_TAG")"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s -- $remote_args" <<'REMOTE' || true
          set -uo pipefail
          run_tag="$1"
          # A run id and attempt only, so the name can never be the seed's.
          if ! [[ "$run_tag" =~ ^[0-9]+-[0-9]+$ ]]; then
            echo "unexpected run tag '$run_tag' — stopping nothing"
            exit 0
          fi
          name="box-object-backup-$run_tag"

          # An exact lookup by name. The name has letters outside [0-9a-f], so
          # Docker cannot read it as the start of a container id.
          if ! project="$(docker container inspect \
              --format '{{ index .Config.Labels "com.docker.compose.project" }}' \
              "$name" 2>/dev/null)"; then
            echo "no container $name — nothing was running"
            exit 0
          fi
          # Only the backup job's own containers; nothing of the Bloom stack.
          if [ "$project" != "bloom-box-object-backup" ]; then
            echo "$name belongs to '${project:-no project}', not the backup job — leaving it alone"
            exit 0
          fi

          echo "asking $name to stop"
          if docker stop "$name" > /dev/null; then
            echo "$name has stopped"
          else
            echo "::warning::docker stop $name failed; check it on the host"
          fi
          REMOTE

      # A run that stood down against the seed's lock exits 0, exactly as a
      # successful run does. The run's own status line is the only way to tell
      # them apart, and calling a stood-down night "succeeded" is how a months-long
      # gap in the mirror goes unnoticed.
      - name: Write the run summary
        if: always()
        env:
          ENV_NAME: ${{ env.ENV_NAME }}
          # Needed only for the fallback below: when the ssh pipe carrying the
          # run's output died before it printed a verdict, the summary fetches
          # that verdict from the report the run wrote on the host.
          RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
          STATE_DIR: ${{ env.STATE_DIR }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          # A dry run writes no report and records no run, so the summary must
          # be told rather than deducing it from what the log happens to say.
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        # This step fires exactly when the host may be wedged, and it is the
        # only thing standing between a cancelled night and a summary that
        # says FAILED. Bounded like the cancel step beside it, so a host that
        # never answers costs five minutes rather than the runner.
        timeout-minutes: 5
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/mirror-output.txt"
          report=""

          # A cancel or a timeout kills the pipe mid-run, so the log stops
          # before the verdict. The report the run wrote on the host is then
          # the only place that verdict exists. Asked for by this job's own
          # name, so a nightly that stood down against the seed's lock cannot
          # report the seed's night as its own.
          if ! grep -qE '^[0-9-]+ [0-9:,]+ [A-Z]+ BOX_BACKUP_STATUS=[a-z_]+$' "$log" 2>/dev/null \
             && [ -n "${DEPLOY_USER:-}" ] && [ -n "${DEPLOY_HOST:-}" ]; then
            report="${RUNNER_TEMP}/run-report.json"
            remote_args="$(printf '%q ' "$DEPLOY_PATH" "$STATE_DIR" "$RUN_TAG")"
            ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes \
              "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s -- $remote_args" \
              > "$report" 2>/dev/null <<'REMOTE' || true
          set -uo pipefail
          cd "$1" || exit 0
          python3 scheduled-jobs/box-object-backup/report.py \
            --state-dir "$2" --actions-run "$3"
          REMOTE
          fi

          python3 scheduled-jobs/box-object-backup/summary.py \
            --env "$ENV_NAME" --log "$log" --report "$report" \
            --outcome '${{ steps.run.outcome }}' \
            ${DRY_RUN:+--dry-run} >> "$GITHUB_STEP_SUMMARY"
