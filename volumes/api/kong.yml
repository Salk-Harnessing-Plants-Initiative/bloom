_format_version: '2.1'
_transform: true

###
### Consumers / Users
###
consumers:
  # Credentials for the basic-auth plugin on the `dashboard` service.
  - username: DASHBOARD
    basicauth_credentials:
      - username: $DASHBOARD_USERNAME
        password: $DASHBOARD_PASSWORD
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY
  - username: bloom_agent
    keyauth_credentials:
      - key: $BLOOM_AGENT_KEY

###
### Access Control List
###
acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin
  - consumer: bloom_agent
    group: bloom_agent

###
### API Routes
###
services:
  ## Open Auth routes
  - name: auth-v1-open
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-open
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors
  - name: auth-v1-open-callback
    url: http://auth:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors
  - name: auth-v1-open-authorize
    url: http://auth:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors
  - name: auth-v1-open-well-known
    _comment: 'OIDC discovery: read before the client has any key, so not behind key-auth'
    url: http://auth:9999/.well-known
    routes:
      - name: auth-v1-open-well-known
        strip_path: true
        paths:
          - /auth/v1/.well-known
    plugins:
      - name: cors
  - name: auth-v1-open-oauth
    _comment: 'OAuth 2.1: register, authorize, token, consent. GoTrue enforces the user Bearer on consent.'
    url: http://auth:9999/oauth
    routes:
      - name: auth-v1-open-oauth
        strip_path: true
        paths:
          - /auth/v1/oauth
    plugins:
      - name: cors

  ## Secure Auth routes
  - name: auth-v1
    _comment: 'GoTrue: /auth/v1/* -> http://auth:9999/*'
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Secure REST routes
  - name: rest-v1
    _comment: 'PostgREST: /rest/v1/* -> http://rest:3000/*'
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
            - bloom_agent

  ## Secure GraphQL routes
  - name: graphql-v1
    _comment: 'PostgREST: /graphql/v1/* -> http://rest:3000/rpc/graphql'
    url: http://rest:3000/rpc/graphql
    routes:
      - name: graphql-v1-all
        strip_path: true
        paths:
          - /graphql/v1
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: request-transformer
        config:
          add:
            headers:
              - Content-Profile:graphql_public
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Secure Realtime routes
  - name: realtime-v1-ws
    _comment: 'Realtime: /realtime/v1/* -> ws://realtime:4000/socket/*'
    url: http://realtime:4000/socket
    protocol: ws
    routes:
      - name: realtime-v1-ws
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
  - name: realtime-v1-rest
    _comment: 'Realtime: /realtime/v1/api -> http://realtime:4000/api'
    url: http://realtime:4000/api
    protocol: http
    routes:
      - name: realtime-v1-rest
        strip_path: true
        paths:
          - /realtime/v1/api
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
  ## Storage routes: the storage server manages its own auth
  - name: storage-v1
    _comment: 'Storage: /storage/v1/* -> http://storage:5000/*'
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors

  # ─── DORMANT ROUTES (commented out) ───────────────────────────────────
  # The `functions` (Supabase Edge Functions) and `analytics` (Logflare)
  # services are NOT in docker-compose.prod.yml — they were never wired
  # in for this stack. Without an actual container behind the hostname,
  # Kong returns 502 Bad Gateway for any client that hits these paths
  # (most clients never do, but a security scanner / Supabase-docs probe
  # can trigger them).
  #
  # The route definitions are retained here as a commented-out reference
  # so they're trivially restorable if/when we decide to add either
  # service: uncomment the block, add the matching `functions` /
  # `analytics` service to docker-compose.prod.yml, redeploy.
  #
  # ----------------------------------------------------------------------

  ## Edge Functions routes (DORMANT — see note above)
  # - name: functions-v1
  #   _comment: 'Edge Functions: /functions/v1/* -> http://functions:9000/*'
  #   url: http://functions:9000/
  #   routes:
  #     - name: functions-v1-all
  #       strip_path: true
  #       paths:
  #         - /functions/v1/
  #   plugins:
  #     - name: cors

  ## Analytics routes (DORMANT — see note above)
  # - name: analytics-v1
  #   _comment: 'Analytics: /analytics/v1/* -> http://logflare:4000/*'
  #   url: http://analytics:4000/
  #   routes:
  #     - name: analytics-v1-all
  #       strip_path: true
  #       paths:
  #         - /analytics/v1/

  ## Secure Database routes
  - name: meta
    _comment: 'pg-meta: /pg/* -> http://pg-meta:8080/*'
    url: http://meta:8080/
    routes:
      - name: meta-all
        strip_path: true
        paths:
          - /pg/
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin

  ## Protected Dashboard - catch all remaining routes
  - name: dashboard
    _comment: 'Studio: /* -> http://studio:3000/*'
    url: http://studio:3000/
    # Caddy proxied Studio with no read timeout at all before it was routed
    # through Kong, and Kong's service default is 60s -- short enough to 504 a
    # SQL-editor query or a deep table page over cyl_scan_traits.
    #
    # Set ABOVE the database's own bound, not equal to it: migration
    # 20240904033106 sets statement_timeout to 5min database-wide and
    # supabase_admin (the role pg-meta connects as) has no override, so every
    # Studio query is already capped at 300s. Kong starts its clock earlier, so
    # an equal bound guarantees Kong's opaque 504 pre-empts Postgres's readable
    # "canceling statement due to statement timeout". 330s leaves 30s of margin,
    # which makes a 504 here mean something OTHER than the query is stuck.
    #
    # connect_timeout is a TCP connect to studio:3000 on the same bridge network
    # -- single-digit ms when Studio is up, so a short bound fails fast instead
    # of hanging every request for a minute when it is down. 60000 was Kong's
    # own default restated, i.e. no bound at all in practice.
    connect_timeout: 5000
    write_timeout: 330000
    read_timeout: 330000
    routes:
      - name: dashboard-all
        strip_path: true
        paths:
          - /
    plugins:
      - name: cors
      - name: basic-auth
        config:
          hide_credentials: true
