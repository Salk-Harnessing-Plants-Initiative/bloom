[project]
name = "bloomctl"
version = "0.1.0a4"
description = "Bloom command-line tool for Bloom Database"
# The PyPI landing page. README.md is the fuller in-repo doc.
readme = "README.pypi.md"
requires-python = ">=3.11"
license = "BSD-2-Clause"
authors = [{ name = "Salk Harnessing Plants Initiative" }]
keywords = ["bloom", "cli", "plant-phenotyping","cylinder"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.2",  # 8.2 splits stdout from stderr, which the tests assert on
    "rich>=13.0",
    # Both upper bounds are load-bearing: httpx 1.0 and supabase 3.0 each remove
    # something we import, so a --pre install picks them up and nothing runs (#629).
    "httpx>=0.27,<1.0",
    "supabase>=2.0.0,<3",
    "python-dotenv>=1.0.0",
    "cryptography>=50.0.0",  # CVE-2026-69247
    "sleap-roots-contracts>=0.1.0a5",  # pydantic models for `cyl ingest`
    "h2>=4.4.1",  # CVE-2026-71554
]

[project.urls]
Homepage = "https://github.com/Salk-Harnessing-Plants-Initiative/bloom/tree/main/bloomcli"
Repository = "https://github.com/Salk-Harnessing-Plants-Initiative/bloom"
Changelog = "https://github.com/Salk-Harnessing-Plants-Initiative/bloom/blob/main/bloomcli/CHANGELOG.md"

[project.scripts]
# errors:main wraps cli so an unhandled failure is a message, not a stack trace.
bloomctl = "bloomctl.errors:main"

# An extra, not a dependency-group, so CI runs `uv run --extra test pytest`.
[project.optional-dependencies]
test = [
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bloomctl"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: requires live staging credentials (env-gated; self-skips when absent)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # the formatter owns line length
