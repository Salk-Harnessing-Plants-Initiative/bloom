[project]
name = "bloom-workflows"
version = "0.1.0"
description = "HTTP API service hosting Bloom workflow endpoints"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    # Caller-JWT validation via Supabase /auth/v1/user.
    "httpx>=0.27",
    # Auth + PostgREST + Storage as the dedicated app user (mirrors bloomctl).
    "supabase>=2.0.0",
    # Frame decoding + encoding for scan-to-video.
    "numpy>=2.0.0",
    "pillow>=12.0.0",
    # Security floor for the supabase auth/JWT transitive dep, per repo convention.
    # Bumped past CVE-2026-69247 (fixed in 50.0.0), disclosed 2026-08-03.
    "cryptography>=50.0.0",
    # compute_param_hash for the pipeline-trigger dedup preview (params-only, not
    # model-version-aware — see openspec/changes/add-cyl-pipeline-trigger/design.md).
    "sleap-roots-contracts>=0.1.0a5",
    # Security floor for h2, transitive via httpx[http2]: CVE-2026-71554
    # (fixed in 4.4.1), disclosed 2026-08-06. Open floor per repo convention.
    "h2>=4.4.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
]
