[project]
name = "bloommcp"
version = "0.1.0"
description = "Bloom MCP server exposing SLEAP root-trait analysis tools over the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-2-Clause"
authors = [{ name = "Salk Harnessing Plants Initiative" }]
keywords = ["mcp", "sleap", "plant-phenotyping", "root-traits", "bloom"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    # Security floors for transitive FastAPI-stack deps (see issue #311):
    # pin past upstream CVE fix versions. Open floors per repo convention.
    "cryptography>=48.0.1",
    "python-multipart>=0.0.31",
    "starlette>=1.1.0",
    # pydantic-settings GHSA-4xgf-cpjx-pc3j (disclosed 2026-06-19):
    # NestedSecretsSettingsSource follows symlinks outside the configured
    # secrets directory. Fix in 2.14.2+. Transitive via fastmcp/supabase.
    "pydantic-settings>=2.14.2",
    # mcp CVE-2026-52870, CVE-2026-52869, CVE-2026-59950 (disclosed 2026-07-16):
    # fixed in 1.28.1. Transitive via fastmcp (fastmcp 3.2.3 constrains
    # mcp<2.0,>=1.24.0, so 1.28.1 fits without a fastmcp bump). Open floor per
    # repo convention.
    "mcp>=1.28.1",
    # Supabase PostgREST + Storage client, used by bloom_mcp.supabase_client
    # for CSV exchange via the bloommcp-data bucket.
    "supabase>=2.0.0",
    # Phase-2 foundation: the public root-trait analysis library (source of the
    # cross-tier oracle's perform_* functions) and the contracts schemas.
    "sleap-roots-analyze>=0.1.0a5",
    "sleap-roots-contracts[pandas]>=0.1.0a1",
    # Data & analysis. numpy floor is >=2.3.2 because sleap-roots-analyze
    # requires numpy 2.x. statsmodels + umap-learn were pruned in #315; scipy +
    # scikit-learn + seaborn were pruned in devendor-bloommcp-analysis (#305 AC5,
    # necessary-and-sufficient completed): their only importers were the vendored
    # analysis/plotting modules, deleted once every consumer delegated to
    # sleap_roots_analyze. scikit-learn moves to the `test` extra below (its only
    # remaining use is test_oracle.py's UMAP-trustworthiness metric); scipy/seaborn
    # have no importer left at all. matplotlib is retained — the sleap_roots
    # section's 5 plotting tools import it directly for rendering. Runtime
    # resolution is unaffected: the sleap-roots-analyze pin pulls scikit-learn/
    # scipy/seaborn transitively.
    "pandas>=2.0.0",
    "numpy>=2.3.2",
    # Visualization
    "matplotlib>=3.7.0",
]

[project.scripts]
bloom-mcp = "bloom_mcp.server:main"

# Test stack lives in the `test` extra (not a dev dependency-group) so CI invokes
# it as `uv run --extra test pytest` — the repo-wide convention enforced by
# tests/unit/test_ci_workflow_uv_conventions.py and matching langchain /
# video-worker. The extra is opt-in, so `uv sync --no-dev` keeps it out of the
# prod image.
[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "hypothesis>=6.0",
    "syrupy>=4.0",
    # test_oracle.py's UMAP-trustworthiness metric is the only remaining user
    # (devendor-bloommcp-analysis) — kept out of the prod image via `uv sync --no-dev`.
    "scikit-learn>=1.3.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bloom_mcp"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: full-fixture statsmodels/umap oracle tests over turface_19 — slow, intermittently stalls in CI containers; excluded from per-PR CI, run via /pre-merge or pytest -m integration",
    "live_smoke: needs the real running dev stack (Docker Compose + Supabase + MinIO); excluded from python-audit's per-PR run; the CI-safe subset runs in dev-stack-smoke, the full set via /pre-merge",
    "live_smoke_slow: live_smoke tests whose delegate is numerically ill-conditioned at scale (rank-deficient covariance, per-trait MixedLM fits); always also carries live_smoke; excluded from dev-stack-smoke, runs only via /pre-merge",
]

