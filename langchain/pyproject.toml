[project]
name = "bloom-langchain-agent"
version = "0.1.0"
description = "Bloom LangGraph agent for plant phenotyping AI assistant"
requires-python = ">=3.11"
dependencies = [
    # Patch-bumped past GHSA-gr75-jv2w-4656 (langchain 1.2.x vulnerability,
    # fix in 1.3.9). Keep the floor open per repo convention.
    "langchain>=1.3.9",
    "langchain-openai>=0.2.0",
    # Patch-bumped past PYSEC-2026-2556 (fix in 1.4.6). Keep the floor open per repo convention.
    "langchain-anthropic>=1.4.6",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "PyJWT>=2.8.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    # Security floors for transitive FastAPI-stack deps (see issue #311):
    # pin past upstream CVE fix versions. Open floors per repo convention.
    "cryptography>=48.0.1",
    "python-multipart>=0.0.31",
    "starlette>=1.1.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "scipy>=1.11",
    # Security floors for transitive deps disclosed 2026-06-19:
    # langsmith (GHSA-f4xh-w4cj-qxq8) — file-read via TracingMiddleware
    # pydantic-settings (GHSA-4xgf-cpjx-pc3j) — symlink follow in
    # NestedSecretsSettingsSource. Open floors per repo convention.
    "langsmith>=0.8.18",
    "pydantic-settings>=2.14.2",
    # Security floor for transitive dep disclosed 2026-07-16:
    # mcp (CVE-2026-52870, CVE-2026-52869, CVE-2026-59950) — fixed in 1.28.1.
    # Transitive via langchain-mcp-adapters (floor >=1.9.2). Open floor per
    # repo convention.
    "mcp>=1.28.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
