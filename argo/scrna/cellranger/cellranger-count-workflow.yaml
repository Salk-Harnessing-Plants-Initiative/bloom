# A Cell Ranger run started by hand, loaded into prod's Bloom: each sample becomes a dataset
# named after it, under `species` (a species' common name). argo/scrna/README.md has the command,
# and the staging variant.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: cellranger-count-
  namespace: runai-busch-lab
  labels:
    project: busch-lab
spec:
  entrypoint: main
  # Step pods report results as bloom-workflow; without it every step fails on workflowtaskresults.
  serviceAccountName: bloom-workflow
  imagePullSecrets:
    - name: dockerregistry-bloom-ghcr-pull   # from the busch-lab Run:ai credential bloom-ghcr-pull
  ttlStrategy:
    secondsAfterCompletion: 86400
  arguments:
    parameters:
      - name: samples
        value: '[]'
      - name: reference
        value: ""
      # Required: the species every sample's dataset is loaded under.
      - name: species
  # The pipeline's Bloom login: load-dataset loads with it and run-with-log uploads the logs.
  volumes:
    - name: bloom-credentials
      secret:
        secretName: genericsecret-bloom-prod-pipeline-credentials
        optional: true
  templates:
    - name: main
      dag:
        tasks:
          - name: stage-reference
            templateRef:
              name: cellranger-count-template
              template: stage-reference
            arguments:
              parameters:
                - name: reference
                  value: "{{workflow.parameters.reference}}"
          - name: sample
            depends: stage-reference
            templateRef:
              name: cellranger-count-template
              template: sample-pipeline
            withParam: "{{workflow.parameters.samples}}"
            arguments:
              parameters:
                - name: sample
                  value: "{{item}}"
                - name: reference
                  value: "{{workflow.parameters.reference}}"
                - name: run-id
                  value: "{{item}}"
                - name: dataset-name
                  value: "{{item}}"
                - name: species-name
                  value: "{{workflow.parameters.species}}"
