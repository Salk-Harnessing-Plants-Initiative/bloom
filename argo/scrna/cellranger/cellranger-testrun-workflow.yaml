# argo submit argo/scrna/cellranger/cellranger-testrun-workflow.yaml -n runai-busch-lab
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: cellranger-testrun-
  namespace: runai-busch-lab
  labels:
    project: busch-lab
spec:
  entrypoint: main
  serviceAccountName: bloom-workflow
  imagePullSecrets:
    - name: GHCR_PULL_SECRET_NAME   # the k8s secret the Run:ai project credential creates
  ttlStrategy:
    secondsAfterCompletion: 86400
  templates:
    - name: main
      dag:
        tasks:
          - name: testrun
            templateRef:
              name: cellranger-count-template
              template: testrun
