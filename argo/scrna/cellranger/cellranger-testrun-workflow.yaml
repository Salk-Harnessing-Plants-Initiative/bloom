# argo submit argo/scrna/cellranger/cellranger-testrun-workflow.yaml -n runai-busch-lab
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: cellranger-testrun-
  namespace: runai-busch-lab
  labels:
    project: busch-lab
spec:
  entrypoint: main
  serviceAccountName: bloom-workflow
  imagePullSecrets:
    - name: dockerregistry-bloom-ghcr-pull   # from the busch-lab Run:ai credential bloom-ghcr-pull
  ttlStrategy:
    secondsAfterCompletion: 86400
  templates:
    - name: main
      dag:
        tasks:
          - name: testrun
            templateRef:
              name: cellranger-count-template
              template: testrun
