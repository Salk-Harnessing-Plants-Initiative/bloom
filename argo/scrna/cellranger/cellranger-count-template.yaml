# Register once: argo template create argo/scrna/cellranger/cellranger-count-template.yaml -n runai-busch-lab
# After changes: kubectl replace -f argo/scrna/cellranger/cellranger-count-template.yaml -n runai-busch-lab
#
# Every step mounts the same NFS folder at /shared:
#   /shared/ref/<reference>/  references, downloaded once and kept
#   /shared/runs/<run-id>/    one sample's reads and QC files, deleted after success
# The share does not support symlinks, so Cell Ranger's working folder is the count pod's own /work.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cellranger-count-template
  labels:
    project: busch-lab
spec:
  templates:
    # One sample: stage -> qc -> count -> preprocess -> analyses -> build-h5ad -> cleanup, all in
    # /shared/runs/<run-id>/ so runs never share files. Only build-h5ad uploads: the final .h5ad to
    # runs_output/<run-id>/h5ad/. Skips everything if that file is already there.
    - name: sample-pipeline
      inputs:
        parameters:
          - name: sample
          - name: reference
          - name: run-id
          - name: cores
            value: "16"
          - name: memory
            value: "64Gi"
          - name: mem-gb
            value: "60"
          - name: n-top-genes
            value: "2000"
      dag:
        tasks:
          - name: stage
            template: stage-sample
            arguments:
              parameters:
                - name: sample
                  value: "{{inputs.parameters.sample}}"
                - name: run-id
                  value: "{{inputs.parameters.run-id}}"
          - name: qc
            template: qc
            depends: stage
            when: "{{tasks.stage.outputs.parameters.done}} == false"
            arguments:
              parameters:
                - name: sample
                  value: "{{inputs.parameters.sample}}"
                - name: run-id
                  value: "{{inputs.parameters.run-id}}"
          - name: count
            template: count
            depends: qc
            when: "{{tasks.stage.outputs.parameters.done}} == false"
            arguments:
              parameters:
                - name: sample
                  value: "{{inputs.parameters.sample}}"
                - name: reference
                  value: "{{inputs.parameters.reference}}"
                - name: run-id
                  value: "{{inputs.parameters.run-id}}"
                - name: cores
                  value: "{{inputs.parameters.cores}}"
                - name: memory
                  value: "{{inputs.parameters.memory}}"
                - name: mem-gb
                  value: "{{inputs.parameters.mem-gb}}"
          - name: cleanup
            template: cleanup
            depends: build-h5ad
            when: "{{tasks.stage.outputs.parameters.done}} == false"
            arguments:
              parameters:
                - name: run-id
                  value: "{{inputs.parameters.run-id}}"
          - name: preprocess
            template: preprocess
            depends: count
            when: "{{tasks.stage.outputs.parameters.done}} == false"
            arguments:
              parameters:
                - name: run-id
                  value: "{{inputs.parameters.run-id}}"
                - name: n-top-genes
                  value: "{{inputs.parameters.n-top-genes}}"
          # Analyses: each reads the base and writes its own part. A new one is one more task
          # here, and one more name in build-h5ad's depends.
          - name: cluster
            template: cluster
            depends: preprocess
            when: "{{tasks.stage.outputs.parameters.done}} == false"
            arguments:
              parameters:
                - name: run-id
                  value: "{{inputs.parameters.run-id}}"
          - name: build-h5ad
            template: build-h5ad
            depends: cluster
            when: "{{tasks.stage.outputs.parameters.done}} == false"
            arguments:
              parameters:
                - name: sample
                  value: "{{inputs.parameters.sample}}"
                - name: run-id
                  value: "{{inputs.parameters.run-id}}"

    # Once per workflow: stage the reference at /shared/ref/<reference>/, or reuse it if already there.
    - name: stage-reference
      inputs:
        parameters:
          - name: reference
      schedulerName: runai-scheduler
      priorityClassName: high
      retryStrategy:
        limit: 2
        retryPolicy: Always
        # exit 3 (no reference) and 4 (no FASTQs) will not fix themselves on a retry
        expression: "asInt(lastRetry.exitCode) != 3 && asInt(lastRetry.exitCode) != 4"
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/cellranger:10.1.0-8
        command: [bash, -c]
        args:
          - |
            set -euo pipefail
            case "${REFERENCE}" in
              ""|.|..|*/*) echo "ERROR: bad reference name '${REFERENCE}'"; exit 3 ;;
            esac
            ref="/shared/ref/${REFERENCE}"
            # References never change once uploaded, so a staged copy is reused as-is.
            if [ -f "${ref}/reference.json" ]; then
              echo "Reference ${REFERENCE} already staged at ${ref}; nothing to download."
              exit 0
            fi
            tmp="/shared/ref/.partial-${REFERENCE}-${WORKFLOW_NAME}"
            rm -rf -- "${tmp}"
            mkdir -p "${tmp}"
            aws s3 sync "s3://bloomv2-workflows/reference_genome/${REFERENCE}/" "${tmp}/"
            # sync from a missing prefix copies nothing and still exits 0
            if [ ! -f "${tmp}/reference.json" ]; then
              echo "ERROR: no Cell Ranger reference at s3://bloomv2-workflows/reference_genome/${REFERENCE}/ (expected reference.json)"
              rm -rf -- "${tmp}"
              exit 3
            fi
            # Publish with one rename so a half-copied reference never looks complete.
            if [ -f "${ref}/reference.json" ]; then
              echo "Reference ${REFERENCE} was staged by another run meanwhile; keeping that copy."
              rm -rf -- "${tmp}"
            else
              rm -rf -- "${ref}"
              mv -- "${tmp}" "${ref}"
              echo "Reference ${REFERENCE} staged at ${ref}"
            fi
        env:
          - name: REFERENCE
            value: "{{inputs.parameters.reference}}"
          - name: WORKFLOW_NAME
            value: "{{workflow.name}}"
          - name: AWS_DEFAULT_REGION
            value: us-west-2
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_SECRET_ACCESS_KEY
        resources:
          requests: {cpu: "2", memory: 4Gi}
          limits: {cpu: "2", memory: 4Gi}
        volumeMounts:
          - name: shared
            mountPath: /shared
      volumes:
        - name: shared
          hostPath:
            path: /hpi/hpi_dev/users/bfernando/scrna
            type: Directory

    # For a run that imports its sample from SRA: download the runs into raw_reads/<sample>/ as
    # Illumina-named FASTQs, next to stage-reference. Outputs the folder's FASTQ count and size.
    - name: fetch-sra
      inputs:
        parameters:
          - name: sample
          - name: sra-runs
          - name: run-id
      outputs:
        parameters:
          - name: fastq-count
            valueFrom:
              path: /tmp/outputs/fastq_count
          - name: total-bytes
            valueFrom:
              path: /tmp/outputs/total_bytes
      schedulerName: runai-scheduler
      priorityClassName: high
      retryStrategy:
        limit: 1
        retryPolicy: Always
        # only a failed download (10) may be a blip; bad input (6), misnamed files (7),
        # unusable reads (11) and a taken folder (12) will not fix themselves
        expression: "asInt(lastRetry.exitCode) == 10"
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/cellranger:10.1.0-8
        command: [fetch-sra]
        env:
          - name: SAMPLE
            value: "{{inputs.parameters.sample}}"
          - name: SRA_RUNS
            value: "{{inputs.parameters.sra-runs}}"
          - name: WORK_DIR
            value: "/shared/runs/{{inputs.parameters.run-id}}/sra"
          - name: THREADS
            value: "8"
          - name: OUTPUT_DIR
            value: /tmp/outputs
          - name: AWS_DEFAULT_REGION
            value: us-west-2
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_SECRET_ACCESS_KEY
        resources:
          requests: {cpu: "8", memory: 16Gi}
          limits: {cpu: "8", memory: 16Gi}
        volumeMounts:
          - name: shared
            mountPath: /shared
      volumes:
        - name: shared
          hostPath:
            path: /hpi/hpi_dev/users/bfernando/scrna
            type: Directory

    # Create /shared/runs/<run-id>/ and download the reads; outputs done=true if the run already finished.
    - name: stage-sample
      inputs:
        parameters:
          - name: sample
          - name: run-id
      outputs:
        parameters:
          - name: done
            valueFrom:
              path: /tmp/done
      schedulerName: runai-scheduler
      priorityClassName: high
      retryStrategy:
        limit: 2
        retryPolicy: Always
        # exit 4 (no FASTQs) and 7 (misnamed FASTQs) will not fix themselves on a retry
        expression: "asInt(lastRetry.exitCode) != 4 && asInt(lastRetry.exitCode) != 7"
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/cellranger:10.1.0-8
        command: [bash, -c]
        args:
          - |
            set -euo pipefail
            if aws s3 ls "s3://bloomv2-workflows/runs_output/${RUN_ID}/h5ad/_SUCCESS" >/dev/null 2>&1; then
              echo "Already done: runs_output/${RUN_ID}/h5ad/_SUCCESS exists, nothing to do."
              echo true > /tmp/done
              exit 0
            fi
            mkdir -p "/shared/runs/${RUN_ID}/fastq/${SAMPLE}"
            aws s3 sync "s3://bloomv2-workflows/raw_reads/${SAMPLE}/" "/shared/runs/${RUN_ID}/fastq/${SAMPLE}/"
            # sync from a missing prefix copies nothing and still exits 0
            if ! compgen -G "/shared/runs/${RUN_ID}/fastq/${SAMPLE}/*.fastq*" >/dev/null; then
              echo "ERROR: no FASTQs at s3://bloomv2-workflows/raw_reads/${SAMPLE}/"
              exit 4
            fi
            # Fails here, before QC, if a file isn't Illumina-named or a lane lacks R1 or R2.
            prefix="$(fastq-sample-prefix "/shared/runs/${RUN_ID}/fastq/${SAMPLE}")" || exit 7
            echo "FASTQ prefix: ${prefix}"
            echo false > /tmp/done
        env:
          - name: SAMPLE
            value: "{{inputs.parameters.sample}}"
          - name: RUN_ID
            value: "{{inputs.parameters.run-id}}"
          - name: AWS_DEFAULT_REGION
            value: us-west-2
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_SECRET_ACCESS_KEY
        resources:
          requests: {cpu: "2", memory: 4Gi}
          limits: {cpu: "2", memory: 4Gi}
        volumeMounts:
          - name: shared
            mountPath: /shared
      volumes:
        - name: shared
          hostPath:
            path: /hpi/hpi_dev/users/bfernando/scrna
            type: Directory

    # QC on the staged reads (run-qc's download finds them already there); uploads runs_output/<run-id>/qc/.
    - name: qc
      inputs:
        parameters:
          - name: sample
          - name: run-id
      schedulerName: runai-scheduler
      priorityClassName: high
      retryStrategy:
        limit: 1
        retryPolicy: OnError
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/cellranger:10.1.0-8
        command: [run-qc]
        env:
          - name: SAMPLE
            value: "{{inputs.parameters.sample}}"
          - name: RUN_ID
            value: "{{inputs.parameters.run-id}}"
          - name: CORES
            value: "4"
          - name: WORK_DIR
            value: "/shared/runs/{{inputs.parameters.run-id}}"
          # The report stays in the run's folder; only the final .h5ad goes to S3.
          - name: UPLOAD_REPORT
            value: "false"
          - name: AWS_DEFAULT_REGION
            value: us-west-2
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_SECRET_ACCESS_KEY
        resources:
          requests: {cpu: "4", memory: 8Gi}
          limits: {cpu: "4", memory: 8Gi}
        volumeMounts:
          - name: shared
            mountPath: /shared
      volumes:
        - name: shared
          hostPath:
            path: /hpi/hpi_dev/users/bfernando/scrna
            type: Directory

    # cellranger count on the staged reads and shared reference; working files on the pod's own disk.
    - name: count
      inputs:
        parameters:
          - name: sample
          - name: reference
          - name: run-id
          - name: cores
          - name: memory
          - name: mem-gb
      schedulerName: runai-scheduler
      # CPU and memory come from parameters, so they are set when the pod starts, not at registration.
      podSpecPatch: |
        containers:
          - name: main
            resources:
              requests:
                cpu: "{{inputs.parameters.cores}}"
                memory: "{{inputs.parameters.memory}}"
              limits:
                cpu: "{{inputs.parameters.cores}}"
                memory: "{{inputs.parameters.memory}}"
      # Non-preemptible class used by the sleap-roots trait-extractor; confirm with the cluster admin.
      priorityClassName: high
      retryStrategy:
        limit: 2
        retryPolicy: Always
        # exit 3 (no reference), 4 (no FASTQs), 6 (unusable sample name) and 7 (misnamed FASTQs)
        # will not fix themselves on a retry
        expression: "asInt(lastRetry.exitCode) != 3 && asInt(lastRetry.exitCode) != 4 && asInt(lastRetry.exitCode) != 6 && asInt(lastRetry.exitCode) != 7"
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/cellranger:10.1.0-8
        command: [run-count]
        env:
          - name: SAMPLE
            value: "{{inputs.parameters.sample}}"
          - name: REFERENCE
            value: "{{inputs.parameters.reference}}"
          - name: RUN_ID
            value: "{{inputs.parameters.run-id}}"
          - name: CORES
            value: "{{inputs.parameters.cores}}"
          - name: MEM_GB
            value: "{{inputs.parameters.mem-gb}}"
          - name: WORK_DIR
            value: /work
          - name: RESULTS_DIR
            value: "/shared/runs/{{inputs.parameters.run-id}}"
          - name: FASTQ_DIR
            value: "/shared/runs/{{inputs.parameters.run-id}}/fastq/{{inputs.parameters.sample}}"
          - name: REF_DIR
            value: "/shared/ref/{{inputs.parameters.reference}}"
          - name: AWS_DEFAULT_REGION
            value: us-west-2
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_SECRET_ACCESS_KEY
        volumeMounts:
          - name: shared
            mountPath: /shared
          - name: work
            mountPath: /work
      volumes:
        - name: shared
          hostPath:
            path: /hpi/hpi_dev/users/bfernando/scrna
            type: Directory
        - name: work
          emptyDir:
            sizeLimit: 500Gi

    # Delete /shared/runs/<run-id>/ once the run has finished; results and raw reads stay in S3.
    - name: cleanup
      inputs:
        parameters:
          - name: run-id
      schedulerName: runai-scheduler
      priorityClassName: high
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/cellranger:10.1.0-8
        command: [bash, -c]
        args:
          - |
            set -euo pipefail
            case "${RUN_ID}" in
              ""|.|..|*/*) echo "refusing to delete: bad run id '${RUN_ID}'"; exit 1 ;;
            esac
            target="/shared/runs/${RUN_ID}"
            if [ -d "${target}" ]; then rm -rf -- "${target}"; fi
            echo "removed ${target}"
        env:
          - name: RUN_ID
            value: "{{inputs.parameters.run-id}}"
        resources:
          requests: {cpu: "0.5", memory: 512Mi}
          limits: {cpu: "0.5", memory: 512Mi}
        volumeMounts:
          - name: shared
            mountPath: /shared
      volumes:
        - name: shared
          hostPath:
            path: /hpi/hpi_dev/users/bfernando/scrna
            type: Directory

    # /shared/runs/<run-id>/: count matrix -> analysis/preprocess/base.h5ad (filter, normalise, variable genes, PCA).
    - name: preprocess
      inputs:
        parameters:
          - name: run-id
          - name: n-top-genes
      schedulerName: runai-scheduler
      priorityClassName: high
      retryStrategy:
        limit: 1
        retryPolicy: Always
        # 13 (too few cells), 14 (no count matrix) and 15 (parts don't fit) won't fix themselves
        expression: "asInt(lastRetry.exitCode) != 13 && asInt(lastRetry.exitCode) != 14 && asInt(lastRetry.exitCode) != 15"
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/scrna-analysis:0.1.0
        args: [preprocess, "--root", "/shared/runs/{{inputs.parameters.run-id}}", "--n-top-genes", "{{inputs.parameters.n-top-genes}}"]
        env:
          - name: AWS_DEFAULT_REGION
            value: us-west-2
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_SECRET_ACCESS_KEY
        resources:
          requests: {cpu: "4", memory: 16Gi}
          limits: {cpu: "4", memory: 16Gi}
        volumeMounts:
          - name: shared
            mountPath: /shared
      volumes:
        - name: shared
          hostPath:
            path: /hpi/hpi_dev/users/bfernando/scrna
            type: Directory

    # Base -> analysis/cluster/part.h5ad: neighbour graph, Leiden clusters, UMAP.
    - name: cluster
      inputs:
        parameters:
          - name: run-id
      schedulerName: runai-scheduler
      priorityClassName: high
      retryStrategy:
        limit: 1
        retryPolicy: Always
        # 13 (too few cells), 14 (no count matrix) and 15 (parts don't fit) won't fix themselves
        expression: "asInt(lastRetry.exitCode) != 13 && asInt(lastRetry.exitCode) != 14 && asInt(lastRetry.exitCode) != 15"
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/scrna-analysis:0.1.0
        args: [cluster, "--root", "/shared/runs/{{inputs.parameters.run-id}}"]
        env:
          - name: AWS_DEFAULT_REGION
            value: us-west-2
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_SECRET_ACCESS_KEY
        resources:
          requests: {cpu: "4", memory: 8Gi}
          limits: {cpu: "4", memory: 8Gi}
        volumeMounts:
          - name: shared
            mountPath: /shared
      volumes:
        - name: shared
          hostPath:
            path: /hpi/hpi_dev/users/bfernando/scrna
            type: Directory

    # Base + every finished part -> h5ad/<sample>.h5ad and summary.json, copied to runs_output/<run-id>/h5ad/ in S3.
    - name: build-h5ad
      inputs:
        parameters:
          - name: sample
          - name: run-id
      schedulerName: runai-scheduler
      priorityClassName: high
      retryStrategy:
        limit: 1
        retryPolicy: Always
        # 13 (too few cells), 14 (no count matrix) and 15 (parts don't fit) won't fix themselves
        expression: "asInt(lastRetry.exitCode) != 13 && asInt(lastRetry.exitCode) != 14 && asInt(lastRetry.exitCode) != 15"
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/scrna-analysis:0.1.0
        args: [build-h5ad, "--root", "/shared/runs/{{inputs.parameters.run-id}}", "--sample", "{{inputs.parameters.sample}}", "--publish", "s3://bloomv2-workflows/runs_output/{{inputs.parameters.run-id}}"]
        env:
          - name: AWS_DEFAULT_REGION
            value: us-west-2
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_SECRET_ACCESS_KEY
        resources:
          requests: {cpu: "4", memory: 16Gi}
          limits: {cpu: "4", memory: 16Gi}
        volumeMounts:
          - name: shared
            mountPath: /shared
      volumes:
        - name: shared
          hostPath:
            path: /hpi/hpi_dev/users/bfernando/scrna
            type: Directory

    # Smoke test: bundled tiny dataset, no reads or reference needed.
    - name: testrun
      schedulerName: runai-scheduler
      priorityClassName: high
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/cellranger:10.1.0-8
        command: [bash, -c]
        args:
          - |
            set -euo pipefail
            cd /work
            cellranger testrun --id=check_install --localcores=4 --localmem=14
            OUT="s3://bloomv2-workflows/runs_output/argo_testrun_{{workflow.name}}"
            aws s3 sync check_install/outs "$OUT/outs/"
            echo "DONE -> $OUT"
        env:
          - name: AWS_DEFAULT_REGION
            value: us-west-2
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_SECRET_ACCESS_KEY
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
          limits:
            cpu: "4"
            memory: 16Gi
        volumeMounts:
          - name: work
            mountPath: /work
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 20Gi
