# Register once: argo template create argo/scrna/cellranger/cellranger-count-template.yaml -n runai-busch-lab
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cellranger-count-template
  labels:
    project: busch-lab
spec:
  templates:
    # One sample: S3 reads + reference -> cellranger count -> runs_output/<run-id>/
    - name: count
      inputs:
        parameters:
          - name: sample
          - name: reference
          - name: run-id
          - name: cores
            value: "16"
          - name: memory
            value: "64Gi"
          - name: mem-gb
            value: "60"
      schedulerName: runai-scheduler
      # CPU and memory come from parameters, so they are set when the pod starts, not at registration.
      podSpecPatch: |
        containers:
          - name: main
            resources:
              requests:
                cpu: "{{inputs.parameters.cores}}"
                memory: "{{inputs.parameters.memory}}"
              limits:
                cpu: "{{inputs.parameters.cores}}"
                memory: "{{inputs.parameters.memory}}"
      # Non-preemptible class used by the sleap-roots trait-extractor; confirm with the cluster admin.
      priorityClassName: high
      retryStrategy:
        limit: 2
        retryPolicy: Always
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/cellranger:10.1.0-1
        command: [run-count]
        env:
          - name: SAMPLE
            value: "{{inputs.parameters.sample}}"
          - name: REFERENCE
            value: "{{inputs.parameters.reference}}"
          - name: RUN_ID
            value: "{{inputs.parameters.run-id}}"
          - name: CORES
            value: "{{inputs.parameters.cores}}"
          - name: MEM_GB
            value: "{{inputs.parameters.mem-gb}}"
          - name: AWS_DEFAULT_REGION
            value: us-west-2
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_SECRET_ACCESS_KEY
        volumeMounts:
          - name: work
            mountPath: /work
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 500Gi

    # Smoke test: bundled tiny dataset, no reads or reference needed.
    - name: testrun
      schedulerName: runai-scheduler
      priorityClassName: high
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/cellranger:10.1.0-1
        command: [bash, -c]
        args:
          - |
            set -euo pipefail
            cd /work
            cellranger testrun --id=check_install --localcores=4 --localmem=14
            OUT="s3://bloomv2-workflows/runs_output/argo_testrun_{{workflow.name}}"
            aws s3 sync check_install/outs "$OUT/outs/"
            echo "DONE -> $OUT"
        env:
          - name: AWS_DEFAULT_REGION
            value: us-west-2
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_SECRET_ACCESS_KEY
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
          limits:
            cpu: "4"
            memory: 16Gi
        volumeMounts:
          - name: work
            mountPath: /work
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 20Gi
