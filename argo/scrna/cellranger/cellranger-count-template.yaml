# Register once: argo template create argo/scrna/cellranger/cellranger-count-template.yaml -n runai-busch-lab
# After changes: kubectl replace -f argo/scrna/cellranger/cellranger-count-template.yaml -n runai-busch-lab
#
# Every step mounts the same NFS folder at /shared:
#   /shared/ref/<reference>/  references, downloaded once and kept
#   /shared/runs/<run-id>/    one sample's reads and QC files, deleted after success
# The share does not support symlinks, so Cell Ranger's working folder is the count pod's own /work.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cellranger-count-template
  labels:
    project: busch-lab
spec:
  templates:
    # One sample: stage -> qc -> count -> preprocess -> analyses -> build-h5ad -> load-dataset ->
    # cleanup, all in /shared/runs/<run-id>/ so runs never share files. The result leaves the
    # cluster only through load-dataset, into Bloom.
    - name: sample-pipeline
      inputs:
        parameters:
          - name: sample
          - name: reference
          - name: run-id
          # An S3 folder run reads exactly these files from the folder; empty reads raw_reads/<sample>/.
          - name: fastq-url
            value: ""
          - name: fastq-files
            value: ""
          # The dataset to load the result into Bloom as, and its species' common name (from the
          # run's form); empty loads nothing.
          - name: dataset-name
            value: ""
          - name: species-name
            value: ""
          - name: cores
            value: "16"
          - name: memory
            value: "64Gi"
          - name: mem-gb
            value: "60"
          - name: n-top-genes
            value: "2000"
      dag:
        tasks:
          - name: stage
            template: stage-sample
            arguments:
              parameters:
                - name: sample
                  value: "{{inputs.parameters.sample}}"
                - name: run-id
                  value: "{{inputs.parameters.run-id}}"
                - name: fastq-url
                  value: "{{inputs.parameters.fastq-url}}"
                - name: fastq-files
                  value: "{{inputs.parameters.fastq-files}}"
          - name: qc
            template: qc
            depends: stage
            arguments:
              parameters:
                - name: sample
                  value: "{{inputs.parameters.sample}}"
                - name: run-id
                  value: "{{inputs.parameters.run-id}}"
          - name: count
            template: count
            depends: qc
            arguments:
              parameters:
                - name: sample
                  value: "{{inputs.parameters.sample}}"
                - name: reference
                  value: "{{inputs.parameters.reference}}"
                - name: run-id
                  value: "{{inputs.parameters.run-id}}"
                - name: cores
                  value: "{{inputs.parameters.cores}}"
                - name: memory
                  value: "{{inputs.parameters.memory}}"
                - name: mem-gb
                  value: "{{inputs.parameters.mem-gb}}"
          - name: cleanup
            template: cleanup
            depends: load-dataset
            arguments:
              parameters:
                - name: run-id
                  value: "{{inputs.parameters.run-id}}"
          - name: preprocess
            template: preprocess
            depends: count
            arguments:
              parameters:
                - name: run-id
                  value: "{{inputs.parameters.run-id}}"
                - name: n-top-genes
                  value: "{{inputs.parameters.n-top-genes}}"
          # Analyses: each reads the base and writes its own part. A new one is one more task
          # here, and one more name in build-h5ad's depends.
          - name: cluster
            template: cluster
            depends: preprocess
            arguments:
              parameters:
                - name: run-id
                  value: "{{inputs.parameters.run-id}}"
          - name: build-h5ad
            template: build-h5ad
            depends: cluster
            arguments:
              parameters:
                - name: sample
                  value: "{{inputs.parameters.sample}}"
                - name: run-id
                  value: "{{inputs.parameters.run-id}}"
          - name: load-dataset
            template: load-dataset
            depends: build-h5ad
            arguments:
              parameters:
                - name: sample
                  value: "{{inputs.parameters.sample}}"
                - name: run-id
                  value: "{{inputs.parameters.run-id}}"
                - name: dataset-name
                  value: "{{inputs.parameters.dataset-name}}"
                - name: species-name
                  value: "{{inputs.parameters.species-name}}"

    # Once per workflow: stage the reference at /shared/ref/<reference>/, or reuse it if already there.
    - name: stage-reference
      inputs:
        parameters:
          - name: reference
      schedulerName: runai-scheduler
      priorityClassName: high
      retryStrategy:
        limit: 2
        retryPolicy: Always
        # exit 3 (no reference) and 4 (no FASTQs) will not fix themselves on a retry
        expression: "asInt(lastRetry.exitCode) != 3 && asInt(lastRetry.exitCode) != 4"
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/cellranger:10.1.0-11
        command: [run-with-log, --path, "scrna/{{workflow.name}}/stage-reference.log", --, bash, -c]
        args:
          - |
            set -euo pipefail
            case "${REFERENCE}" in
              ""|.|..|*/*) echo "ERROR: bad reference name '${REFERENCE}'"; exit 3 ;;
            esac
            ref="/shared/ref/${REFERENCE}"
            # References never change once uploaded, so a staged copy is reused as-is.
            if [ -f "${ref}/reference.json" ]; then
              echo "Reference ${REFERENCE} already staged at ${ref}; nothing to download."
              exit 0
            fi
            tmp="/shared/ref/.partial-${REFERENCE}-${WORKFLOW_NAME}"
            rm -rf -- "${tmp}"
            mkdir -p "${tmp}"
            aws s3 sync "s3://bloomv2-workflows/reference_genome/${REFERENCE}/" "${tmp}/"
            # sync from a missing prefix copies nothing and still exits 0
            if [ ! -f "${tmp}/reference.json" ]; then
              echo "ERROR: no Cell Ranger reference at s3://bloomv2-workflows/reference_genome/${REFERENCE}/ (expected reference.json)"
              rm -rf -- "${tmp}"
              exit 3
            fi
            # Publish with one rename so a half-copied reference never looks complete.
            if [ -f "${ref}/reference.json" ]; then
              echo "Reference ${REFERENCE} was staged by another run meanwhile; keeping that copy."
              rm -rf -- "${tmp}"
            else
              rm -rf -- "${ref}"
              mv -- "${tmp}" "${ref}"
              echo "Reference ${REFERENCE} staged at ${ref}"
            fi
        env:
          - name: REFERENCE
            value: "{{inputs.parameters.reference}}"
          - name: WORKFLOW_NAME
            value: "{{workflow.name}}"
          - name: AWS_DEFAULT_REGION
            value: us-west-2
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_SECRET_ACCESS_KEY
        resources:
          requests: {cpu: "2", memory: 4Gi}
          limits: {cpu: "2", memory: 4Gi}
        volumeMounts:
          # bloomctl's credentials.txt, for run-with-log to upload the step's log
          - name: bloom-credentials
            mountPath: /etc/bloom
            readOnly: true
          - name: shared
            mountPath: /shared
      volumes:
        - name: shared
          hostPath:
            path: /hpi/hpi_dev/users/bfernando/scrna
            type: Directory

    # For a run that imports its sample from SRA: download the runs into raw_reads/<sample>/ as
    # Illumina-named FASTQs, next to stage-reference. Outputs the folder's FASTQ count and size.
    - name: fetch-sra
      inputs:
        parameters:
          - name: sample
          - name: sra-runs
          - name: run-id
      outputs:
        parameters:
          - name: fastq-count
            valueFrom:
              path: /tmp/outputs/fastq_count
          - name: total-bytes
            valueFrom:
              path: /tmp/outputs/total_bytes
      schedulerName: runai-scheduler
      priorityClassName: high
      retryStrategy:
        limit: 1
        retryPolicy: Always
        # only a failed download (10) may be a blip; bad input (6), misnamed files (7),
        # unusable reads (11) and a taken folder (12) will not fix themselves
        expression: "asInt(lastRetry.exitCode) == 10"
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/cellranger:10.1.0-11
        command: [run-with-log, --path, "scrna/{{workflow.name}}/fetch-sra.log", --, fetch-sra]
        env:
          - name: SAMPLE
            value: "{{inputs.parameters.sample}}"
          - name: SRA_RUNS
            value: "{{inputs.parameters.sra-runs}}"
          - name: WORK_DIR
            value: "/shared/runs/{{inputs.parameters.run-id}}/sra"
          - name: THREADS
            value: "8"
          - name: OUTPUT_DIR
            value: /tmp/outputs
          - name: AWS_DEFAULT_REGION
            value: us-west-2
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_SECRET_ACCESS_KEY
        resources:
          requests: {cpu: "8", memory: 16Gi}
          limits: {cpu: "8", memory: 16Gi}
        volumeMounts:
          # bloomctl's credentials.txt, for run-with-log to upload the step's log
          - name: bloom-credentials
            mountPath: /etc/bloom
            readOnly: true
          - name: shared
            mountPath: /shared
      volumes:
        - name: shared
          hostPath:
            path: /hpi/hpi_dev/users/bfernando/scrna
            type: Directory

    # Create /shared/runs/<run-id>/ and copy the reads there, from the run's S3 folder or
    # raw_reads/<sample>/.
    - name: stage-sample
      inputs:
        parameters:
          - name: sample
          - name: run-id
          - name: fastq-url
            value: ""
          - name: fastq-files
            value: ""
      schedulerName: runai-scheduler
      priorityClassName: high
      retryStrategy:
        limit: 2
        retryPolicy: Always
        # exits 4 (no FASTQs), 6 (bad input), 7 (misnamed FASTQs), 8 (the folder changed) and
        # 9 (FASTQs for another sample) will not fix themselves on a retry
        expression: "asInt(lastRetry.exitCode) != 4 && asInt(lastRetry.exitCode) != 6 && asInt(lastRetry.exitCode) != 7 && asInt(lastRetry.exitCode) != 8 && asInt(lastRetry.exitCode) != 9"
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/cellranger:10.1.0-11
        command: [run-with-log, --path, "scrna/{{workflow.name}}/stage.log", --, bash, -c]
        args:
          - |
            set -euo pipefail
            # Fails here, before QC, if a file isn't Illumina-named, a lane lacks R1 or R2, or
            # the run's S3 folder changed since the run was started.
            RUN_DIR="/shared/runs/${RUN_ID}" DEST_DIR="/shared/runs/${RUN_ID}/fastq/${SAMPLE}" stage-fastqs
        env:
          - name: SAMPLE
            value: "{{inputs.parameters.sample}}"
          - name: RUN_ID
            value: "{{inputs.parameters.run-id}}"
          - name: FASTQ_URL
            value: "{{inputs.parameters.fastq-url}}"
          - name: FASTQ_FILES
            value: "{{inputs.parameters.fastq-files}}"
          - name: AWS_DEFAULT_REGION
            value: us-west-2
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: genericsecret-bloomv2-s3
                key: AWS_SECRET_ACCESS_KEY
        resources:
          requests: {cpu: "2", memory: 4Gi}
          limits: {cpu: "2", memory: 4Gi}
        volumeMounts:
          # bloomctl's credentials.txt, for run-with-log to upload the step's log
          - name: bloom-credentials
            mountPath: /etc/bloom
            readOnly: true
          - name: shared
            mountPath: /shared
      volumes:
        - name: shared
          hostPath:
            path: /hpi/hpi_dev/users/bfernando/scrna
            type: Directory

    # QC on the staged reads (run-qc's download finds them already there); the report stays in the run's folder.
    - name: qc
      inputs:
        parameters:
          - name: sample
          - name: run-id
      schedulerName: runai-scheduler
      priorityClassName: high
      retryStrategy:
        limit: 1
        retryPolicy: OnError
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/cellranger:10.1.0-11
        command: [run-with-log, --path, "scrna/{{workflow.name}}/qc.log", --, run-qc]
        env:
          - name: SAMPLE
            value: "{{inputs.parameters.sample}}"
          - name: RUN_ID
            value: "{{inputs.parameters.run-id}}"
          - name: CORES
            value: "4"
          - name: WORK_DIR
            value: "/shared/runs/{{inputs.parameters.run-id}}"
          # The report stays in the run's folder; only the final .h5ad goes to S3.
          - name: UPLOAD_REPORT
            value: "false"
          # The stage step has already copied the reads here.
          - name: DOWNLOAD_READS
            value: "false"
        resources:
          requests: {cpu: "4", memory: 8Gi}
          limits: {cpu: "4", memory: 8Gi}
        volumeMounts:
          # bloomctl's credentials.txt, for run-with-log to upload the step's log
          - name: bloom-credentials
            mountPath: /etc/bloom
            readOnly: true
          - name: shared
            mountPath: /shared
      volumes:
        - name: shared
          hostPath:
            path: /hpi/hpi_dev/users/bfernando/scrna
            type: Directory

    # cellranger count on the staged reads and shared reference; working files on the pod's own disk.
    - name: count
      inputs:
        parameters:
          - name: sample
          - name: reference
          - name: run-id
          - name: cores
          - name: memory
          - name: mem-gb
      schedulerName: runai-scheduler
      # CPU and memory come from parameters, so they are set when the pod starts, not at registration.
      podSpecPatch: |
        containers:
          - name: main
            resources:
              requests:
                cpu: "{{inputs.parameters.cores}}"
                memory: "{{inputs.parameters.memory}}"
              limits:
                cpu: "{{inputs.parameters.cores}}"
                memory: "{{inputs.parameters.memory}}"
      # Non-preemptible class used by the sleap-roots trait-extractor; confirm with the cluster admin.
      priorityClassName: high
      retryStrategy:
        limit: 2
        retryPolicy: Always
        # exit 3 (no reference), 4 (no FASTQs), 6 (unusable sample name) and 7 (misnamed FASTQs)
        # will not fix themselves on a retry
        expression: "asInt(lastRetry.exitCode) != 3 && asInt(lastRetry.exitCode) != 4 && asInt(lastRetry.exitCode) != 6 && asInt(lastRetry.exitCode) != 7"
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/cellranger:10.1.0-11
        command: [run-with-log, --path, "scrna/{{workflow.name}}/count.log", --, run-count]
        env:
          - name: SAMPLE
            value: "{{inputs.parameters.sample}}"
          - name: REFERENCE
            value: "{{inputs.parameters.reference}}"
          - name: RUN_ID
            value: "{{inputs.parameters.run-id}}"
          - name: CORES
            value: "{{inputs.parameters.cores}}"
          - name: MEM_GB
            value: "{{inputs.parameters.mem-gb}}"
          - name: WORK_DIR
            value: /work
          - name: RESULTS_DIR
            value: "/shared/runs/{{inputs.parameters.run-id}}"
          - name: FASTQ_DIR
            value: "/shared/runs/{{inputs.parameters.run-id}}/fastq/{{inputs.parameters.sample}}"
          - name: REF_DIR
            value: "/shared/ref/{{inputs.parameters.reference}}"
        volumeMounts:
          # bloomctl's credentials.txt, for run-with-log to upload the step's log
          - name: bloom-credentials
            mountPath: /etc/bloom
            readOnly: true
          - name: shared
            mountPath: /shared
          - name: work
            mountPath: /work
      volumes:
        - name: shared
          hostPath:
            path: /hpi/hpi_dev/users/bfernando/scrna
            type: Directory
        - name: work
          emptyDir:
            sizeLimit: 500Gi

    # Delete /shared/runs/<run-id>/ once its result is in Bloom; the raw reads stay where they came from.
    - name: cleanup
      inputs:
        parameters:
          - name: run-id
      schedulerName: runai-scheduler
      priorityClassName: high
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/cellranger:10.1.0-11
        command: [run-with-log, --path, "scrna/{{workflow.name}}/cleanup.log", --, bash, -c]
        args:
          - |
            set -euo pipefail
            case "${RUN_ID}" in
              ""|.|..|*/*) echo "refusing to delete: bad run id '${RUN_ID}'"; exit 1 ;;
            esac
            target="/shared/runs/${RUN_ID}"
            if [ -d "${target}" ]; then rm -rf -- "${target}"; fi
            echo "removed ${target}"
        env:
          - name: RUN_ID
            value: "{{inputs.parameters.run-id}}"
        resources:
          requests: {cpu: "0.5", memory: 512Mi}
          limits: {cpu: "0.5", memory: 512Mi}
        volumeMounts:
          # bloomctl's credentials.txt, for run-with-log to upload the step's log
          - name: bloom-credentials
            mountPath: /etc/bloom
            readOnly: true
          - name: shared
            mountPath: /shared
      volumes:
        - name: shared
          hostPath:
            path: /hpi/hpi_dev/users/bfernando/scrna
            type: Directory

    # /shared/runs/<run-id>/: count matrix -> analysis/preprocess/base.h5ad (filter, normalise, variable genes, PCA).
    - name: preprocess
      inputs:
        parameters:
          - name: run-id
          - name: n-top-genes
      schedulerName: runai-scheduler
      priorityClassName: high
      retryStrategy:
        limit: 1
        retryPolicy: Always
        # 13 (too few cells), 14 (no count matrix) and 15 (parts don't fit) won't fix themselves
        expression: "asInt(lastRetry.exitCode) != 13 && asInt(lastRetry.exitCode) != 14 && asInt(lastRetry.exitCode) != 15"
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/scrna-analysis:0.1.2
        # Named here: Argo can't read the private image's entrypoint without the pull secret.
        command: [run-with-log, --path, "scrna/{{workflow.name}}/preprocess.log", --, scrna-analysis]
        args: [preprocess, "--root", "/shared/runs/{{inputs.parameters.run-id}}", "--n-top-genes", "{{inputs.parameters.n-top-genes}}"]
        resources:
          requests: {cpu: "4", memory: 16Gi}
          limits: {cpu: "4", memory: 16Gi}
        volumeMounts:
          # bloomctl's credentials.txt, for run-with-log to upload the step's log
          - name: bloom-credentials
            mountPath: /etc/bloom
            readOnly: true
          - name: shared
            mountPath: /shared
      volumes:
        - name: shared
          hostPath:
            path: /hpi/hpi_dev/users/bfernando/scrna
            type: Directory

    # Base -> analysis/cluster/part.h5ad: neighbour graph, Leiden clusters, UMAP.
    - name: cluster
      inputs:
        parameters:
          - name: run-id
      schedulerName: runai-scheduler
      priorityClassName: high
      retryStrategy:
        limit: 1
        retryPolicy: Always
        # 13 (too few cells), 14 (no count matrix) and 15 (parts don't fit) won't fix themselves
        expression: "asInt(lastRetry.exitCode) != 13 && asInt(lastRetry.exitCode) != 14 && asInt(lastRetry.exitCode) != 15"
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/scrna-analysis:0.1.2
        # Named here: Argo can't read the private image's entrypoint without the pull secret.
        command: [run-with-log, --path, "scrna/{{workflow.name}}/cluster.log", --, scrna-analysis]
        args: [cluster, "--root", "/shared/runs/{{inputs.parameters.run-id}}"]
        resources:
          requests: {cpu: "4", memory: 8Gi}
          limits: {cpu: "4", memory: 8Gi}
        volumeMounts:
          # bloomctl's credentials.txt, for run-with-log to upload the step's log
          - name: bloom-credentials
            mountPath: /etc/bloom
            readOnly: true
          - name: shared
            mountPath: /shared
      volumes:
        - name: shared
          hostPath:
            path: /hpi/hpi_dev/users/bfernando/scrna
            type: Directory

    # Base + every finished part -> h5ad/<sample>.h5ad and summary.json, in the run's folder.
    - name: build-h5ad
      inputs:
        parameters:
          - name: sample
          - name: run-id
      schedulerName: runai-scheduler
      priorityClassName: high
      retryStrategy:
        limit: 1
        retryPolicy: Always
        # 13 (too few cells), 14 (no count matrix) and 15 (parts don't fit) won't fix themselves
        expression: "asInt(lastRetry.exitCode) != 13 && asInt(lastRetry.exitCode) != 14 && asInt(lastRetry.exitCode) != 15"
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/scrna-analysis:0.1.2
        # Named here: Argo can't read the private image's entrypoint without the pull secret.
        command: [run-with-log, --path, "scrna/{{workflow.name}}/build-h5ad.log", --, scrna-analysis]
        args: [build-h5ad, "--root", "/shared/runs/{{inputs.parameters.run-id}}", "--sample", "{{inputs.parameters.sample}}"]
        resources:
          requests: {cpu: "4", memory: 16Gi}
          limits: {cpu: "4", memory: 16Gi}
        volumeMounts:
          # bloomctl's credentials.txt, for run-with-log to upload the step's log
          - name: bloom-credentials
            mountPath: /etc/bloom
            readOnly: true
          - name: shared
            mountPath: /shared
      volumes:
        - name: shared
          hostPath:
            path: /hpi/hpi_dev/users/bfernando/scrna
            type: Directory

    # Loads the final .h5ad into Bloom as the run's dataset, with bloomctl signed in as the
    # pipeline (argo/scrna/analysis/load-dataset.sh). A run naming no dataset loads nothing.
    - name: load-dataset
      inputs:
        parameters:
          - name: sample
          - name: run-id
          - name: dataset-name
          - name: species-name
      schedulerName: runai-scheduler
      priorityClassName: high
      # One gene's counts file at a time: about 30,000 uploads for a typical run.
      activeDeadlineSeconds: 21600
      retryStrategy:
        limit: 2
        retryPolicy: Always
        # bloomctl refuses to resume for 330 s after a write it couldn't confirm.
        backoff:
          duration: "6m"
          factor: 1
        # A retry resumes the load. 2 (usage), 6 (bad input) and 16 (no credentials) won't fix themselves.
        expression: "asInt(lastRetry.exitCode) != 2 && asInt(lastRetry.exitCode) != 6 && asInt(lastRetry.exitCode) != 16"
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/scrna-analysis:0.1.2
        command: [run-with-log, --path, "scrna/{{workflow.name}}/load-dataset.log", --, load-dataset]
        env:
          - name: SAMPLE
            value: "{{inputs.parameters.sample}}"
          - name: RUN_ID
            value: "{{inputs.parameters.run-id}}"
          - name: DATASET_NAME
            value: "{{inputs.parameters.dataset-name}}"
          - name: SPECIES_NAME
            value: "{{inputs.parameters.species-name}}"
        resources:
          requests: {cpu: "2", memory: 8Gi}
          limits: {cpu: "2", memory: 8Gi}
        volumeMounts:
          # bloomctl's credentials.txt: run-with-log uploads the log, and bloomctl loads the dataset
          - name: bloom-credentials
            mountPath: /etc/bloom
            readOnly: true
          - name: shared
            mountPath: /shared
      volumes:
        - name: shared
          hostPath:
            path: /hpi/hpi_dev/users/bfernando/scrna
            type: Directory

    # Smoke test: bundled tiny dataset, no reads or reference needed.
    - name: testrun
      schedulerName: runai-scheduler
      priorityClassName: high
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/cellranger:10.1.0-11
        command: [bash, -c]
        args:
          - |
            set -euo pipefail
            cd /work
            cellranger testrun --id=check_install --localcores=4 --localmem=14
            echo "Cell Ranger testrun passed"
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
          limits:
            cpu: "4"
            memory: 16Gi
        volumeMounts:
          - name: work
            mountPath: /work
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 20Gi
