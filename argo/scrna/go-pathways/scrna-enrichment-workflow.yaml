# A dataset's GO and KEGG pathway enrichment, started by hand (go-pathways-template's
# scrna-enrichment): its newest complete differential expression analysis (or de-run-id),
# tested against its genome version's ready annotation (source eggnog, or tair-go), and recorded
# in Bloom as an enrichment run. A dataset not yet linked to a genome version is linked to the
# annotation's. Signs in to staging's Bloom; for prod, use
# genericsecret-bloom-prod-pipeline-credentials:
#   argo submit argo/scrna/go-pathways/scrna-enrichment-workflow.yaml -n runai-busch-lab \
#     -p dataset-id=25 -p genome=sbicolor.btx623.hpiv3.v1 --watch
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: scrna-enrichment-
  namespace: runai-busch-lab
  labels:
    project: busch-lab
spec:
  entrypoint: main
  # Step pods report results as bloom-workflow; without it every step fails on workflowtaskresults.
  serviceAccountName: bloom-workflow
  imagePullSecrets:
    - name: dockerregistry-bloom-ghcr-pull   # from the busch-lab Run:ai credential bloom-ghcr-pull
  ttlStrategy:
    secondsAfterCompletion: 86400
  arguments:
    parameters:
      - name: dataset-id
      - name: genome
      - name: source
        value: eggnog
      - name: de-run-id
        value: ""
  # The pipeline's Bloom login: the steps read and record with it, and run-with-log uses it.
  volumes:
    - name: bloom-credentials
      secret:
        secretName: genericsecret-bloom-staging-pipeline-credentials
        optional: true
  templates:
    - name: main
      dag:
        tasks:
          - name: enrichment
            templateRef:
              name: go-pathways-template
              template: scrna-enrichment
            arguments:
              parameters:
                - {name: dataset-id, value: "{{workflow.parameters.dataset-id}}"}
                - {name: run-id, value: "{{workflow.name}}"}
                - {name: genome, value: "{{workflow.parameters.genome}}"}
                - {name: source, value: "{{workflow.parameters.source}}"}
                - {name: de-run-id, value: "{{workflow.parameters.de-run-id}}"}
