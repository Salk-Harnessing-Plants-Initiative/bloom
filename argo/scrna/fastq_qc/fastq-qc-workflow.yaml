# argo submit argo/scrna/fastq_qc/fastq-qc-workflow.yaml -n runai-busch-lab -p samples='["sample_a","sample_b"]'
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: fastq-qc-
  namespace: runai-busch-lab
  labels:
    project: busch-lab
spec:
  entrypoint: main
  serviceAccountName: bloom-workflow
  imagePullSecrets:
    - name: dockerregistry-bloom-ghcr-pull   # from the busch-lab Run:ai credential bloom-ghcr-pull
  ttlStrategy:
    secondsAfterCompletion: 86400
  arguments:
    parameters:
      - name: samples
        value: '[]'
  templates:
    - name: main
      dag:
        tasks:
          - name: fastq-qc
            templateRef:
              name: fastq-qc-template
              template: fastq-qc
            withParam: "{{workflow.parameters.samples}}"
            arguments:
              parameters:
                - name: sample
                  value: "{{item}}"
                - name: run-id
                  value: "{{item}}"
